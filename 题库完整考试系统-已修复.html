<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>题库完整考试系统（已修复）</title>
<style>

*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
.app{max-width:1180px;margin:auto;padding:14px}header,.card,.modal{background:#fff;border:1px solid #e2e7ef;border-radius:16px;box-shadow:0 4px 18px #1b315010}
header{padding:18px;margin-bottom:12px}h1{margin:0 0 5px;font-size:23px}.muted{color:#6b7485;font-size:13px}
.tabs{display:flex;gap:8px;margin-top:14px;overflow:auto}.tab{border:1px solid #d8deea;background:#fff;border-radius:10px;padding:10px 16px;white-space:nowrap;cursor:pointer;font-weight:600}.tab.active{background:#2f6fed;color:#fff;border-color:#2f6fed}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}select{height:40px;border:1px solid #d7deea;border-radius:9px;padding:0 10px;background:#fff}button{cursor:pointer}.btn{height:40px;border:1px solid #d7deea;border-radius:9px;background:#fff;padding:0 14px;font-weight:600}.primary{background:#2f6fed;color:#fff;border-color:#2f6fed}.danger{color:#b42318}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.stat{min-width:105px;padding:9px 12px;border:1px solid #e3e7ee;border-radius:10px;background:#fafbfc}.stat b{display:block;font-size:20px}
.layout{display:grid;grid-template-columns:1fr 280px;gap:12px}.question{padding:22px;min-height:480px}.meta{display:flex;gap:6px;flex-wrap:wrap}.tag{background:#eef4ff;color:#315ca8;border-radius:99px;padding:5px 9px;font-size:12px}
.q{font-size:20px;line-height:1.6;font-weight:700;margin:14px 0}.option{display:flex;gap:10px;padding:13px;border:1px solid #dce2ec;border-radius:11px;margin:9px 0;cursor:pointer}.option.selected{background:#eef4ff;border-color:#6f9cf5}.option.correct{background:#eefaf4;border-color:#76c9a0}.option.wrong{background:#fff2f1;border-color:#e99a93}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.explain{margin-top:16px;padding:14px;background:#f7f8fb;border-radius:10px;line-height:1.65}
.side{padding:14px;position:sticky;top:10px;height:max-content;max-height:calc(100vh - 30px);overflow:auto}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.num{height:32px;border:1px solid #dce2ec;background:#fff;border-radius:7px;font-size:12px}.num.current{outline:2px solid #2f6fed}.num.done{background:#eef4ff}.num.right{background:#eaf8f1;border-color:#82cfab}.num.wrong{background:#fff0ef;border-color:#e8a099}
.progress{height:7px;background:#edf0f5;border-radius:99px;margin-top:12px;overflow:hidden}.bar{height:100%;background:#2f6fed;width:0}.panel{padding:20px}.hidden{display:none!important}
.resultbox{text-align:center;padding:25px}.score{font-size:52px;font-weight:800}.analysis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.analysis div{padding:15px;background:#f7f8fb;border-radius:10px}
.modal{position:fixed;inset:0;margin:auto;width:min(520px,92vw);height:max-content;padding:22px;z-index:5;display:none}.modal.show{display:block}.backdrop{position:fixed;inset:0;background:#17203366;display:none;z-index:4}.backdrop.show{display:block}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e8ebf0;text-align:left}
@media(max-width:820px){.controls{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.side{position:static;max-height:none}.q{font-size:18px}.analysis{grid-template-columns:1fr}}
@media(max-width:500px){.controls{grid-template-columns:1fr}.question{padding:16px}}

.notice{margin-top:10px;padding:10px 12px;border-radius:10px;background:#fff7e8;border:1px solid #f1d9a6;color:#7a5b16;font-size:13px;line-height:1.55}
.errbox{padding:16px;background:#fff2f1;border:1px solid #e99a93;border-radius:12px;color:#8a1f16}
</style>
</head>
<body>
<noscript><div class="app"><div class="card panel errbox">当前环境禁用了 JavaScript，题库无法运行。请用 Chrome / 系统浏览器打开本文件，不要用微信/QQ 内置预览。</div></div></noscript>
<div class="app">
<header>
<h1>题库完整考试系统</h1>
<div class="muted">共 527 道题｜判断题已补全选项｜记录保存在本机浏览器</div>
<div class="notice">若页面按钮点了没反应：请先把文件保存到手机，再用 <b>Chrome</b> 打开；不要用微信、QQ、WPS 内部预览。打开方式：用文件管理器找到本 HTML → 打开方式选 Chrome。</div>
<div class="tabs">
<button class="tab active" onclick="setTab('practice',this)">学习练习</button>
<button class="tab" onclick="setTab('exam',this)">模拟考试</button>
<button class="tab" onclick="setTab('wrong',this)">错题本</button>
<button class="tab" onclick="setTab('fav',this)">收藏题</button>
<button class="tab" onclick="setTab('history',this)">成绩记录</button>
</div>
<div id="filters" class="controls">
<select id="disease"><option value="">全部病种</option>
<option>发热伴血小板减少综合征</option><option>基孔肯雅热</option><option>布鲁氏菌病</option>
<option>手足口病</option><option>新冠病毒感染</option><option>流感</option>
<option>猩红热</option><option>疟疾</option><option>登革热</option>
<option>诺如病毒</option><option>霍乱</option><option>食源性疾病</option>
</select>
<select id="type"><option value="">全部题型</option><option>判断题</option><option>单选题</option><option>多选题</option></select>
<select id="difficulty"><option value="">全部难度</option><option>困难</option><option>简单</option></select>
<select id="count"><option value="0">全部题目</option><option value="10">10题</option><option value="20">20题</option><option value="50">50题</option><option value="100">100题</option></select>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
<button class="btn primary" onclick="start('practice')">开始练习</button>

</div>
<div class="stats">

<div class="stat"><b id="stDone">0</b>已提交</div>
<div class="stat"><b id="stRight">0</b>答对</div>
<div class="stat"><b id="stRate">0%</b>正确率</div>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>

<div id="content"></div>
</div>

<p class="muted">随机抽题，交卷后统一显示成绩和解析。</p>
<p>题数：<select id="examCount"><option>10</option><option>20</option><option selected>50</option><option>100</option></select>
　时间：<select id="examTime"><option>10</option><option>20</option><option selected>30</option><option>60</option><option>90</option></select> 分钟</p>
<button class="btn primary" onclick="confirmExam()">开始考试</button>
<button class="btn" onclick="closeModal()">取消</button>
</div>
<script>
const Q=[{"id":1,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"1、霍乱的主要传播途径是？","options":["A、呼吸道飞沫传播","B、消化道传播","C、血液传播","D、虫媒传播","E、接触传播"],"answer":"B","explain":"霍乱是由霍乱弧菌引起的急性肠道传染病，主要通过消化道传播，患者的粪便、呕吐物污染水源、食物后，可造成疾病的传播。"},{"id":2,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"2、下列哪项是霍乱的典型临床表现？","options":["A、高热、咳嗽、呼吸困难","B、剧烈呕吐、腹泻，米泔水样便","C、腹痛、腹泻、脓血便","D、皮疹、淋巴结肿大","E、尿频、尿急、尿痛"],"answer":"B","explain":"霍乱的典型临床表现为剧烈呕吐、腹泻，粪便呈米泔水样，无腹痛、无发热，严重者可出现脱水、电解质紊乱、循环衰竭。"},{"id":3,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"3、霍乱的高发季节通常是？","options":["A、春夏季","B、夏秋季","C、秋冬季","D、冬春季","E、全年无明显高峰"],"answer":"B","explain":"霍乱在我国的高发季节通常是夏秋季，每年的5月至10月是霍乱的主要流行期，此时气温高，湿度大，适合霍乱弧菌的生长繁殖。"},{"id":4,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"4、下列哪类人群是霍乱的高危人群？","options":["A、青壮年","B、65岁以上老年人","C、大学生","D、公司职员","E、户外工作者"],"answer":"B","explain":"65岁以上老年人、婴幼儿、孕妇、有慢性基础疾病的人群是霍乱的高危人群，感染后易出现严重脱水、循环衰竭等并发症。"},{"id":5,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"5、预防霍乱最有效的手段是？","options":["A、服用抗生素","B、接种霍乱疫苗","C、保持饮水和饮食卫生","D、加强营养","E、减少外出"],"answer":"C","explain":"霍乱疫苗仅有O1群的，没有O139群。"},{"id":6,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"6、霍乱的病原体是？","options":["A、大肠杆菌","B、霍乱弧菌","C、痢疾杆菌","D、伤寒杆菌","E、沙门氏菌"],"answer":"B","explain":"霍乱的病原体是霍乱弧菌，是一种革兰氏阴性菌，具有鞭毛，运动活泼，可产生霍乱肠毒素，导致患者出现剧烈呕吐、腹泻。"},{"id":7,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"7、下列哪种不是霍乱的常见并发症？","options":["A、脱水","B、电解质紊乱","C、循环衰竭","D、糖尿病","E、急性肾功能衰竭"],"answer":"D","explain":"霍乱的常见并发症包括脱水、电解质紊乱、循环衰竭、急性肾功能衰竭等，糖尿病不是霍乱的并发症。"},{"id":8,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"8、霍乱的潜伏期一般为多长时间？","options":["A、1-3天","B、5-7天","C、7-14天","D、14-21天","E、1个月以上"],"answer":"A","explain":"霍乱的潜伏期一般为1-3天，最短可至数小时，最长不超过5天。"},{"id":9,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"9、霍乱是《中华人民共和国传染病防治法》规定的哪类传染病？","options":["A、甲类","B、乙类","C、丙类","D、丁类","E、未分类"],"answer":"A","explain":"霍乱是《中华人民共和国传染病防治法》规定的甲类传染病。"},{"id":10,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"10、霍乱患者出现以下哪种情况时，提示可能发展为重症？","options":["A、轻微呕吐、腹泻，无脱水","B、剧烈呕吐、腹泻，伴严重脱水、意识改变","C、轻微乏力，食欲减退","D、腹痛、腹泻，脓血便","E、轻微头痛"],"answer":"B","explain":"霍乱患者出现剧烈呕吐、腹泻，伴严重脱水、意识改变、血压下降等症状时，提示可能发展为重症，需及时就医。"},{"id":11,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"11、下列哪项是霍乱与细菌性痢疾的主要区别？","options":["A、霍乱的呕吐、腹泻更剧烈，粪便呈米泔水样，无腹痛；细菌性痢疾以腹痛、腹泻、脓血便为主","B、霍乱的发热温度更高","C、霍乱的病程更短","D、霍乱的传染性更弱","E、霍乱的并发症更少"],"answer":"A","explain":"霍乱与细菌性痢疾的主要区别在于，霍乱的呕吐、腹泻更剧烈，粪便呈米泔水样，无腹痛、无发热；而细菌性痢疾以腹痛、腹泻、脓血便、里急后重为主要表现，可伴有发热。"},{"id":12,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"12、霍乱的最佳治疗时间是？","options":["A、发病后24小时内","B、发病后48小时内","C、发病后72小时内","D、发病后1周内","E、发病后2周内"],"answer":"A","explain":"霍乱的最佳治疗时间是发病后24小时内，尽早进行补液、抗感染治疗可显著降低重症率和死亡率。"},{"id":13,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"13、下列哪种人群不建议接种霍乱减毒活疫苗？","options":["A、前往卫生薄弱地区的旅行者","B、3-17岁的儿童和青少年","C、孕妇","D、健康成年人","E、65岁以上老年人"],"answer":"C","explain":"孕妇、免疫功能低下者、有严重基础疾病的人群不建议接种霍乱减毒活疫苗，可选择接种灭活霍乱疫苗。"},{"id":14,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"14、下列哪项措施可以有效减少霍乱的传播？","options":["A、与霍乱患者密切接触时不戴口罩","B、勤洗手，保持手卫生，不喝生水，不吃生冷食物","C、在密闭空间内聚集","D、不通风，保持室内温暖","E、共用毛巾、餐具"],"answer":"B","explain":"勤洗手、保持手卫生，不喝生水，不吃生冷、不洁的食物，正确佩戴口罩，保持社交距离，加强室内通风，避免与霍乱患者密切接触等措施可以有效减少霍乱的传播。"},{"id":15,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"15、霍乱的确诊主要依靠？","options":["A、临床症状","B、血常规检查","C、粪便培养霍乱弧菌阳性","D、胸部CT检查","E、血培养"],"answer":"C","explain":"霍乱的确诊主要依靠粪便培养，检出霍乱弧菌阳性是确诊的金标准，也可通过快速检测方法检测粪便中的霍乱弧菌抗原或核酸。"},{"id":16,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"16、下列哪种是霍乱的粪便典型表现？","options":["A、脓血便","B、米泔水样便","C、果酱样便","D、黑便","E、白陶土样便"],"answer":"B","explain":"霍乱的粪便典型表现为米泔水样便，无粪质，无脓血，无腹痛，这是霍乱与其他肠道传染病的重要区别。"},{"id":17,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"17、霍乱的治疗原则不包括？","options":["A、严格隔离","B、及时补液，纠正脱水和电解质紊乱","C、尽早抗感染治疗","D、常规使用糖皮质激素","E、对症支持治疗"],"answer":"D","explain":"霍乱的治疗原则包括严格隔离、及时补液纠正脱水和电解质紊乱、尽早抗感染治疗、对症支持治疗等，常规使用糖皮质激素是错误的，糖皮质激素不能用于霍乱的常规治疗。"},{"id":18,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"18、发现霍乱确诊病例后，网络直报的时限是？","options":["A、2小时内","B、6小时内","C、12小时内","D、24小时内","E、48小时内"],"answer":"A","explain":"发现疑似、临床诊断及确诊霍乱病例，应立即向疫情主管部门报告，在2小时内进行网络直报。"},{"id":19,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"19、霍乱患者的隔离期限一般为？","options":["A、症状消失后1天","B、症状消失后3天，粪便培养连续2次阴性","C、症状消失后7天","D、症状消失后14天","E、症状消失后21天"],"answer":"B","explain":"霍乱患者的隔离期限一般为症状消失后3天，且粪便培养连续2次阴性，可解除隔离。"},{"id":20,"disease":"霍乱","type":"单选题","difficulty":"简单","q":"20、下列哪项是霍乱的主要死亡原因？","options":["A、严重脱水、循环衰竭","B、心肌炎","C、脑炎","D、肾功能衰竭","E、肝功能衰竭"],"answer":"A","explain":"霍乱的主要死亡原因是严重脱水、循环衰竭，患者因剧烈呕吐、腹泻导致大量水分和电解质丢失，若不及时补液，可迅速出现循环衰竭，导致死亡。"},{"id":21,"disease":"霍乱","type":"单选题","difficulty":"困难","q":"21、下列哪种霍乱弧菌是引起霍乱大流行的主要病原体？","options":["A、霍乱弧菌O1群古典生物型","B、霍乱弧菌O1群埃尔托生物型","C、霍乱弧菌O139群","D、以上都是","E、以上都不是"],"answer":"D","explain":"霍乱弧菌O1群古典生物型、埃尔托生物型和O139群均可引起霍乱的流行，其中O1群埃尔托生物型是目前全球霍乱流行的主要病原体。"},{"id":22,"disease":"霍乱","type":"单选题","difficulty":"困难","q":"22、霍乱确诊病例的病原学金标准是？","options":["A、动力-制动试验阳性","B、粪便培养到O1群或O139群霍乱弧菌产毒株","C、霍乱弧菌抗原检测阳性","D、核酸检测阳性","E、便常规见大量白细胞"],"answer":"B","explain":"粪便、呕吐物或肛拭子培养到O1群或O139群霍乱弧菌产毒株是霍乱确诊的金标准。"},{"id":23,"disease":"霍乱","type":"单选题","difficulty":"困难","q":"23、霍乱疫苗全程接种有几剂次？","options":["A、1","B、2","C、3","D、4","E、5"],"answer":"C","explain":"霍乱疫苗全程3剂次，第0天、第7天、第28天，每次1粒口服胶囊，1个月内完成全程"},{"id":24,"disease":"霍乱","type":"单选题","difficulty":"困难","q":"24、霍乱患者的粪便培养中，下列哪种培养基是霍乱弧菌的选择性培养基？","options":["A、血琼脂培养基","B、麦康凯培养基","C、碱性蛋白胨水","D、巧克力培养基","E、沙堡培养基"],"answer":"C","explain":"碱性蛋白胨水是霍乱弧菌的选择性培养基，霍乱弧菌在碱性环境中生长繁殖良好，而其他肠道细菌在碱性环境中生长受到抑制。"},{"id":25,"disease":"霍乱","type":"单选题","difficulty":"困难","q":"25、下列哪种人群感染霍乱后，重症率和死亡率最高？","options":["A、婴幼儿","B、65岁以上老年人","C、孕妇","D、青壮年","E、儿童"],"answer":"B","explain":"65岁以上老年人感染霍乱后，由于机体免疫力下降，且多合并慢性基础疾病，重症率和死亡率显著高于其他人群。"},{"id":26,"disease":"霍乱","type":"单选题","difficulty":"困难","q":"26、霍乱的抗感染治疗中，抗生素的最佳给药时间是发病后多少小时内？","options":["A、12小时","B、24小时","C、48小时","D、72小时","E、96小时"],"answer":"B","explain":"霍乱的抗感染治疗中，抗生素的最佳给药时间是发病后24小时内，尽早给药可有效缩短病程，减少腹泻量，降低重症率和死亡率。"},{"id":27,"disease":"霍乱","type":"单选题","difficulty":"困难","q":"27、下列哪项是霍乱与食物中毒的主要区别？","options":["A、霍乱的呕吐、腹泻更剧烈，粪便呈米泔水样，无腹痛；食物中毒以腹痛、腹泻、呕吐为主，粪便多为黄色稀便","B、霍乱的发热温度更高","C、霍乱的病程更长","D、霍乱的传染性更弱","E、霍乱的并发症更少"],"answer":"A","explain":"霍乱与食物中毒的主要区别在于，霍乱的呕吐、腹泻更剧烈，粪便呈米泔水样，无腹痛、无发热，潜伏期短，可在数小时内发病；而食物中毒以腹痛、腹泻、呕吐为主，粪便多为黄色稀便，可伴有发热，潜伏期一般为1-24小时。"},{"id":28,"disease":"霍乱","type":"单选题","difficulty":"困难","q":"28、下列哪种是霍乱弧菌的主要致病物质？","options":["A、内毒素","B、外毒素","C、霍乱肠毒素","D、溶血素","E、凝固酶"],"answer":"C","explain":"霍乱弧菌的主要致病物质是霍乱肠毒素，是一种外毒素，可作用于小肠黏膜上皮细胞，导致细胞内cAMP水平升高，引起肠道分泌大量水分和电解质，导致患者出现剧烈呕吐、腹泻。"},{"id":29,"disease":"霍乱","type":"单选题","difficulty":"困难","q":"29、霍乱疫苗属于那种疫苗？","options":["A、死疫苗","B、减毒活疫苗","C、RNA疫苗","D、DNA疫苗","E、亚单位疫苗"],"answer":"A","explain":"霍乱疫苗属于减毒活疫苗，需要口服"},{"id":30,"disease":"霍乱","type":"单选题","difficulty":"困难","q":"30、下列哪项是预防霍乱传播的最关键措施？","options":["A、接种疫苗","B、正确佩戴口罩","C、勤洗手，不喝生水，不吃生冷不洁食物","D、保持社交距离","E、加强室内通风"],"answer":"C","explain":"勤洗手，不喝生水，不吃生冷、不洁的食物是预防霍乱传播的最关键措施，因为霍乱主要通过消化道传播，把好\"病从口入\"关是预防霍乱的核心。"},{"id":31,"disease":"霍乱","type":"多选题","difficulty":"简单","q":"31、霍乱的传播途径包括？","options":["A、消化道传播","B、接触传播","C、呼吸道飞沫传播","D、血液传播","E、虫媒传播"],"answer":"AB","explain":"霍乱主要通过消化道传播，也可通过接触传播，患者的粪便、呕吐物污染水源、食物、物品后，可造成疾病的传播，一般不会通过呼吸道飞沫、血液、虫媒传播。"},{"id":32,"disease":"霍乱","type":"多选题","difficulty":"简单","q":"32、下列哪些措施可以有效预防霍乱的感染？","options":["A、接种霍乱疫苗","B、勤洗手，保持手卫生","C、不喝生水，不吃生冷不洁食物","D、保持社交距离","E、长期服用抗生素"],"answer":"ABCD","explain":"接种霍乱疫苗、勤洗手、保持手卫生、不喝生水、不吃生冷不洁的食物、保持社交距离等措施可以有效预防霍乱的感染，长期服用抗生素对霍乱无效，还可能导致耐药性。"},{"id":33,"disease":"霍乱","type":"多选题","difficulty":"简单","q":"33、霍乱的常见并发症包括？","options":["A、脱水","B、电解质紊乱","C、循环衰竭","D、急性肾功能衰竭","E、糖尿病"],"answer":"ABCD","explain":"霍乱的常见并发症包括脱水、电解质紊乱、循环衰竭、急性肾功能衰竭等，糖尿病不是霍乱的并发症。"},{"id":34,"disease":"霍乱","type":"多选题","difficulty":"简单","q":"34、下列哪些是霍乱的诊断依据？","options":["A、流行病学史","B、临床表现","C、粪便培养霍乱弧菌阳性","D、霍乱肠毒素毒力基因阳性","E、尿常规检查"],"answer":"ABCD","explain":"霍乱的诊断需要结合流行病学史、临床表现、粪便培养霍乱弧菌阳性等结果综合判断，粪便培养霍乱肠毒素产毒株是确诊的金标准，血常规、尿常规检查不能作为确诊依据。"},{"id":35,"disease":"霍乱","type":"多选题","difficulty":"困难","q":"35、下列哪些霍乱弧菌可引起人类霍乱？","options":["A、霍乱弧菌O1群古典生物型","B、霍乱弧菌O1群埃尔托生物型","C、霍乱弧菌O139群","D、霍乱弧菌非O1非O139群","E、以上都是"],"answer":"ABC","explain":"霍乱弧菌O1群古典生物型、埃尔托生物型和O139群均可引起人类霍乱，非O1非O139群霍乱弧菌一般不引起霍乱，仅可引起轻微的肠道感染。"},{"id":36,"disease":"霍乱","type":"多选题","difficulty":"困难","q":"36、霍乱患者出现严重脱水时，下列哪些治疗措施是正确的？","options":["A、快速静脉补液","B、纠正电解质紊乱","C、抗感染治疗","D、对症支持治疗","E、常规使用糖皮质激素"],"answer":"ABCD","explain":"霍乱患者出现严重脱水时，需要快速静脉补液、纠正电解质紊乱、抗感染治疗、对症支持治疗等综合治疗措施；糖皮质激素仅在经补液治疗后血压仍不回升时使用，不常规使用。"},{"id":37,"disease":"霍乱","type":"多选题","difficulty":"困难","q":"37、下列哪些是影响霍乱患者预后的关键因素？","options":["A、年龄","B、基础疾病","C、治疗时机","D、脱水程度","E、性别"],"answer":"ABCD","explain":"年龄、基础疾病、治疗时机、脱水程度是影响霍乱患者预后的关键因素，年龄越大、基础疾病越多、治疗越晚、脱水程度越严重，患者预后越差；性别对预后的影响不显著。"},{"id":38,"disease":"霍乱","type":"判断题","difficulty":"简单","q":"38、霍乱主要通过消化道传播。","options":["A、正确","B、错误"],"answer":"A","explain":"霍乱是由霍乱弧菌引起的急性肠道传染病，主要通过消化道传播，患者的粪便、呕吐物污染水源、食物后，可造成疾病的传播。"},{"id":39,"disease":"霍乱","type":"判断题","difficulty":"简单","q":"39、65岁以上老年人是霍乱的高危人群。","options":["A、正确","B、错误"],"answer":"A","explain":"65岁以上老年人、婴幼儿、孕妇、有慢性基础疾病的人群是霍乱的高危人群，感染后易出现严重脱水、循环衰竭等并发症。"},{"id":40,"disease":"霍乱","type":"判断题","difficulty":"简单","q":"40、接种疫苗是预防霍乱有效的手段。","options":["A、正确","B、错误"],"answer":"A","explain":"接种霍乱疫苗是预防霍乱最有效的手段，可以显著降低接种者感染霍乱和发生严重并发症的风险。"},{"id":41,"disease":"霍乱","type":"判断题","difficulty":"简单","q":"41、霍乱的病原体是大肠杆菌。","options":["A、正确","B、错误"],"answer":"B","explain":"霍乱的病原体是霍乱弧菌，是一种革兰氏阴性菌，可产生霍乱肠毒素，导致患者出现剧烈呕吐、腹泻。"},{"id":42,"disease":"霍乱","type":"判断题","difficulty":"简单","q":"42、霍乱患者出现剧烈呕吐、腹泻，伴严重脱水、意识改变，提示可能发展为重症。","options":["A、正确","B、错误"],"answer":"A","explain":"霍乱患者出现剧烈呕吐、腹泻，伴严重脱水、意识改变、血压下降等症状时，提示可能发展为重症，需及时就医。"},{"id":43,"disease":"霍乱","type":"判断题","difficulty":"简单","q":"43、抗生素可用于治疗所有类型的霍乱。","options":["A、正确","B、错误"],"answer":"A","explain":"霍乱是由霍乱弧菌引起的，抗生素对霍乱弧菌有杀菌作用，可用于治疗所有类型的霍乱，能有效缩短病程，减少腹泻量。"},{"id":44,"disease":"霍乱","type":"判断题","difficulty":"简单","q":"44、勤洗手、不喝生水、不吃生冷不洁食物可以有效减少霍乱的传播。","options":["A、正确","B、错误"],"answer":"A","explain":"勤洗手、保持手卫生，不喝生水，不吃生冷、不洁的食物，正确佩戴口罩，保持社交距离，加强室内通风，避免与霍乱患者密切接触等措施可以有效减少霍乱的传播。"},{"id":45,"disease":"霍乱","type":"判断题","difficulty":"困难","q":"45、诺氟沙星是治疗霍乱的首选抗生素，可用于所有人群的霍乱治疗。","options":["A、正确","B、错误"],"answer":"B","explain":"诺氟沙星是喹诺酮类抗生素，是治疗霍乱的首选抗生素，但18岁以下的青少年、孕妇、哺乳期妇女禁用诺氟沙星，因为喹诺酮类药物可能影响软骨发育。"},{"id":46,"disease":"霍乱","type":"判断题","difficulty":"困难","q":"46、霍乱患者的粪便培养阴性，即可排除霍乱的诊断。","options":["A、正确","B、错误"],"answer":"B","explain":"粪便培养霍乱弧菌阳性是确诊霍乱的金标准，但如果患者在采集粪便标本前已经使用了抗生素，可能会导致粪便培养阴性，此时需要结合流行病学史、临床表现、其他检测结果综合判断，不能仅凭粪便培养阴性排除霍乱的诊断。"},{"id":47,"disease":"霍乱","type":"判断题","difficulty":"困难","q":"47、糖皮质激素可常规用于所有霍乱患者的治疗。","options":["A、正确","B、错误"],"answer":"B","explain":"糖皮质激素仅用于霍乱患者出现严重脱水、循环衰竭，经补液治疗后血压仍不回升时，不能常规用于所有患者的治疗，长期使用糖皮质激素可能导致不良反应。"},{"id":48,"disease":"疟疾","type":"单选题","difficulty":"简单","q":"48、疟疾的病原体是？","options":["A、疟原虫","B、血吸虫","C、丝虫","D、利什曼原虫","E、弓形虫"],"answer":"A","explain":"疟疾是由疟原虫引起的寄生虫病，主要通过雌性按蚊叮咬传播，常见的疟原虫有间日疟原虫、恶性疟原虫、三日疟原虫和卵形疟原虫。"},{"id":49,"disease":"疟疾","type":"单选题","difficulty":"简单","q":"49、疟疾的主要传播途径是？","options":["A、消化道传播","B、呼吸道飞沫传播","C、虫媒传播（按蚊叮咬）","D、血液传播","E、接触传播"],"answer":"C","explain":"疟疾的主要传播途径是虫媒传播，通过雌性按蚊叮咬传播给人类，按蚊是疟疾的唯一传播媒介。"},{"id":50,"disease":"疟疾","type":"单选题","difficulty":"简单","q":"50、疟疾的典型临床表现是？","options":["A、高热、咳嗽、咳痰、呼吸困难","B、高热、剧烈腹泻、米泔水样便","C、周期性寒战、高热、出汗退热","D、低热、乏力、盗汗、咳嗽","E、高热、头痛、呕吐、颈项强直"],"answer":"C","explain":"疟疾的典型临床表现为周期性寒战、高热、出汗退热，发作周期与疟原虫的裂体增殖周期一致，间日疟和卵形疟为隔日发作，三日疟为隔两日发作，恶性疟发作不规则。"},{"id":51,"disease":"疟疾","type":"单选题","difficulty":"简单","q":"51、疟疾的确诊主要依靠？","options":["A、临床症状","B、血常规检查","C、血液涂片镜检疟原虫阳性","D、血清学抗体检测","E、尿常规检查"],"answer":"C","explain":"疟疾的确诊主要依靠血液涂片镜检，从患者的外周血涂片中找到疟原虫是确诊的金标准，厚血膜涂片的检出率更高。"},{"id":52,"disease":"疟疾","type":"单选题","difficulty":"简单","q":"52、下列哪项措施可以有效预防疟疾的传播？","options":["A、与疟疾患者密切接触时不戴口罩","B、做好个人防护，使用蚊帐、驱蚊剂，避免按蚊叮咬","C、共用毛巾、餐具","D、在无卫生保障的餐馆就餐","E、接触患者后不洗手"],"answer":"B","explain":"预防疟疾传播的关键是做好个人防护，使用蚊帐、驱蚊剂，避免按蚊叮咬，同时做好环境整治，消除蚊虫滋生地，可有效预防感染。"},{"id":53,"disease":"疟疾","type":"单选题","difficulty":"简单","q":"53、下列哪种药物可用于疟疾的治疗？","options":["A、青霉素","B、头孢菌素","C、左氧氟沙星","D、红霉素","E、氯喹"],"answer":"E","explain":"氯喹是治疗疟疾的常用药物，可有效杀灭疟原虫的裂殖体，控制疟疾的发作，其他抗生素对疟原虫无效，仅在合并细菌感染时使用。"},{"id":54,"disease":"疟疾","type":"单选题","difficulty":"简单","q":"54、疟疾的主要致病物质是？","options":["A、内毒素","B、外毒素","C、疟原虫的裂殖子","D、疟原虫的配子体","E、疟原虫的包囊"],"answer":"C","explain":"疟疾的主要致病物质是疟原虫的裂殖子，疟原虫在红细胞内裂体增殖，导致红细胞破裂，释放出裂殖子和代谢产物，引起机体的免疫反应和炎症反应，导致寒战、高热等症状。"},{"id":55,"disease":"疟疾","type":"单选题","difficulty":"简单","q":"55、下列哪项是疟疾与普通感冒的主要区别？","options":["A、疟疾的全身症状更重，可出现周期性寒战、高热、出汗退热","B、疟疾的发热温度更低","C、疟疾的病程更短","D、疟疾的传染性更弱","E、疟疾的并发症更少"],"answer":"A","explain":"疟疾与普通感冒的主要区别在于，疟疾的全身症状更重，可出现周期性寒战、高热、出汗退热，发作周期与疟原虫的裂体增殖周期一致，病情进展快，可引起严重的并发症；而普通感冒以打喷嚏、流清涕等上呼吸道症状为主，全身症状轻，无周期性发作。"},{"id":56,"disease":"疟疾","type":"单选题","difficulty":"简单","q":"56、疟疾患者的血常规检查中，最常见的表现是？","options":["A、白细胞总数显著升高，中性粒细胞比例升高","B、白细胞总数正常或降低，淋巴细胞比例减少","C、红细胞总数和血红蛋白降低，出现贫血","D、血小板总数显著降低","E、嗜酸性粒细胞比例显著升高"],"answer":"C","explain":"疟疾患者的血常规检查中，最常见的表现是红细胞总数和血红蛋白降低，出现贫血，这是由于疟原虫在红细胞内增殖，导致红细胞大量破坏引起的，白细胞总数一般正常或轻度升高，血小板总数可正常或降低。"},{"id":57,"disease":"疟疾","type":"单选题","difficulty":"简单","q":"57、下列哪类人群不建议接种疟疾疫苗？","options":["A、6-35月龄的婴幼儿","B、3-17岁的儿童和青少年","C、孕妇","D、健康成年人","E、65岁以上老年人"],"answer":"C","explain":"孕妇、免疫功能低下者、有严重基础疾病的人群在接种疟疾疫苗前需咨询医生，部分减毒活疫苗不建议孕妇接种，可选择接种灭活疫苗。"},{"id":58,"disease":"疟疾","type":"单选题","difficulty":"简单","q":"58、疟疾的治疗原则中，最关键的是？","options":["A、及时使用抗疟药物，杀灭疟原虫","B、及时补充液体和电解质，纠正脱水","C、卧床休息，补充营养","D、对症治疗，缓解发热、寒战等症状","E、及时隔离患者，防止传播"],"answer":"A","explain":"疟疾治疗的最关键原则是早期、足量、规范使用抗疟药物，及时杀灭疟原虫，这是控制疟疾发作、防止病情恶化、降低病死率的核心措施，其他治疗均为辅助手段。"},{"id":59,"disease":"疟疾","type":"单选题","difficulty":"简单","q":"59、下列哪种是疟疾的常见并发症？","options":["A、脑型疟","B、黑尿热","C、急性肾功能衰竭","D、严重贫血","E、以上都是"],"answer":"E","explain":"疟疾的常见并发症包括脑型疟、黑尿热、急性肾功能衰竭、严重贫血、低血糖、酸中毒等，严重者可出现多器官功能衰竭，甚至死亡，尤其是恶性疟，并发症的发生率和病死率更高。"},{"id":60,"disease":"疟疾","type":"单选题","difficulty":"简单","q":"60、疟疾患者的隔离要求？","options":["A、单人单间","B、负压病房","C、消化道隔离","D、防蚊隔离","E、接触隔离"],"answer":"D","explain":"疟疾隔离为防蚊隔离"},{"id":61,"disease":"疟疾","type":"单选题","difficulty":"简单","q":"61、下列哪项是疟疾流行病学调查中最重要的？","options":["A、患者的年龄、性别","B、患者的职业、收入","C、患者的发病前14天的旅行史、蚊虫叮咬史、疟疾患者接触史","D、患者的既往病史","E、患者的家族病史"],"answer":"C","explain":"疟疾流行病学调查中，最重要的是患者发病前14天的旅行史、蚊虫叮咬史、疟疾患者接触史，包括是否去过疟疾流行地区、是否有蚊虫叮咬史、是否接触过疟疾患者等，这对于追溯传染源、确定传播途径、控制疫情扩散至关重要。"},{"id":62,"disease":"疟疾","type":"单选题","difficulty":"简单","q":"62、下列哪种检查可以快速判断疟疾患者的病情严重程度？","options":["A、血常规检查","B、尿常规检查","C、血清电解质检查","D、动脉血气分析","E、以上都是"],"answer":"E","explain":"血常规检查可判断贫血程度和炎症反应情况，尿常规检查可判断肾功能和是否出现血红蛋白尿，血清电解质检查可判断电解质紊乱情况，动脉血气分析可判断呼吸功能和酸中毒情况，以上检查均可快速判断疟疾患者的病情严重程度。"},{"id":63,"disease":"疟疾","type":"单选题","difficulty":"简单","q":"63、疟疾的高发季节通常是？","options":["A、春夏季","B、夏秋季","C、秋冬季","D、冬春季","E、全年无明显高峰"],"answer":"B","explain":"疟疾在我国的高发季节通常是夏秋季，每年的5月至10月是疟疾的主要流行期，这与夏秋季气温高、湿度大，适合按蚊的生长繁殖和活动，以及人类户外活动较多，被蚊虫叮咬的机会增加有关。"},{"id":64,"disease":"疟疾","type":"单选题","difficulty":"简单","q":"64、疟疾的防控措施中，最关键的是？","options":["A、早期发现、早期报告、早期隔离、早期治疗","B、大量使用抗生素预防感染","C、关闭所有公共场所，禁止人员流动","D、全民接种疫苗","E、定期进行蚊虫消杀"],"answer":"A","explain":"疟疾的防控措施中，最关键的是\"四早\"原则：早期发现、早期报告、早期隔离、早期治疗，这可以有效控制传染源，切断传播途径，防止疫情扩散，同时做好环境整治、蚊虫消杀、个人防护等工作，也是防控的重要措施。"},{"id":65,"disease":"疟疾","type":"单选题","difficulty":"困难","q":"65、目前疟疾流行最严重的地区是？","options":["A、北美洲","B、非洲","C、欧洲","D、亚洲","E、大洋洲"],"answer":"B","explain":"非洲是目前疟疾流行最严重的地区"},{"id":66,"disease":"疟疾","type":"单选题","difficulty":"困难","q":"66、下列哪种类型的疟疾，病情最严重，病死率最高？","options":["A、间日疟","B、恶性疟","C、三日疟","D、卵形疟","E、以上都是"],"answer":"B","explain":"恶性疟是疟疾中病情最严重、病死率最高的类型，恶性疟原虫的裂体增殖周期不规则，可在红细胞内大量增殖，导致红细胞大量破坏，引起严重的贫血、低血糖、酸中毒等并发症，同时易侵犯脑组织，引起脑型疟，是导致疟疾患者死亡的主要原因。"},{"id":67,"disease":"疟疾","type":"单选题","difficulty":"困难","q":"67、下列关于疟疾的发病机制，说法正确的是？","options":["A、疟原虫在肝细胞内增殖，引起肝细胞损伤和炎症反应","B、疟原虫在红细胞内裂体增殖，导致红细胞破裂，释放出裂殖子和代谢产物，引起机体的免疫反应和炎症反应","C、疟原虫的代谢产物可引起机体的过敏反应，导致寒战、高热等症状","D、疟原虫可侵犯脑组织，引起脑型疟，导致脑组织损伤和功能障碍","E、以上都是"],"answer":"E","explain":"疟疾的发病机制包括：疟原虫在肝细胞内增殖，引起肝细胞损伤和炎症反应；疟原虫在红细胞内裂体增殖，导致红细胞破裂，释放出裂殖子和代谢产物，引起机体的免疫反应和炎症反应；疟原虫的代谢产物可引起机体的过敏反应，导致寒战、高热等症状；疟原虫可侵犯脑组织，引起脑型疟，导致脑组织损伤和功能障碍，以上均为疟疾的发病机制。"},{"id":68,"disease":"疟疾","type":"单选题","difficulty":"困难","q":"68、下列哪项是重症疟疾患者的最主要死亡原因？","options":["A、严重脱水、循环衰竭","B、急性肾功能衰竭","C、脑型疟、呼吸衰竭、多器官功能衰竭","D、严重感染、败血症","E、以上都是"],"answer":"E","explain":"重症疟疾患者的最主要死亡原因包括：严重脱水、循环衰竭，急性肾功能衰竭，脑型疟、呼吸衰竭、多器官功能衰竭，严重感染、败血症等，多种因素共同作用导致患者死亡，其中脑型疟和多器官功能衰竭是最常见的直接死亡原因。"},{"id":69,"disease":"疟疾","type":"单选题","difficulty":"困难","q":"69、下列关于疟疾的治疗，说法错误的是？","options":["A、疟疾的治疗首选氯喹，应早期、足量、规范使用","B、对于恶性疟患者，应同时使用青蒿素类药物，如青蒿琥酯、蒿甲醚等","C、所有疟疾患者均需使用抗生素治疗，且疗程越长越好","D、重症患者可使用糖皮质激素，减轻炎症反应，改善预后","E、患者出现严重贫血时，可输血治疗"],"answer":"C","explain":"并非所有疟疾患者均需使用抗生素治疗，疟疾是由疟原虫引起的寄生虫病，抗生素对疟原虫无效，仅在合并细菌感染时才使用抗生素，疗程过长可导致耐药性的产生和肠道菌群失调，应根据患者的病情和细菌培养结果调整疗程。"},{"id":70,"disease":"疟疾","type":"单选题","difficulty":"困难","q":"70、下列哪种检查，对于疟疾的快速诊断最有价值？","options":["A、生化检查","B、血培养","C、实时荧光定量PCR检测疟原虫核酸","D、血清学抗体检测","E、血常规检查"],"answer":"C","explain":"实时荧光定量PCR检测疟原虫核酸是疟疾快速诊断的常用方法，该方法灵敏度高、特异性强，可在数小时内得出结果，同时可区分疟原虫的种类，适合基层医疗机构使用，是目前疟疾快速诊断的首选方法。"},{"id":71,"disease":"疟疾","type":"单选题","difficulty":"困难","q":"71、治疗疟疾的药物不包括？","options":["A、氯喹","B、伯氨喹","C、青蒿素","D、抗生素","E、青蒿琥酯"],"answer":"D","explain":"抗生素无法杀灭疟原虫"},{"id":72,"disease":"疟疾","type":"单选题","difficulty":"困难","q":"72、疟疾的病原学诊断方法不包括？","options":["A、血涂片镜检","B、全血PCR检测疟原虫核酸","C、血液RDT检测疟原虫抗原","D、宏基因组测序","E、血液抗体检测"],"answer":"E","explain":"目前抗体检测无法诊断疟原虫"},{"id":73,"disease":"疟疾","type":"单选题","difficulty":"困难","q":"73、下列哪项是预防疟疾暴发流行的最关键措施？","options":["A、加强疫情监测，及时发现和隔离患者","B、加强环境整治，消除蚊虫滋生地，做好蚊虫消杀工作","C、加强健康教育，提高群众的防病意识","D、做好个人防护，使用蚊帐、驱蚊剂，避免蚊虫叮咬","E、以上都是"],"answer":"E","explain":"预防疟疾暴发流行的关键措施包括：加强疫情监测，及时发现和隔离患者，控制传染源；加强环境整治，消除蚊虫滋生地，做好蚊虫消杀工作，切断传播途径；加强健康教育，提高群众的防病意识；做好个人防护，使用蚊帐、驱蚊剂，避免蚊虫叮咬，以上措施均至关重要。"},{"id":74,"disease":"疟疾","type":"多选题","difficulty":"简单","q":"74、疟疾的核心诊断标准包括以下哪些？","options":["A、有周期性寒战、高热、出汗退热等临床症状","B、血液涂片镜检疟原虫阳性","C、血清学抗体检测滴度4倍及以上升高","D、有疟疾流行地区旅行史、蚊虫叮咬史","E、血液PCR检测疟原虫核酸阳性"],"answer":"ABDE","explain":"疟疾的核心诊断标准包括：有周期性寒战、高热、出汗退热等临床症状，血液涂片镜检疟原虫阳性，有疟疾流行地区旅行史、蚊虫叮咬史可作为辅助诊断依据，血常规检查出现贫血并非核心诊断标准。"},{"id":75,"disease":"疟疾","type":"多选题","difficulty":"简单","q":"75、疟疾的常见传播途径包括？","options":["A、虫媒传播（按蚊叮咬）","B、接触传播","C、消化道传播","D、血液传播","E、呼吸道飞沫传播"],"answer":"AD","explain":"疟疾的常见传播途径为虫媒传播，通过雌性按蚊叮咬传播；也可通过血液传播，输入被疟原虫污染的血液或血液制品可引起感染，其他传播途径极为罕见。"},{"id":76,"disease":"疟疾","type":"多选题","difficulty":"简单","q":"76、下列哪些人群是疟疾的高危人群？","options":["A、婴幼儿","B、65岁以上老年人","C、孕妇","D、有慢性基础疾病的人群","E、青壮年"],"answer":"ABCD","explain":"婴幼儿、65岁以上老年人、孕妇、有慢性基础疾病的人群是疟疾的高危人群，感染后病情更重，易出现严重并发症，青壮年人群免疫力较强，感染后多为轻症或无症状感染。"},{"id":77,"disease":"疟疾","type":"多选题","difficulty":"简单","q":"77、下列哪些检查可用于疟疾的诊断？","options":["A、血液涂片镜检","B、实时荧光定量PCR检测疟原虫核酸","C、疟原虫培养","D、血清学抗体检测","E、血常规检查"],"answer":"AB","explain":"血液涂片镜检是疟疾确诊的金标准，实时荧光定量PCR检测疟原虫核酸可用于快速诊断，疟原虫培养可用于确诊和药敏试验，血清学抗体检测可辅助诊断，血常规检查可判断贫血程度和炎症反应情况，以上检查均可用于疟疾的诊断。"},{"id":78,"disease":"疟疾","type":"多选题","difficulty":"简单","q":"78、疟疾的治疗原则包括？","options":["A、早期、足量、规范使用抗疟药物，杀灭疟原虫","B、及时补充液体和电解质，纠正脱水和电解质紊乱","C、对症治疗，缓解发热、寒战、呕吐等症状","D、卧床休息，补充营养，提高机体免疫力","E、及时隔离患者，防止疾病传播"],"answer":"ABCDE","explain":"疟疾的治疗原则包括：早期、足量、规范使用抗疟药物，这是治疗的核心；及时补充液体和电解质，纠正脱水和电解质紊乱；对症治疗，缓解发热、寒战、呕吐等症状；卧床休息，补充营养，提高机体免疫力；及时隔离患者，防止疾病传播，以上均为疟疾的治疗原则。"},{"id":79,"disease":"疟疾","type":"多选题","difficulty":"困难","q":"79、下列关于疟疾的流行病学调查，说法正确的有？","options":["A、重点调查患者发病前14天的旅行史、蚊虫叮咬史、疟疾患者接触史","B、需排查患者是否去过疟疾流行地区、是否有蚊虫叮咬史、是否接触过疟疾患者","C、需调查患者的职业、暴露史，判断是否存在职业暴露风险","D、流行病学调查仅需在患者确诊后进行","E、流行病学调查是追溯传染源、确定传播途径、控制疫情扩散的关键措施"],"answer":"ABCE","explain":"疟疾流行病学调查的重点是患者发病前14天的旅行史、蚊虫叮咬史、疟疾患者接触史，排查是否去过疟疾流行地区、是否有蚊虫叮咬史、是否接触过疟疾患者；同时调查患者的职业、暴露史，判断是否存在职业暴露风险；流行病学调查是追溯传染源、确定传播途径、控制疫情扩散的关键措施，需在患者出现症状后及时启动，而非仅在确诊后进行。"},{"id":80,"disease":"疟疾","type":"判断题","difficulty":"简单","q":"80、疟疾的病原体是血吸虫。","options":["A、正确","B、错误"],"answer":"B","explain":"疟疾的病原体是疟原虫，而非血吸虫，血吸虫是引起血吸虫病的病原体。"},{"id":81,"disease":"疟疾","type":"判断题","difficulty":"简单","q":"81、疟疾的主要传播途径是虫媒传播，通过雌性按蚊叮咬传播。","options":["A、正确","B、错误"],"answer":"A","explain":"疟疾的主要传播途径是虫媒传播，通过雌性按蚊叮咬传播给人类，按蚊是疟疾的唯一传播媒介。"},{"id":82,"disease":"疟疾","type":"判断题","difficulty":"简单","q":"82、疟疾的典型临床表现是周期性寒战、高热、出汗退热。","options":["A、正确","B、错误"],"answer":"A","explain":"疟疾的典型临床表现为周期性寒战、高热、出汗退热，发作周期与疟原虫的裂体增殖周期一致，间日疟和卵形疟为隔日发作，三日疟为隔两日发作，恶性疟发作不规则。"},{"id":83,"disease":"疟疾","type":"判断题","difficulty":"简单","q":"83、疟疾的潜伏期一般为7-14天，最短可至2天。","options":["A、正确","B、错误"],"answer":"A","explain":"疟疾的潜伏期一般为7-14天，最短可至2天，最长不超过1个月，潜伏期的长短与感染的疟原虫种类、数量以及机体免疫力有关。"},{"id":84,"disease":"疟疾","type":"判断题","difficulty":"简单","q":"84、人群对疟原虫普遍易感，感染后可获得终身免疫。","options":["A、正确","B、错误"],"answer":"B","explain":"人群对疟原虫普遍易感，感染后可获得对同型疟原虫的短期免疫力，而非终身免疫力，且不同种类的疟原虫之间无交叉免疫，仍可再次感染其他种类的疟原虫。"},{"id":85,"disease":"疟疾","type":"判断题","difficulty":"简单","q":"85、疟疾治疗的最关键措施是及时使用抗疟药物，杀灭疟原虫。","options":["A、正确","B、错误"],"answer":"A","explain":"疟疾治疗的最关键原则是早期、足量、规范使用抗疟药物，及时杀灭疟原虫，这是控制疟疾发作、防止病情恶化、降低病死率的核心措施，其他治疗均为辅助手段。"},{"id":86,"disease":"疟疾","type":"判断题","difficulty":"简单","q":"86、疟疾属于我国法定传染病中乙类传染病。","options":["A、正确","B、错误"],"answer":"A","explain":"疟疾属于我国法定传染病中乙类传染病。"},{"id":87,"disease":"疟疾","type":"判断题","difficulty":"困难","q":"87、所有疟原虫菌株均可引起人类严重感染，无明显毒力差异。","options":["A、正确","B、错误"],"answer":"B","explain":"不同的疟原虫菌株毒力存在明显差异，恶性疟原虫的毒力最强，可引起严重的脑型疟、黑尿热等并发症，病死率高；而间日疟原虫、三日疟原虫和卵形疟原虫的毒力相对较弱，病情相对较轻，并发症的发生率和病死率较低，并非所有疟原虫菌株均可引起人类严重感染。"},{"id":88,"disease":"疟疾","type":"判断题","difficulty":"困难","q":"88、对于重症疟疾患者，即使发病超过48小时，也应立即使用足量的抗疟药物治疗。","options":["A、正确","B、错误"],"answer":"A","explain":"对于重症疟疾患者，无论发病时间长短，均应立即使用足量、规范的抗疟药物治疗，这是挽救患者生命的关键措施，延迟治疗可导致病情迅速恶化，出现多器官功能衰竭，甚至死亡。"},{"id":89,"disease":"疟疾","type":"判断题","difficulty":"困难","q":"89、接种疟疾疫苗可提供100%的保护率，接种后不会再感染疟疾。","options":["A、正确","B、错误"],"answer":"B","explain":"接种疟疾疫苗可显著降低感染疟疾的风险，减轻发病后的症状，但保护率并非100%，保护期一般为1-2年，接种后仍需采取做好个人防护、避免蚊虫叮咬等其他预防措施，仍有感染疟疾的可能。"},{"id":90,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"简单","q":"90、发热伴血小板减少综合征的病原体是？","options":["A、大别班达病毒","B、流感病毒","C、登革热病毒","D、流行性出血热病毒","E、乙型脑炎病毒"],"answer":"A","explain":"发热伴血小板减少综合征（SFTS）的病原体是新型布尼亚病毒，又称发热伴血小板减少综合征病毒（SFTSV），属于布尼亚病毒科白蛉病毒属，是一种单股负链RNA病毒。"},{"id":91,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"简单","q":"91、发热伴血小板减少综合征的主要传播媒介是？","options":["A、蚊子","B、苍蝇","C、蜱虫","D、螨虫","E、虱子"],"answer":"C","explain":"发热伴血小板减少综合征的主要传播媒介是蜱虫，尤其是长角血蜱，蜱虫叮咬携带病毒的动物后，再叮咬人可造成传播，是该病最主要的传播途径。"},{"id":92,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"简单","q":"92、发热伴血小板减少综合征的高发季节是？","options":["A、冬春季","B、夏秋季","C、全年高发","D、春季","E、冬季"],"answer":"B","explain":"发热伴血小板减少综合征的高发季节为夏秋季，我国大部分地区发病集中在5-10月，7-9月为发病高峰，这与蜱虫的繁殖和活动高峰高度一致，夏秋季气温高、湿度大，蜱虫活动频繁，叮咬人的概率高。"},{"id":93,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"简单","q":"93、发热伴血小板减少综合征最常见的首发症状是？","options":["A、发热","B、头痛","C、呕吐","D、腹泻","E、皮疹"],"answer":"A","explain":"发热伴血小板减少综合征的首发症状多为发热，体温多在38℃以上，持续不退，同时可伴有头痛、全身不适、乏力、食欲减退、恶心、呕吐、腹泻等症状，部分患者可出现咳嗽、咽痛、肌肉酸痛、关节痛等症状。"},{"id":94,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"简单","q":"94、发热伴血小板减少综合征的特征性实验室检查结果是？","options":["A、白细胞总数升高，血小板总数正常","B、白细胞总数正常，血小板总数升高","C、白细胞总数减少，血小板总数显著减少","D、白细胞总数升高，血小板总数显著升高","E、白细胞总数和血小板总数均正常"],"answer":"C","explain":"白细胞总数减少，血小板总数显著减少是发热伴血小板减少综合征的特征性实验室检查结果，多数患者白细胞总数降至2.0×10^9/L以下，血小板总数降至50×10^9/L以下，严重者可出现白细胞和血小板进行性下降，是诊断该病的重要依据。"},{"id":95,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"简单","q":"95、发热伴血小板减少综合征的病变主要累及？","options":["A、呼吸系统","B、消化系统","C、造血系统和全身多器官","D、循环系统","E、泌尿系统"],"answer":"C","explain":"发热伴血小板减少综合征的病变主要累及造血系统和全身多器官，病毒可侵犯骨髓造血细胞，导致白细胞、血小板生成减少，同时可侵犯全身多个器官，包括肝脏、肾脏、心脏、肺、脑等，引起多器官功能损伤，严重者可出现多器官功能衰竭。"},{"id":96,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"简单","q":"96、预防发热伴血小板减少综合征最关键的措施是？","options":["A、隔离治疗患者","B、防蜱灭蜱，加强个人防护","C、接种疫苗","D、管理传染源","E、加强营养"],"answer":"B","explain":"防蜱灭蜱，加强个人防护是预防发热伴血小板减少综合征最关键的措施，可切断传播途径，包括避免去蜱虫滋生的草地、树林等环境，进入野外环境时穿长袖衣裤、扎紧袖口裤脚，使用驱虫剂，蜱虫叮咬后及时正确取出蜱虫等。"},{"id":97,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"简单","q":"97、发热伴血小板减少综合征的易感人群主要是？","options":["A、老年人","B、青壮年","C、农民、林业工人、野外工作者等经常接触蜱虫的人群","D、孕妇","E、慢性病患者"],"answer":"C","explain":"发热伴血小板减少综合征的易感人群主要是农民、林业工人、野外工作者、户外爱好者等经常接触蜱虫的人群，这类人群进入蜱虫滋生的草地、树林等环境的概率高，被蜱虫叮咬的风险大，发病率显著高于其他人群。"},{"id":98,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"简单","q":"98、发热伴血小板减少综合征的潜伏期一般为？","options":["A、1-3天","B、5-14天","C、1-2周","D、3-6周","E、1月以上"],"answer":"B","explain":"发热伴血小板减少综合征的潜伏期一般为4-21天，多数为10-14天，潜伏期内患者无明显症状，但病毒已在体内复制，可出现病毒血症。"},{"id":99,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"简单","q":"99、下列哪项不属于发热伴血小板减少综合征的临床分型？","options":["A、轻型","B、普通型","C、重型","D、危重型","E、慢性型"],"answer":"E","explain":"发热伴血小板减少综合征的临床分型包括轻型、普通型、重型和危重型，无慢性型这一分型，其中轻型和普通型占全部病例的80%左右，重型和危重型病情凶险，病死率高。"},{"id":100,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"简单","q":"100、发热伴血小板减少综合征的确诊主要依靠？","options":["A、血常规检查","B、生化检查","C、病毒核酸检测","D、血清学检查","E、影像学检查"],"answer":"C","explain":"发热伴血小板减少综合征的确诊主要依靠病毒核酸检测，通过实时荧光定量PCR方法检测患者血液、血清、脑脊液等标本中的新型布尼亚病毒核酸，阳性即可确诊，是该病早期诊断的金标准。"},{"id":101,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"简单","q":"101、下列哪项是发热伴血小板减少综合征最严重的并发症和主要死亡原因？","options":["A、肺部感染","B、呼吸衰竭","C、多器官功能衰竭","D、肾功能衰竭","E、应激性溃疡"],"answer":"C","explain":"多器官功能衰竭是发热伴血小板减少综合征最严重的并发症和主要死亡原因，病毒可侵犯全身多个器官，包括肝脏、肾脏、心脏、肺、脑等，引起多器官功能损伤，严重者可出现多器官功能衰竭，病死率可达10%-30%。"},{"id":102,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"简单","q":"102、下列哪项是发热伴血小板减少综合征与流行性出血热最主要的鉴别点？","options":["A、发热程度","B、血小板减少程度","C、病原学检查结果","D、发病季节","E、患者年龄"],"answer":"C","explain":"发热伴血小板减少综合征与流行性出血热的临床表现相似，均可出现发热、血小板减少、白细胞减少、多器官功能损伤等症状，最主要的鉴别点是病原学检查结果，发热伴血小板减少综合征患者病毒核酸检测可检出新型布尼亚病毒，而流行性出血热患者可检出汉坦病毒。"},{"id":103,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"简单","q":"103、发热伴血小板减少综合征属于哪类传染病？","options":["A、甲类","B、乙类","C、丙类","D、丁类","E、未分类"],"answer":"B","explain":"发热伴血小板减少综合征2026年起纳入乙类传染病管理"},{"id":104,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"简单","q":"104、下列哪项是发热伴血小板减少综合征的高危人群？","options":["A、经常去草地、树林等野外环境的人群","B、长期居住在城市的人群","C、经常接触家畜的农民","D、A和C都是","E、以上都不是"],"answer":"D","explain":"发热伴血小板减少综合征的高危人群包括经常去草地、树林等野外环境的人群（如野外工作者、户外爱好者）和经常接触家畜的农民，这类人群被蜱虫叮咬的风险大，发病率显著高于其他人群。"},{"id":105,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"困难","q":"105、发热伴血小板减少综合征的病原体,其基因组结构是？","options":["A、单股正链RNA","B、单股负链RNA，分三个节段","C、双股DNA","D、单股DNA","E、双股RNA"],"answer":"B","explain":"新型布尼亚病毒的基因组是单股负链RNA，分为L、M、S三个节段，L节段编码RNA依赖的RNA聚合酶，M节段编码包膜糖蛋白，S节段编码核蛋白和非结构蛋白，这是布尼亚病毒科病毒的典型基因组结构。"},{"id":106,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"困难","q":"106、下列哪项是发热伴血小板减少综合征的特征性病理改变？","options":["A、骨髓造血细胞增生、活跃","B、骨髓造血细胞抑制、减少，巨核细胞成熟障碍","C、肝组织大片坏死","D、肾组织肾小球纤维化","E、肺组织出血性坏死"],"answer":"B","explain":"发热伴血小板减少综合征的特征性病理改变是骨髓造血细胞抑制、减少，巨核细胞成熟障碍，病毒可直接侵犯骨髓造血干细胞，抑制骨髓造血功能，导致白细胞、红细胞、血小板生成减少，这是该病出现白细胞和血小板显著减少的核心病理机制。"},{"id":107,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"困难","q":"107、下列哪项是发热伴血小板减少综合征的早期诊断指标？","options":["A、病毒核酸检测阳性","B、血清中特异性IgM抗体阳性","C、血常规白细胞和血小板减少","D、生化检查肝肾功能异常","E、凝血功能异常"],"answer":"A","explain":"病毒核酸检测阳性是发热伴血小板减少综合征的早期诊断金标准，通过实时荧光定量PCR方法检测患者血液、血清等标本中的新型布尼亚病毒核酸，在病程第1天即可检出阳性，可早期确诊该病；血清中特异性IgM抗体在病程第3-5天开始出现，可作为辅助诊断指标；血常规白细胞和血小板减少是该病的特征性表现，但无特异性，不能单独作为确诊依据。"},{"id":108,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"困难","q":"108、发热伴血小板减少综合征的发病机制中，导致白细胞和血小板减少的主要原因是？","options":["A、病毒直接侵犯骨髓造血干细胞，抑制骨髓造血功能","B、病毒直接破坏外周血中的白细胞和血小板","C、机体免疫应答消耗大量白细胞和血小板","D、白细胞和血小板向炎症部位聚集，导致外周血减少","E、以上都不是"],"answer":"A","explain":"发热伴血小板减少综合征患者外周血白细胞和血小板显著减少的主要原因是病毒直接侵犯骨髓造血干细胞，抑制骨髓造血功能，导致白细胞、红细胞、血小板生成减少；同时病毒可引起巨核细胞成熟障碍，导致血小板生成进一步减少，这是该病的核心发病机制。"},{"id":109,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"困难","q":"109、发热伴血小板减少综合征的病死率约为？","options":["A、<1%","B、5%-10%","C、10%-30%","D、50%-60%","E、80%以上"],"answer":"C","explain":"发热伴血小板减少综合征的病死率约为10%-30%，其中重型和危重型患者的病死率可达50%以上，死亡原因主要为多器官功能衰竭、DIC、严重继发感染、休克等，早期诊断、及时规范治疗可显著降低病死率。"},{"id":110,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"困难","q":"110、发热伴血小板减少综合征密切接触者的随访时间？","options":["A、7天","B、10天","C、14天","D、21天","E、1个月"],"answer":"C","explain":"病例发现地或密切接触者所在地疾控机构应告知并指导密切接触者做好自我健康监测，健康监测期限为自最后密切接触之日起 14 天，并在第 7 天、第 14 天通过电话或上门等方式进行随访。"},{"id":111,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"困难","q":"111、下列关于发热伴血小板减少综合征的传播途径，说法错误的是？","options":["A、蜱虫叮咬是最主要的传播途径","B、密切接触患者的血液、分泌物可造成人传人","C、接触被病毒污染的环境、物品可造成传播","D、可通过呼吸道飞沫传播","E、实验室暴露可造成感染"],"answer":"D","explain":"发热伴血小板减少综合征的传播途径主要包括蜱虫叮咬传播、密切接触患者血液、分泌物传播、接触被病毒污染的环境、物品传播、实验室暴露传播等；呼吸道飞沫传播不是该病的传播途径，病毒不会通过飞沫经空气传播，与患者的日常接触，如握手、共同进餐等，不会造成传播。"},{"id":112,"disease":"发热伴血小板减少综合征","type":"单选题","difficulty":"困难","q":"112、下列哪项是发热伴血小板减少综合征的预防措施中，保护易感人群的核心措施？","options":["A、隔离治疗患者","B、管理传染源，对家畜进行疫苗接种","C、切断传播途径，防蜱灭蜱，加强个人防护","D、接种疫苗","E、加强营养，提高机体抵抗力"],"answer":"C","explain":"发热伴血小板减少综合征目前尚无有效的疫苗，预防该病的核心措施是切断传播途径，防蜱灭蜱，加强个人防护，包括避免去蜱虫滋生的草地、树林等环境，进入野外环境时穿长袖衣裤、扎紧袖口裤脚，使用驱虫剂，蜱虫叮咬后及时正确取出蜱虫，对家畜进行定期驱虫，减少蜱虫滋生等。"},{"id":113,"disease":"发热伴血小板减少综合征","type":"多选题","difficulty":"简单","q":"113、发热伴血小板减少综合征的病原学检测方法？","options":["A、病毒核酸PCR检测","B、病毒分离","C、IgG 阳转或恢复期较急性期滴度呈 4 倍及以上升高。","D、IgM 阳性","E、抗原阳性"],"answer":"ABCD","explain":"1.核酸检测：血液、呼吸道、尿液或粪便标本中 SFTSV核酸检测阳性。2.病毒培养：从血液、呼吸道、尿液和粪便标本等培养分离到 SFTSV。3.血清学检测：SFTSV-IgM 阳性；IgG 阳转或恢复期较急性期滴度呈 4 倍及以上升高。"},{"id":114,"disease":"发热伴血小板减少综合征","type":"多选题","difficulty":"简单","q":"114、发热伴血小板减少综合征的传染源包括？","options":["A、患者","B、隐性感染者","C、牛、羊、猪、狗等家畜","D、鹿、野兔等野生动物","E、鸟类"],"answer":"ABCD","explain":"发热伴血小板减少综合征的传染源包括患者、隐性感染者、牛、羊、猪、狗等家畜和鹿、野兔等野生动物，其中家畜和野生动物是最主要的传染源，患者作为传染源的意义较小，仅在密切接触患者血液、分泌物时可造成人传人，鸟类不是该病的传染源。"},{"id":115,"disease":"发热伴血小板减少综合征","type":"多选题","difficulty":"简单","q":"115、发热伴血小板减少综合征的典型临床表现包括？","options":["A、持续发热","B、头痛、全身不适、乏力","C、恶心、呕吐、腹泻","D、肌肉酸痛、关节痛","E、咳嗽、咽痛"],"answer":"ABCDE","explain":"发热伴血小板减少综合征的典型临床表现包括全身毒血症状和消化道、呼吸道症状，具体有持续发热、头痛、全身不适、乏力、恶心、呕吐、腹泻、肌肉酸痛、关节痛、咳嗽、咽痛等，严重者可出现出血倾向、意识障碍、呼吸困难等症状。"},{"id":116,"disease":"发热伴血小板减少综合征","type":"多选题","difficulty":"简单","q":"116、发热伴血小板减少综合征多渠道监测包括？","options":["A、病例监测。","B、蜱媒监测","C、病原学监测","D、专项监测","E、人群监测"],"answer":"ABCD","explain":"多渠道监测类型包括病例监测、蜱媒监测、病原学监测、专项监测，没有人群监测"},{"id":117,"disease":"发热伴血小板减少综合征","type":"多选题","difficulty":"简单","q":"117、发热伴血小板减少综合征的常见并发症包括？","options":["A、继发感染","B、多器官功能衰竭","C、弥散性血管内凝血（DIC）","D、脑炎、脑膜炎","E、心肌炎、肺炎"],"answer":"ABCDE","explain":"发热伴血小板减少综合征的常见并发症多发生在病程的第7-14天，包括继发感染、多器官功能衰竭、弥散性血管内凝血（DIC）、脑炎、脑膜炎、心肌炎、肺炎、肾功能衰竭、出血等，其中多器官功能衰竭是最严重的并发症，可危及生命。"},{"id":118,"disease":"发热伴血小板减少综合征","type":"多选题","difficulty":"困难","q":"118、关于发热伴血小板减少综合征的流行病学特征，以下说法正确的有？","options":["A、主要分布在亚洲地区，呈现一定地域聚集性","B、我国报告病例数总体呈波动上升趋势，波及地域范围呈扩大趋势","C、多发生在4-10月，有明显的季节性","D、各年龄段人群均可发病，以中老年农民为主","E、男性发病率显著高于女性"],"answer":"ABCD","explain":"发热伴血小板减少综合征主要分布在亚洲地区，我国报告病例数总体呈波动上升趋势，多发生在4-10月，各年龄段人群均可发病，以中老年农民为主，无明显性别差异。"},{"id":119,"disease":"发热伴血小板减少综合征","type":"多选题","difficulty":"困难","q":"119、关于发热伴血小板减少综合征的疫情处置，以下说法正确的有？","options":["A、经蜱叮咬传播的疫情，需加强环境治理和蜱媒防制","B、人际传播的疫情，需科学判定和管理密切接触者","C、疑似暴露于感染动物引起的传播，需对可能感染的动物进行采样检测","D、聚集性疫情最后1例密切接触者14天内无新增病例，即可判定疫情结束","E、疫情处置仅需疾控机构开展，无需医疗机构配合"],"answer":"ABC","explain":"发热伴血小板减少综合征的疫情处置需根据不同传播方式分类开展，经蜱叮咬传播的需加强环境治理和蜱媒防制，人际传播的需管理密切接触者，疑似动物传播的需对动物采样检测；聚集性疫情终止条件是最后1例病例的最后1例密切接触者或共同暴露人员自接触或暴露之日起14天内，所有密切接触者、共同暴露人员、病例所在自然村或社区中无新增病例；疫情处置需要疾控机构和医疗机构协同配合。"},{"id":120,"disease":"发热伴血小板减少综合征","type":"判断题","difficulty":"简单","q":"120、发热伴血小板减少综合征的病原体是流感病毒。","options":["A、正确","B、错误"],"answer":"B","explain":"发热伴血小板减少综合征的病原体是新型布尼亚病毒，又称发热伴血小板减少综合征病毒（SFTSV），属于布尼亚病毒科白蛉病毒属，流感病毒是流行性感冒的病原体。"},{"id":121,"disease":"发热伴血小板减少综合征","type":"判断题","difficulty":"简单","q":"121、发热伴血小板减少综合征的主要传染源是患者。","options":["A、正确","B、错误"],"answer":"B","explain":"发热伴血小板减少综合征的主要传染源是牛、羊、猪、狗等家畜和野生动物，患者作为传染源的意义较小，仅在密切接触患者血液、分泌物时可造成人传人。"},{"id":122,"disease":"发热伴血小板减少综合征","type":"判断题","difficulty":"简单","q":"122、白细胞总数减少，血小板总数显著减少是发热伴血小板减少综合征的特征性实验室检查结果。","options":["A、正确","B、错误"],"answer":"A","explain":"白细胞总数减少，血小板总数显著减少是发热伴血小板减少综合征的特征性实验室检查结果，多数患者白细胞总数降至2.0×10^9/L以下，血小板总数降至50×10^9/L以下，是诊断该病的重要依据。"},{"id":123,"disease":"发热伴血小板减少综合征","type":"判断题","difficulty":"简单","q":"123、发热伴血小板减少综合征的主要传播途径是呼吸道传播。","options":["A、正确","B、错误"],"answer":"B","explain":"发热伴血小板减少综合征的主要传播途径是蜱虫叮咬传播，呼吸道传播不是该病的传播途径，病毒不会通过飞沫经空气传播。"},{"id":124,"disease":"发热伴血小板减少综合征","type":"判断题","difficulty":"简单","q":"124、发热伴血小板减少综合征目前无特效抗病毒药物，治疗以对症支持治疗为主。","options":["A、正确","B、错误"],"answer":"A","explain":"发热伴血小板减少综合征目前无特效抗病毒药物，治疗原则以对症支持治疗为主，重点处理发热、血小板减少、白细胞减少、多器官功能损伤等症状，防治并发症。"},{"id":125,"disease":"发热伴血小板减少综合征","type":"判断题","difficulty":"困难","q":"125、发热伴血小板减少综合征患者的血常规检查典型表现为白细胞总数升高，血小板总数升高。","options":["A、正确","B、错误"],"answer":"B","explain":"发热伴血小板减少综合征患者的血常规检查典型表现为白细胞总数和血小板总数显著减少，多数患者白细胞总数降至2.0×10^9/L以下，血小板总数降至50×10^9/L以下，这是该病的特征性血常规表现。"},{"id":126,"disease":"发热伴血小板减少综合征","type":"判断题","difficulty":"困难","q":"126、多器官功能衰竭是发热伴血小板减少综合征最严重的并发症和主要死亡原因。","options":["A、正确","B、错误"],"answer":"A","explain":"多器官功能衰竭是发热伴血小板减少综合征最严重的并发症和主要死亡原因，病毒可侵犯全身多个器官，引起多器官功能损伤，严重者可出现多器官功能衰竭，病死率可达10%-30%。"},{"id":127,"disease":"发热伴血小板减少综合征","type":"判断题","difficulty":"困难","q":"127、血清中特异性IgM抗体阳性可早期确诊发热伴血小板减少综合征。","options":["A、正确","B、错误"],"answer":"B","explain":"血清中特异性IgM抗体在病程第3-5天开始出现，单份血清IgM抗体阳性有辅助诊断意义，双份血清抗体滴度4倍以上升高才有确诊意义，不能单独通过IgM抗体阳性早期确诊该病，早期确诊的金标准是病毒核酸检测阳性。"},{"id":128,"disease":"基孔肯雅热","type":"单选题","difficulty":"简单","q":"128、基孔肯雅热的病原体是？","options":["A、基孔肯雅病毒","B、登革病毒","C、黄热病病毒","D、寨卡病毒","E、汉坦病毒"],"answer":"A","explain":"基孔肯雅热是由基孔肯雅病毒（CHIKV）感染引起的急性虫媒传染病，属于披膜病毒科甲病毒属。"},{"id":129,"disease":"基孔肯雅热","type":"单选题","difficulty":"简单","q":"129、基孔肯雅热属于我国《传染病防治法》规定的哪类传染病？","options":["A、甲类","B、乙类","C、丙类","D、丁类","E、不属于法定传染病"],"answer":"B","explain":"基孔肯雅热是我国《传染病防治法》规定的乙类传染病，按乙类传染病管理。"},{"id":130,"disease":"基孔肯雅热","type":"单选题","difficulty":"简单","q":"130、基孔肯雅热的主要传播媒介是？","options":["A、埃及伊蚊和白纹伊蚊","B、中华按蚊","C、库蚊","D、蜱虫","E、螨虫"],"answer":"A","explain":"基孔肯雅热的主要传播媒介是埃及伊蚊和白纹伊蚊，与登革热、寨卡病毒病、黄热病的传播媒介相同。"},{"id":131,"disease":"基孔肯雅热","type":"单选题","difficulty":"简单","q":"131、基孔肯雅热的主要传染源是？","options":["A、患者和隐性感染者","B、非人灵长类动物","C、家畜","D、野生动物","E、家禽"],"answer":"A","explain":"基孔肯雅热的主要传染源是患者和隐性感染者，非人灵长类动物是储存宿主。"},{"id":132,"disease":"基孔肯雅热","type":"单选题","difficulty":"简单","q":"132、基孔肯雅热的典型临床表现不包括？","options":["A、急起高热","B、剧烈关节痛","C、皮疹","D、剧烈腹泻、血便","E、头痛、肌肉疼痛"],"answer":"D","explain":"剧烈腹泻、血便是肠出血性大肠杆菌O157感染的典型表现，不是基孔肯雅热的临床表现。"},{"id":133,"disease":"基孔肯雅热","type":"单选题","difficulty":"简单","q":"133、基孔肯雅热的潜伏期一般为？","options":["A、1~3天","B、3~7天","C、1~3个月","D、3~6个月","E、6个月以上"],"answer":"B","explain":"基孔肯雅热的潜伏期一般为3~7天，最短1天，最长12天。"},{"id":134,"disease":"基孔肯雅热","type":"单选题","difficulty":"简单","q":"134、基孔肯雅热患者对媒介伊蚊具有感染性的时间段是？","options":["A、发病前1天至发病后5天","B、发病前3天至发病后3天","C、发病当天至发病后7天","D、发病当天至发病后10天","E、整个病程"],"answer":"C","explain":"基孔肯雅病毒感染者大多在发病当天至发病后7天内具有感染性。"},{"id":135,"disease":"基孔肯雅热","type":"单选题","difficulty":"简单","q":"135、基孔肯雅热最具特征性的临床表现是？","options":["A、急起高热","B、剧烈关节痛，呈游走性，主要累及小关节","C、皮疹","D、头痛、肌肉疼痛","E、恶心、呕吐"],"answer":"B","explain":"剧烈关节痛是基孔肯雅热最具特征性的临床表现，通常为游走性疼痛，主要累及小关节，如手、腕、踝和趾关节等，腕关节受压引起的疼痛是本病的特点。"},{"id":136,"disease":"基孔肯雅热","type":"单选题","difficulty":"简单","q":"136、基孔肯雅热的皮疹通常出现在哪个部位？","options":["A、躯干和四肢伸展侧，手掌和足底也可出现","B、仅出现在面部","C、仅出现在胸部","D、仅出现在四肢","E、仅出现在背部和臀部"],"answer":"A","explain":"基孔肯雅热的皮疹通常出现在躯干和四肢伸展侧，手掌和足底也可出现，通常为斑疹、丘疹或紫癜，80%的患者在发病后2~5天出现皮疹。"},{"id":137,"disease":"基孔肯雅热","type":"单选题","difficulty":"简单","q":"137、诊断基孔肯雅热的金标准是？","options":["A、血常规检查","B、血清特异性IgM抗体检测","C、RT-PCR检测病毒核酸","D、尿常规检查","E、影像学检查"],"answer":"C","explain":"RT-PCR检测到基孔肯雅病毒核酸是诊断基孔肯雅热的金标准，可用于急性期诊断。"},{"id":138,"disease":"基孔肯雅热","type":"单选题","difficulty":"简单","q":"138、关于基孔肯雅热的治疗，下列说法正确的是？","options":["A、有特效抗病毒药物，可彻底清除病毒","B、仅对症支持治疗，无特效抗病毒药物","C、使用抗生素治疗","D、仅用解热镇痛药治疗","E、无需治疗，可自愈"],"answer":"B","explain":"基孔肯雅热目前尚无特效抗病毒药物，治疗以对症支持治疗为主，包括休息、补液、止痛、退热等。"},{"id":139,"disease":"基孔肯雅热","type":"单选题","difficulty":"简单","q":"139、预防基孔肯雅热的关键措施是？","options":["A、防蚊灭蚊，避免蚊虫叮咬","B、接种疫苗","C、做好个人卫生，饭前便后洗手","D、加强水源保护","E、做好家畜的防疫工作"],"answer":"A","explain":"预防基孔肯雅热的关键措施是防蚊灭蚊，避免蚊虫叮咬，这是最根本的预防措施。"},{"id":140,"disease":"基孔肯雅热","type":"单选题","difficulty":"简单","q":"140、下列哪种人群感染基孔肯雅热后发生严重并发症的风险最高？","options":["A、青壮年","B、儿童和老年人","C、医护人员","D、办公室职员","E、教师"],"answer":"B","explain":"儿童和老年人感染基孔肯雅热后，发生严重并发症的风险最高，病情也更重。"},{"id":141,"disease":"基孔肯雅热","type":"单选题","difficulty":"简单","q":"141、人体感染基孔肯雅病毒后，可产生多久的免疫力？","options":["A、1年","B、5年","C、10年","D、持久免疫力","E、无免疫力"],"answer":"D","explain":"人体感染基孔肯雅病毒后，可获得持久免疫力。"},{"id":142,"disease":"基孔肯雅热","type":"单选题","difficulty":"简单","q":"142、登革热和基孔肯雅热的主要临床表现不包括以下哪项？","options":["A、发热","B、关节痛","C、皮疹","D、咳嗽咳痰","E、肌肉痛"],"answer":"D","explain":"登革热和基孔肯雅热症状相似，均以发热、关节痛、皮疹等为主要临床表现，登革热还可出现肌肉痛、腹部症状、出血倾向等，咳嗽咳痰不是其主要临床表现。"},{"id":143,"disease":"基孔肯雅热","type":"单选题","difficulty":"简单","q":"143、医疗机构发现登革热/基孔肯雅热疑似病例、临床诊断病例和确诊病例，应于多长时间内进行网络直报？","options":["A、2小时内","B、12小时内","C、24小时内","D、48小时内","E、72小时内"],"answer":"C","explain":"医疗机构对发现的登革热/基孔肯雅热疑似病例、临床诊断病例和确诊病例，应于24小时内通过“中国疾病预防控制信息系统”进行网络直报。"},{"id":144,"disease":"基孔肯雅热","type":"单选题","difficulty":"简单","q":"144、关于基孔肯雅热的流行特征，下列说法错误的是？","options":["A、主要流行于非洲、亚洲和美洲的热带和亚热带地区","B、四季均可发病，夏秋季为高峰","C、常与登革热、寨卡病毒病等虫媒传染病同时流行","D、农村发病率高于城市","E、男性发病率高于女性"],"answer":"E","explain":"基孔肯雅热男女发病率无明显差异，并非男性发病率高于女性。"},{"id":145,"disease":"基孔肯雅热","type":"单选题","difficulty":"困难","q":"145、基孔肯雅热聚集性疫情是指在同一集体单位或场所，12天内报告多少例及以上基孔肯雅热本地确诊病例？","options":["A、2例","B、3例","C、5例","D、10例","E、20例"],"answer":"B","explain":"基孔肯雅热聚集性疫情是指在同一家庭、学校、建筑工地、社区、村庄等集体单位或场所，12天内报告3例及以上基孔肯雅热本地确诊病例。"},{"id":146,"disease":"基孔肯雅热","type":"单选题","difficulty":"困难","q":"146、基孔肯雅热局部暴发疫情是指同一街道或乡镇，12天内报告多少例及以上基孔肯雅热本地确诊病例？","options":["A、2例","B、3例","C、5例","D、10例","E、20例"],"answer":"D","explain":"基孔肯雅热局部暴发疫情是指同一街道或乡镇，12天内报告10例及以上基孔肯雅热本地确诊病例。"},{"id":147,"disease":"基孔肯雅热","type":"单选题","difficulty":"困难","q":"147、基孔肯雅热患者解除防蚊隔离的标准是？","options":["A、病程超过5天，且体温自然下降至正常超过24小时及以上","B、体温恢复正常超过24小时，病毒核酸检测阴性或病程超过7天","C、病程超过10天","D、症状完全消失","E、出院即可解除"],"answer":"B","explain":"基孔肯雅热患者体温恢复正常超过24小时的，病毒核酸检测阴性或病程超过7天，可解除防蚊隔离。"},{"id":148,"disease":"基孔肯雅热","type":"单选题","difficulty":"困难","q":"148、基孔肯雅热的关节痛的特点是？","options":["A、游走性，主要累及小关节，如手、腕、踝、趾关节","B、固定性，主要累及大关节，如膝、髋关节","C、仅累及脊柱关节","D、仅累及上肢关节","E、仅累及下肢关节"],"answer":"A","explain":"基孔肯雅热的关节痛通常为游走性疼痛，主要累及小关节，如手、腕、踝和趾关节等，腕关节受压引起的疼痛是本病的特点。"},{"id":149,"disease":"基孔肯雅热","type":"单选题","difficulty":"困难","q":"149、发生聚集性疫情的地区，当核心区、警戒区连续多少天内无基孔肯雅热新发病例，且核心区内布雷图指数降至5以下，可终止应急处置工作？","options":["A、14天","B、21天","C、22天","D、30天","E、60天"],"answer":"C","explain":"发生聚集性疫情的地区，当核心区、警戒区连续24天内无登革热新发病例、连续22天内无基孔肯雅热新发病例，且核心区内布雷图指数降至5以下，双层叠帐法成蚊密度不高于0.9只/(顶·小时)，可终止伊蚊应急监测控制和聚集性疫情处置工作。"},{"id":150,"disease":"基孔肯雅热","type":"单选题","difficulty":"困难","q":"150、疫情风险区域划分中，核心区是以病例住所等为中心，半径不小于多少米的空间范围？","options":["A、50米","B、100米","C、200米","D、500米","E、1000米"],"answer":"B","explain":"核心区是以病例住所、工作地点、传染期长时间活动的场所为中心，参考媒介伊蚊活动范围，将半径不小于100米的空间范围划定为核心区。"},{"id":151,"disease":"基孔肯雅热","type":"单选题","difficulty":"困难","q":"151、疫情风险区域划分中，警戒区是将核心区向外扩展多少米半径的空间范围？","options":["A、50米","B、100米","C、200米","D、500米","E、1000米"],"answer":"C","explain":"警戒区是将核心区向外扩展200米半径的空间范围划定为警戒区。"},{"id":152,"disease":"基孔肯雅热","type":"多选题","difficulty":"简单","q":"152、基孔肯雅热的传播途径包括？","options":["A、蚊虫叮咬传播","B、母婴传播","C、血液传播","D、消化道传播","E、性接触传播"],"answer":"ABC","explain":"基孔肯雅热的传播途径主要包括蚊虫叮咬传播、母婴传播、血液传播，一般不会通过消化道和性接触传播。"},{"id":153,"disease":"基孔肯雅热","type":"多选题","difficulty":"简单","q":"153、诊断基孔肯雅热的病原学检查方法？","options":["A、RT-PCR检测病毒核酸","B、血清特异性IgM抗体检测","C、血清IgG抗体检测","D、病毒分离","E、肝功能检查"],"answer":"ABCD","explain":""},{"id":154,"disease":"基孔肯雅热","type":"多选题","difficulty":"简单","q":"154、登革热和基孔肯雅热的疫情风险区域分为以下哪几个等级？","options":["A、核心区","B、警戒区","C、监控区","D、封控区","E、防范区"],"answer":"ABC","explain":"登革热和基孔肯雅热流行季出现确诊病例的地区，应根据个案流行病学调查结果，按照传播扩散风险由高到低划分核心区、警戒区和监控区3个风险区。"},{"id":155,"disease":"基孔肯雅热","type":"多选题","difficulty":"简单","q":"155、预防基孔肯雅热的措施包括？","options":["A、防蚊灭蚊，消除蚊虫孳生地","B、使用驱蚊剂、蚊帐等，避免蚊虫叮咬","C、前往流行区的人员做好防蚊措施","D、做好疫情监测，及时发现和处理疫情","E、接种人用疫苗"],"answer":"ABCD","explain":"目前基孔肯雅热疫苗仍处于研发阶段，尚无成熟的疫苗上市，其余选项都是正确的预防措施。"},{"id":156,"disease":"基孔肯雅热","type":"多选题","difficulty":"困难","q":"156、关于基孔肯雅热的实验室诊断，下列说法正确的有？","options":["A、RT-PCR是急性期诊断的金标准，可检测血液、尿液、唾液、脑脊液中的病毒核酸","B、血清特异性IgM抗体阳性可辅助诊断急性感染","C、血清IgG抗体滴度恢复期较急性期有4倍以上升高可确诊","D、病毒培养是确诊的金标准，但临床不常规使用","E、可出现肝功能异常，转氨酶轻度升高，血小板轻度减少"],"answer":"ABCDE","explain":"以上选项均正确描述了基孔肯雅热的实验室诊断方法和特点。"},{"id":157,"disease":"基孔肯雅热","type":"判断题","difficulty":"简单","q":"157、基孔肯雅热是由基孔肯雅病毒感染引起的，主要通过埃及伊蚊和白纹伊蚊叮咬传播。","options":["A、正确","B、错误"],"answer":"A","explain":"基孔肯雅热是由基孔肯雅病毒感染引起的急性虫媒传染病，主要传播媒介是埃及伊蚊和白纹伊蚊，该描述正确。"},{"id":158,"disease":"基孔肯雅热","type":"判断题","difficulty":"简单","q":"158、基孔肯雅热属于我国丙类法定传染病。","options":["A、正确","B、错误"],"answer":"B","explain":"基孔肯雅热是我国《传染病防治法》规定的乙类传染病，按乙类传染病管理，不是丙类。"},{"id":159,"disease":"基孔肯雅热","type":"判断题","difficulty":"简单","q":"159、基孔肯雅热病例应在24小时网络直报。","options":["A、正确","B、错误"],"answer":"A","explain":"基孔肯雅热是我国《传染病防治法》规定的乙类传染病，按乙类传染病管理，24小时内网络报告。"},{"id":160,"disease":"基孔肯雅热","type":"判断题","difficulty":"简单","q":"160、剧烈关节痛是基孔肯雅热最具特征性的临床表现，通常为游走性，主要累及小关节。","options":["A、正确","B、错误"],"answer":"A","explain":"剧烈关节痛是基孔肯雅热最具特征性的临床表现，通常为游走性疼痛，主要累及小关节，如手、腕、踝和趾关节等，腕关节受压引起的疼痛是本病的特点，该描述正确。"},{"id":161,"disease":"基孔肯雅热","type":"判断题","difficulty":"简单","q":"161、RT-PCR检测到基孔肯雅病毒核酸是诊断基孔肯雅热的金标准。","options":["A、正确","B、错误"],"answer":"A","explain":"RT-PCR可检测到基孔肯雅的核酸，是急性期诊断基孔肯雅热的金标准，该描述正确。"},{"id":162,"disease":"基孔肯雅热","type":"判断题","difficulty":"简单","q":"162、基孔肯雅热有特效抗病毒药物，可彻底清除病毒。","options":["A、正确","B、错误"],"answer":"B","explain":"基孔肯雅热目前尚无特效抗病毒药物，治疗以对症支持治疗为主，无法彻底清除病毒。"},{"id":163,"disease":"基孔肯雅热","type":"判断题","difficulty":"简单","q":"163、预防基孔肯雅热的关键措施是防蚊灭蚊，避免蚊虫叮咬。","options":["A、正确","B、错误"],"answer":"A","explain":"基孔肯雅热是虫媒传染病，防蚊灭蚊，避免蚊虫叮咬是最根本的预防措施，该描述正确。"},{"id":164,"disease":"基孔肯雅热","type":"判断题","difficulty":"困难","q":"164、基孔肯雅病毒仅能感染人类，不能感染其他动物，因此人类是唯一的传染源。","options":["A、正确","B、错误"],"answer":"B","explain":"基孔肯雅病毒不仅能感染人类，还能感染非人灵长类动物、小鼠、豚鼠等多种动物，非人灵长类动物是其储存宿主，患者和隐性感染者是主要传染源。"},{"id":165,"disease":"基孔肯雅热","type":"判断题","difficulty":"困难","q":"165、基孔肯雅热患者可使用阿司匹林等非甾体抗炎药，缓解发热和关节疼痛症状。","options":["A、正确","B、错误"],"answer":"B","explain":"基孔肯雅热患者禁用阿司匹林等非甾体抗炎药，因为这类药物可增加出血风险，尤其是在有出血倾向的患者中，可使用对乙酰氨基酚等解热镇痛药。"},{"id":166,"disease":"基孔肯雅热","type":"判断题","difficulty":"困难","q":"166、目前已有成熟的基孔肯雅热疫苗上市，所有人群都应常规接种。","options":["A、正确","B、错误"],"answer":"B","explain":"目前基孔肯雅热疫苗仍处于研发和临床试验阶段，尚无成熟的疫苗上市，无法通过接种疫苗预防感染。"},{"id":167,"disease":"登革热","type":"单选题","difficulty":"简单","q":"167、登革热的主要传播媒介是？","options":["A、白纹伊蚊、埃及伊蚊","B、苍蝇","C、老鼠","D、跳蚤","E、螨虫"],"answer":"A","explain":"登革热典型传播媒介为伊蚊，主要是白纹伊蚊和埃及伊蚊。"},{"id":168,"disease":"登革热","type":"单选题","difficulty":"简单","q":"168、登革热的病原体属于？","options":["A、登革病毒","B、流感病毒","C、冠状病毒","D、肝炎病毒","E、轮状病毒"],"answer":"A","explain":"登革热由登革病毒感染引起。"},{"id":169,"disease":"登革热","type":"单选题","difficulty":"简单","q":"169、登革热典型首发症状是？","options":["A、突发高热","B、腹泻","C、咳嗽","D、咽痛","E、呕吐"],"answer":"A","explain":"登革热最典型表现为突然发作的高热。"},{"id":170,"disease":"登革热","type":"单选题","difficulty":"简单","q":"170、下列哪项不是登革热典型体征？","options":["A、全身肌肉关节剧痛","B、皮疹","C、淋巴结肿大","D、视力丧失","E、乏力"],"answer":"D","explain":"肌肉关节痛、皮疹、淋巴结肿大为登革热常见表现，视力丧失罕见。"},{"id":171,"disease":"登革热","type":"单选题","difficulty":"简单","q":"171、登革热主要流行地区是？","options":["A、热带、亚热带地区","B、高寒地区","C、干旱沙漠地区","D、极寒地带","E、高原缺氧地区"],"answer":"A","explain":"伊蚊适宜在温热环境生存，登革热主要流行于热带、亚热带。"},{"id":172,"disease":"登革热","type":"单选题","difficulty":"简单","q":"172、预防登革热最核心的措施是？","options":["A、防蚊、灭蚊","B、服用抗病毒药物","C、隔离所有人群","D、禁食生冷食物","E、减少饮水"],"answer":"A","explain":"切断传播媒介（伊蚊）是防控登革热最关键手段。"},{"id":173,"disease":"登革热","type":"单选题","difficulty":"简单","q":"173、登革热患者急性期应重点休息，主要原因是？","options":["A、防止病情加重、诱发出血","B、避免噪音干扰","C、节约体力","D、改善睡眠","E、保护视力"],"answer":"A","explain":"登革热急性期活动过多易加重脏器负担，增加出血风险。"},{"id":174,"disease":"登革热","type":"单选题","difficulty":"简单","q":"174、登革热潜伏期一般为？","options":["A、3-14天","B、1个月","C、24小时内","D、半年","E、1年"],"answer":"A","explain":"登革热潜伏期通常3～14天。"},{"id":175,"disease":"登革热","type":"单选题","difficulty":"简单","q":"175、登革热患者对媒介伊蚊具有强感染性的时间段是？","options":["A、发病前1天至发病后5天","B、发病前3天至发病后3天","C、发病当天至发病后7天","D、发病当天至发病后10天","E、整个病程"],"answer":"A","explain":"登革病毒感染者在发热期及前后1-2天对媒介伊蚊具有感染性，一般在发病前1天至发病后5天内感染性强。"},{"id":176,"disease":"登革热","type":"单选题","difficulty":"简单","q":"176、登革热俗称“断骨热”，原因是？","options":["A、全身骨骼、关节剧烈疼痛","B、容易引发骨折","C、骨骼发生病变","D、关节畸形","E、骨质流失"],"answer":"A","explain":"患者肌肉、关节剧痛如同骨头断裂，因此俗称断骨热。"},{"id":177,"disease":"登革热","type":"单选题","difficulty":"简单","q":"177、登革热患者发热类型多为？","options":["A、双峰热","B、持续低热","C、间歇低热","D、午后低热","E、无发热"],"answer":"A","explain":"登革热典型热型为双峰热。"},{"id":178,"disease":"登革热","type":"单选题","difficulty":"简单","q":"178、人体感染登革病毒后，对同血清型登革病毒可产生多久的免疫力？","options":["A、1年","B、5年","C、10年","D、持久免疫力","E、无免疫力"],"answer":"D","explain":"人体感染登革病毒后，对同血清型登革病毒可产生持久免疫力，但对不同血清型登革病毒不能形成有效保护。"},{"id":179,"disease":"登革热","type":"单选题","difficulty":"简单","q":"179、登革热的传播方式不包括？","options":["A、人与人直接接触传播","B、伊蚊叮咬传播","C、蚊虫媒介传播","D、疫区蚊虫交叉叮咬","E、自然疫源传播"],"answer":"A","explain":"登革热仅经伊蚊传播，不会人传人。"},{"id":180,"disease":"登革热","type":"单选题","di 热","B、登革出血热","C、登革休克综合征","D、隐性感染","E、慢性登革热"],"answer":"ABCD","explain":"登革热无慢性分型，分为隐性感染、普通型、出血热、休克综合征。"},{"id":200,"disease":"登革热","type":"多选题","difficulty":"简单","q":"200、前往登革热疫区个人防蚊措施有？","options":["A、穿长袖衣裤","B、涂抹驱蚊产品","C、居家安装纱窗蚊帐","D、避免白天草丛逗留","E、裸露皮肤做好防护"],"answer":"ABCDE","explain":"五项均为有效的个人防蚊手段。"},{"id":201,"disease":"登革热","type":"多选题","difficulty":"简单","q":"201、登革热患者急性期护理要点有？","options":["A、卧床休息","B、清淡饮食","C、充足补液","D、监测体温","E、避免剧烈活动"],"answer":"ABCDE","explain":"急性期卧床、补液、监测体征是基础护理要求。"},{"id":202,"disease":"登革热","type":"多选题","difficulty":"简单","q":"202、登革热的流行特征包括？","options":["A、夏秋季高发","B、热带亚热带多发","C、蚊媒传播","D、可出现暴发疫情","E、无人际传播"],"answer":"ABCDE","explain":"符合登革热整体流行特点。"},{"id":203,"disease":"登革热","type":"多选题","difficulty":"困难","q":"203、重症登革热的高危人群有？","options":["A、二次感染异型登革病毒者","B、婴幼儿","C、孕妇","D、老年人","E、有基础疾病人群"],"answer":"ABCDE","explain":"以上人群感染后发展为重症风险显著升高。"},{"id":204,"disease":"登革热","type":"多选题","difficulty":"困难","q":"204、登革热和基孔肯雅热的实验室检测方法包括以下哪些？","options":["A、抗原检测","B、核酸检测","C、病毒培养分离","D、基因序列测定分析","E、血清抗体检测"],"answer":"ABCDE","explain":"登革热和基孔肯雅热的实验室检测包括抗原检测、核酸检测、病毒培养分离、基因序列测定分析、血清抗体检测等。"},{"id":205,"disease":"登革热","type":"多选题","difficulty":"困难","q":"205、登革热的流行地区分类行包括？","options":["A、Ⅰ类地区","B、Ⅱ类地区","C、Ⅲ类地区","D、Ⅳ类地区","E、V类地区"],"answer":"ABCD","explain":"综合考虑媒介伊蚊分布情况和活动期长短、既往登革热本地疫情发生情况和疫情规模等因素，将 31 个省、自治区、直辖市及新疆生产建设兵团按照疫情传播风险由高到低分为Ⅰ类、Ⅱ类、Ⅲ类、Ⅳ类地区。"},{"id":206,"disease":"登革热","type":"判断题","difficulty":"简单","q":"206、登革热可以通过人与人接触直接传播。","options":["A、正确","B、错误"],"answer":"B","explain":"登革热仅经伊蚊传播，不发生人传人。"},{"id":207,"disease":"登革热","type":"判断题","difficulty":"简单","q":"207、清除室内外积水是预防登革热最有效的手段。","options":["A、正确","B、错误"],"answer":"A","explain":"切断伊蚊孳生环境，从源头控制传播媒介。"},{"id":208,"disease":"登革热","type":"判断题","difficulty":"简单","q":"208、登革热患者均会出现皮疹症状。","options":["A、正确","B、错误"],"answer":"B","explain":"部分轻症或隐性感染者可无皮疹表现。"},{"id":209,"disease":"登革热","type":"判断题","difficulty":"简单","q":"209、伊蚊主要在白天活动叮咬人群。","options":["A、正确","B、错误"],"answer":"A","explain":"白纹伊蚊、埃及伊蚊为白昼吸血蚊虫。"},{"id":210,"disease":"登革热","type":"判断题","difficulty":"简单","q":"210、登革热流行季节主要为夏秋季。","options":["A、正确","B、错误"],"answer":"A","explain":"温湿环境利于伊蚊繁殖，夏秋季为高发季。"},{"id":211,"disease":"登革热","type":"判断题","difficulty":"简单","q":"211、登革热治疗目前以对症支持治疗为主，无特效抗病毒药。","options":["A、正确","B、错误"],"answer":"A","explain":"暂无针对性特效药物，临床以退热、补液、止血等对症处理。"},{"id":212,"disease":"登革热","type":"判断题","difficulty":"简单","q":"212、花盆、废旧轮胎积水容易滋生传播登革热的伊蚊。","options":["A、正确","B、错误"],"answer":"A","explain":"小型静止积水是伊蚊核心孳生地。"},{"id":213,"disease":"登革热","type":"判断题","difficulty":"困难","q":"213、二次感染不同血清型登革病毒，重症风险会明显增加。","options":["A、正确","B、错误"],"answer":"A","explain":"异型抗体依赖增强效应，会大幅提升重症概率。"},{"id":214,"disease":"登革热","type":"判断题","difficulty":"困难","q":"214、登革热患者高热时可常规使用阿司匹林退热。","options":["A、正确","B、错误"],"answer":"B","explain":"阿司匹林会加重出血风险，登革热患者严禁使用。"},{"id":215,"disease":"登革热","type":"判断题","difficulty":"困难","q":"215、登革休克综合征属于危重型登革热，病死率较高。","options":["A、正确","B、错误"],"answer":"A","explain":"登革休克综合征病情危重，若救治不及时病死率高。"},{"id":216,"disease":"流感","type":"单选题","difficulty":"简单","q":"216、下列哪类不是流感流行的传染源?","options":["A、流感病例","B、隐性感染者","C、潜伏期病原携带者","D、病后病原携带者","E、动物"],"answer":"D","explain":"流感的传染源主要是流感病例、隐形感染者、潜伏期病原携带者和动物，病后病原携带者不是主要传染源。"},{"id":217,"disease":"流感","type":"单选题","difficulty":"简单","q":"217、流感病毒最常见的传播途径是？","options":["A、消化道传播","B、呼吸道飞沫传播","C、血液传播","D、虫媒传播","E、接触传播"],"answer":"B","explain":"流感病毒主要通过呼吸道飞沫传播，患者咳嗽、打喷嚏时排出的飞沫被他人吸入后可造成感染。"},{"id":218,"disease":"流感","type":"单选题","difficulty":"简单","q":"218、下列哪种是流感的典型临床表现？","options":["A、缓慢起病，低热、乏力","B、突发高热、全身酸痛、乏力","C、腹痛、腹泻、呕吐","D、皮疹、淋巴结肿大","E、咳嗽、咳大量脓痰"],"answer":"B","explain":"流感的典型表现为突发高热，体温可达39-40℃，伴全身酸痛、乏力、头痛等全身症状，呼吸道症状相对较轻。"},{"id":219,"disease":"流感","type":"单选题","difficulty":"简单","q":"219、流感的高发季节通常是？","options":["A、春夏季","B、夏秋季","C、秋冬季","D、冬春季","E、全年无明显高峰"],"answer":"D","explain":"流感在我国的高发季节通常是冬春季，每年的10月至次年3月是流感的主要流行期。"},{"id":220,"disease":"流感","type":"单选题","difficulty":"简单","q":"220、预防流感最有效的手段是？","options":["A、服用抗生素","B、接种流感疫苗","C、多喝热水","D、加强营养","E、减少外出"],"answer":"B","explain":"接种流感疫苗是预防流感最有效的手段，可以显著降低接种者感染流感和发生严重并发症的风险。"},{"id":221,"disease":"流感","type":"单选题","difficulty":"简单","q":"221、流感病毒不包括那些型别？","options":["A、甲","B、乙","C、丙","D、丁","E、戊"],"answer":"E","explain":"流感病毒包括甲乙丙丁四个型别"},{"id":222,"disease":"流感","type":"单选题","difficulty":"简单","q":"222、下列哪种药物可用于流感的抗病毒治疗？","options":["A、青霉素","B、头孢菌素","C、奥司他韦","D、红霉素","E、左氧氟沙星"],"answer":"C","explain":"奥司他韦是神经氨酸酶抑制剂，是治疗流感的常用抗病毒药物，对甲型和乙型流感病毒均有抑制作用。"},{"id":223,"disease":"流感","type":"单选题","difficulty":"简单","q":"223、流感疫苗的最佳接种时间是？","options":["A、流感流行高峰前1-2个月","B、流感流行高峰时","C、流感流行过后","D、每年夏季","E、任何时间都一样"],"answer":"A","explain":"流感疫苗的最佳接种时间是流感流行高峰前1-2个月，在我国，通常建议每年9-10月接种，以在冬春季流感高发期获得有效保护。"},{"id":224,"disease":"流感","type":"单选题","difficulty":"简单","q":"224、流感抗病毒治疗的最佳时间是？","options":["A、发病48小时内","B、发病72小时内","C、发病1周内","D、发病2周内","E、出现并发症后"],"answer":"A","explain":"流感流行季，有流感重型/危重型高危因素的流感样病例，应尽早进行抗病毒治疗，发病48小时内进行抗病毒治疗获益最大。"},{"id":225,"disease":"流感","type":"单选题","difficulty":"简单","q":"225、流感的确诊主要依靠？","options":["A、临床症状","B、血常规检查","C、流感病毒核酸检测","D、胸部CT检查","E、血培养"],"answer":"C","explain":"流感的确诊主要依靠流感病毒核酸检测，包括RT-PCR等方法，可直接检测到患者呼吸道标本中的流感病毒核酸，是确诊的金标准。"},{"id":226,"disease":"流感","type":"单选题","difficulty":"简单","q":"226、下列哪种是乙型流感病毒的特点？","options":["A、仅感染人类","B、可感染人类和多种动物","C、容易发生大流行","D、致病性比甲型流感更强","E、以上都不是"],"answer":"A","explain":"乙型流感病毒仅感染人类，主要引起季节性流行，致病性较甲型流感弱，不易发生大流行。"},{"id":227,"disease":"流感","type":"单选题","difficulty":"简单","q":"227、流感患者的隔离期通常为？","options":["A、发病后1天","B、发病后3天","C、发病后7天","D、发病后14天","E、体温正常后即可解除隔离"],"answer":"C","explain":"流感患者的隔离期通常为发病后7天，或体温正常后48小时，以避免病毒传播给他人。"},{"id":228,"disease":"流感","type":"单选题","difficulty":"简单","q":"228、下列哪项关于流感的描述是错误的？","options":["A、流感是由流感病毒引起的急性呼吸道传染病","B、流感的传染性强，发病率高","C、流感患者痊愈后可获得终身免疫","D、流感病毒容易发生变异","E、流感可引起暴发流行"],"answer":"C","explain":"流感患者痊愈后可获得对同型流感病毒的短期免疫力，而非终身免疫，且流感病毒容易发生变异，变异后可再次感染。"},{"id":229,"disease":"流感","type":"单选题","difficulty":"困难","q":"229、下列关于流感病毒抗原漂移的描述，正确的是？","options":["A、抗原漂移是流感病毒的重大变异，可导致新亚型出现","B、抗原漂移是流感病毒的小幅度变异，可引起季节性流行","C、抗原漂移仅发生在乙型流感病毒中","D、抗原漂移是由于病毒基因重配导致的","E、抗原漂移后，机体原有抗体可完全保护"],"answer":"B","explain":"抗原漂移是流感病毒的小幅度变异，是由于病毒基因的点突变导致的，可引起季节性流行；抗原转换是重大变异，可导致新亚型出现，引起大流行。"},{"id":230,"disease":"流感","type":"单选题","difficulty":"困难","q":"230、流感疫苗的优先接种人群不包括以下哪项？","options":["A、医务人员","B、60岁及以上的老年人","C、罹患慢性病人群","D、成年人","E、孕妇"],"answer":"D","explain":"流感疫苗优先推荐重点和高风险人群及时接种：医务人员，包括临床救治、公共卫生和卫生检疫人员等；60岁及以上的老年人；罹患一种或多种慢性病人群；养老机构、长期护理机构、福利院等人群聚集场所脆弱人群及员工；孕妇；6~59月龄儿童；6月龄以下婴儿的家庭成员和看护人员；托幼机构、中小学校、监管场所等重点场所人群。健康青少年不属于优先接种人群。"},{"id":231,"disease":"流感","type":"单选题","difficulty":"困难","q":"231、关于流感抗病毒治疗的时机，下列说法正确的是？","options":["A、仅在发病后7天内使用抗病毒药物有效","B、重症流感患者，即使发病超过48小时，也建议使用抗病毒药物","C、轻症流感患者不需要使用抗病毒药物","D、抗病毒药物仅对甲型流感有效，对乙型流感无效","E、以上都不对"],"answer":"B","explain":"流感抗病毒治疗的最佳时机是发病后48小时内，对于重症流感患者，即使发病超过48小时，也建议使用抗病毒药物，可降低病死率。"},{"id":232,"disease":"流感","type":"单选题","difficulty":"困难","q":"232、流感的实验室检查中，以下哪项不是确诊的金标准？","options":["A、血常规白细胞计数降低","B、流感抗原检测阳性","C、流感病毒核酸检测阳性","D、血清IgG抗体恢复期较急性期4倍及以上升高","E、流感病毒培养阳性"],"answer":"A","explain":"流感病毒核酸检测敏感性和特异性高，且能区分病毒类型和亚型，是流感确诊的金标准；抗原检测阳性支持诊断，阴性不能排除；血清学检查有回顾性诊断.血常规不能诊断流感"},{"id":233,"disease":"流感","type":"单选题","difficulty":"困难","q":"233、关于流感疫苗的免疫程序，下列说法错误的是？","options":["A、6月龄-3岁儿童首次接种流感疫苗，需接种2剂，间隔4周","B、3岁及以上儿童和成年人，每年接种1剂即可","C、孕妇在孕期的任何阶段均可接种灭活流感疫苗","D、免疫功能低下者，接种1剂即可获得足够的保护","E、以上都不对"],"answer":"D","explain":"免疫功能低下者，接种流感疫苗后产生的抗体水平可能较低，保护效果不佳，部分人群可能需要接种2剂，具体需遵医嘱。"},{"id":234,"disease":"流感","type":"单选题","difficulty":"困难","q":"234、下列哪种药物不属于推荐的流感抗病毒药物？","options":["A、奥司他韦","B、扎那米韦","C、金刚烷胺","D、帕拉米韦","马巴洛沙韦"],"answer":"C","explain":"金刚烷胺耐药性较高，不推荐使用；奥司他韦、扎那米韦、帕拉米韦属于神经氨酸酶抑制剂。"},{"id":235,"disease":"流感","type":"单选题","difficulty":"困难","q":"235、关于流感的流行病学特征，下列说法错误的是？","options":["A、流感的传染源主要是流感患者和隐性感染者","B、流感的传播途径主要是呼吸道飞沫传播","C、流感的流行具有明显的季节性，冬春季高发","D、流感的发病率在老年人中最高，儿童发病率较低","E、流感可引起暴发、流行和大流行"],"answer":"D","explain":"流感的发病率在儿童和青少年中最高，老年人感染后重症率和病死率最高，而非发病率最高。"},{"id":236,"disease":"流感","type":"单选题","difficulty":"困难","q":"236、下列哪项是重症流感的高危因素？","options":["A、年龄<5岁，尤其是<2岁的婴幼儿","B、年龄≥65岁的老年人","C、有慢性基础疾病者","D、妊娠及围产期女性","E、以上都是"],"answer":"E","explain":"年龄<5岁尤其是<2岁的婴幼儿、年龄≥65岁的老年人、有慢性基础疾病者、妊娠及围产期女性、免疫功能低下者等，均是重症流感的高危人群。"},{"id":237,"disease":"流感","type":"单选题","difficulty":"困难","q":"237、流感疫苗的种类不包括哪些？","options":["A、灭火疫苗","B、减毒活疫苗","C、亚单位疫苗","D、基因工程疫苗","E、RNA疫苗"],"answer":"E","explain":"流感病毒是专性细胞内寄生病毒，无法在普通培养基中生长，通常使用鸡胚或MDCK细胞进行培养，最适培养温度是33-35℃，培养后需通过显微镜观察细胞病变或通过血凝试验检测病毒。"},{"id":238,"disease":"流感","type":"单选题","difficulty":"困难","q":"238、下列哪项关于流感的防控措施，描述错误的是？","options":["A、流感患者应尽早隔离治疗，减少病毒传播","B、密切接触者应进行医学观察，必要时可服用抗病毒药物进行预防","C、接种流感疫苗是预防流感的唯一有效措施","D、保持良好的个人卫生习惯，勤洗手，可减少流感的传播","E、加强室内通风，避免人群聚集，可降低流感的感染风险"],"answer":"C","explain":"接种流感疫苗是预防流感最有效的措施，但不是唯一的有效措施，保持良好的个人卫生习惯、加强通风、避免人群聚集、隔离患者等措施，均可有效预防流感的传播。"},{"id":239,"disease":"流感","type":"多选题","difficulty":"简单","q":"239、流感的典型临床表现包括？","options":["A、突发高热","B、全身酸痛、乏力","C、头痛、头晕","D、咳嗽、咽痛","E、腹痛、腹泻"],"answer":"ABCD","explain":"流感的典型临床表现为突发高热、全身酸痛、乏力、头痛、头晕等全身症状，可伴有咳嗽、咽痛等呼吸道局部症状，部分患者可出现腹痛、腹泻，但不是典型表现。"},{"id":240,"disease":"流感","type":"多选题","difficulty":"简单","q":"240、流感的传播途径包括？","options":["A、呼吸道飞沫传播","B、接触传播","C、消化道传播","D、血液传播","E、虫媒传播"],"answer":"AB","explain":"流感的主要传播途径是呼吸道飞沫传播，也可通过接触被病毒污染的物品后，触摸口腔、鼻腔、眼睛等黏膜导致接触传播，一般不会通过消化道、血液、虫媒传播。"},{"id":241,"disease":"流感","type":"多选题","difficulty":"简单","q":"241、流感的常见并发症包括？","options":["A、肺炎","B、心肌炎","C、脑炎","D、呼吸衰竭","E、阑尾炎"],"answer":"ABCD","explain":"流感的常见并发症包括肺炎、心肌炎、脑炎、呼吸衰竭、多器官功能损伤等，阑尾炎不是流感的常见并发症。"},{"id":242,"disease":"流感","type":"多选题","difficulty":"简单","q":"242、下列哪些措施可以有效预防流感？","options":["A、接种流感疫苗","B、勤洗手，保持手卫生","C、正确佩戴口罩","D、加强室内通风","E、与流感患者密切接触"],"answer":"ABCD","explain":"接种流感疫苗是预防流感最有效的手段，勤洗手、保持手卫生、正确佩戴口罩、加强室内通风、避免与流感患者密切接触等措施，均可有效预防流感的传播。"},{"id":243,"disease":"流感","type":"多选题","difficulty":"简单","q":"243、关于流感与普通感冒的区别，下列说法正确的是？","options":["A、流感的全身症状更重，普通感冒以呼吸道局部症状为主","B、流感的发热温度更高，持续时间更长","C、流感的传染性更强，更容易引起流行","D、流感的并发症更多，病死率更高","E、流感和普通感冒都是由流感病毒引起的"],"answer":"ABCD","explain":"流感是由流感病毒引起的，普通感冒是由鼻病毒、冠状病毒等多种病毒引起的，E选项错误；其余选项均是流感与普通感冒的正确区别。"},{"id":244,"disease":"流感","type":"多选题","difficulty":"困难","q":"244、关于流感疫苗的推荐接种人群包括？","options":["A、6～59 月龄儿童","B、托幼机构、中小学校、监管场所等重点场所人群","C、6 月龄以下婴儿的家庭成员和看护人员","D、孕妇；","E、医务人员"],"answer":"ABCDE","explain":"建议所有≥6 月龄且无接种禁忌的人都应接种流感疫苗。优先推荐以下重点和高风险人群及时接种：医务人员，包括临床救治、公共卫生和卫生检疫人员等；60 岁及以上的老年人；罹患一种或多种慢性病人群；养老机构、长期护理机构、福利院等人群聚集场所脆弱人群及员工；孕妇；6～59 月龄儿童；6 月龄以下婴儿的家庭成员和看护人员；托幼机构、中小学校、监管场所等重点场所人群。"},{"id":245,"disease":"流感","type":"多选题","difficulty":"困难","q":"245、目前人群中流行流感病毒亚型包括？","options":["A、H1N1","B、H3N2","C、H5N1","D、H7N9","E、乙型流感"],"answer":"ABE","explain":"目前人群中流行的流感病毒包括甲型H1N1、H3N2和乙型流感"},{"id":246,"disease":"流感","type":"多选题","difficulty":"困难","q":"246、关于流感疫苗的有效性，下列说法正确的是？","options":["A、流感疫苗的保护效果通常在60%-90%之间","B、流感疫苗的保护效果与接种者的年龄、免疫状态有关","C、流感疫苗接种后，通常需要2-4周才能产生足够的保护性抗体","D、流感疫苗对同型流感病毒的保护效果较好，对变异后的病毒保护效果下降","E、以上都不对"],"answer":"ABCD","explain":"流感疫苗的保护效果通常在60%-90%之间，与接种者的年龄、免疫状态有关，老年人、免疫功能低下者的保护效果相对较低；接种后通常需要2-4周才能产生足够的保护性抗体；流感疫苗对同型流感病毒的保护效果较好，对变异后的病毒保护效果下降，因此需要每年接种。"},{"id":247,"disease":"流感","type":"判断题","difficulty":"简单","q":"247、流感是由流感病毒引起的急性呼吸道传染病，传染性强。","options":["A、正确","B、错误"],"answer":"A","explain":"流感是由流感病毒引起的急性呼吸道传染病，具有传染性强、发病率高的特点，可引起暴发流行。"},{"id":248,"disease":"流感","type":"判断题","difficulty":"简单","q":"248、流感的潜伏期一般为7-14天。","options":["A、正确","B、错误"],"answer":"B","explain":"流感的潜伏期一般为1-3天，最短可至数小时，最长不超过4天，7-14天不是流感的潜伏期。"},{"id":249,"disease":"流感","type":"判断题","difficulty":"简单","q":"249、接种流感疫苗是预防流感最有效的手段。","options":["A、正确","B、错误"],"answer":"A","explain":"接种流感疫苗可以显著降低接种者感染流感和发生严重并发症的风险，是预防流感最有效的手段。"},{"id":250,"disease":"流感","type":"判断题","difficulty":"简单","q":"250、流感患者的隔离期通常为发病后14天。","options":["A、正确","B、错误"],"answer":"B","explain":"流感患者的隔离期通常为发病后7天，或体温正常后48小时，无需隔离14天。"},{"id":251,"disease":"流感","type":"判断题","difficulty":"简单","q":"251、流感病毒属于正粘病毒科，是有包膜的单股负链RNA病毒。","options":["A、正确","B、错误"],"answer":"A","explain":"流感病毒的分类特征为正粘病毒科，是一种有包膜的单股负链RNA病毒，该描述正确。"},{"id":252,"disease":"流感","type":"判断题","difficulty":"简单","q":"252、流感的高发季节是夏秋季。","options":["A、正确","B、错误"],"answer":"B","explain":"流感在我国的高发季节是冬春季，每年的10月至次年3月是主要流行期，夏秋季不是流感的高发季节。"},{"id":253,"disease":"流感","type":"判断题","difficulty":"简单","q":"253、奥司他韦是治疗流感的常用抗病毒药物，对甲型和乙型流感病毒均有效。","options":["A、正确","B、错误"],"answer":"A","explain":"奥司他韦是神经氨酸酶抑制剂，可抑制甲型和乙型流感病毒的复制，是治疗流感的常用抗病毒药物。"},{"id":254,"disease":"流感","type":"判断题","difficulty":"困难","q":"254、流感患者痊愈后可获得终身免疫，不会再次感染流感。","options":["A、正确","B、错误"],"answer":"B","explain":"流感患者痊愈后可获得对同型流感病毒的短期免疫力，而非终身免疫，且流感病毒容易发生抗原变异，变异后可再次感染人体。"},{"id":255,"disease":"流感","type":"判断题","difficulty":"困难","q":"255、对于重症流感患者，即使发病超过48小时，也建议使用抗病毒药物治疗。","options":["A、正确","B、错误"],"answer":"A","explain":"流感抗病毒治疗的最佳时机是发病后48小时内，对于重症流感患者，即使发病超过48小时，使用抗病毒药物仍可降低病死率，改善预后，因此建议使用。"},{"id":256,"disease":"流感","type":"判断题","difficulty":"困难","q":"256、乙型流感病毒仅感染人类，不会感染其他动物。","options":["A、正确","B、错误"],"answer":"A","explain":"乙型流感病毒的宿主范围较窄，仅感染人类，主要引起季节性流行，不会感染其他动物，该描述正确。"},{"id":257,"disease":"手足口病","type":"单选题","difficulty":"简单","q":"257、手足口病的主要病原体是？","options":["A、肠道病毒71型（EV71）、柯萨奇病毒A16型等","B、流感病毒","C、冠状病毒","D、轮状病毒","E、诺如病毒"],"answer":"A","explain":"手足口病的主要病原体为肠道病毒71型（EV71）和柯萨奇病毒A16型，其中EV71易引发重症。"},{"id":258,"disease":"手足口病","type":"单选题","difficulty":"简单","q":"258、手足口病的高发人群是？","options":["A、5岁以下婴幼儿","B、青少年","C、青壮年","D、老年人","E、孕妇"],"answer":"A","explain":"手足口病主要发生在5岁以下婴幼儿，尤其是3岁以下儿童发病率最高。"},{"id":259,"disease":"手足口病","type":"单选题","difficulty":"简单","q":"259、手足口病的典型首发症状是？","options":["A、发热，手、足、口、臀等部位出现斑丘疹、疱疹","B、咳嗽、咳痰","C、腹泻、呕吐","D、头痛、头晕","E、呼吸困难"],"answer":"A","explain":"手足口病典型表现为发热，手、足、口、臀等部位出现斑丘疹、疱疹，疱疹周围可有炎性红晕。"},{"id":260,"disease":"手足口病","type":"单选题","difficulty":"简单","q":"260、手足口病的主要传播途径是？","options":["A、消化道传播、呼吸道飞沫传播、密切接触传播","B、蚊虫叮咬传播","C、血液传播","D、母婴传播","E、性传播"],"answer":"A","explain":"手足口病主要通过消化道（粪-口）、呼吸道飞沫及密切接触传播，传染性强。"},{"id":261,"disease":"手足口病","type":"单选题","difficulty":"简单","q":"261、预防手足口病最核心的个人卫生措施是？","options":["A、勤洗手，尤其是饭前便后、接触公共物品后","B、长期佩戴口罩","C、大量服用抗病毒药物","D、减少外出","E、频繁消毒衣物"],"answer":"A","explain":"勤洗手是切断手足口病粪-口传播途径最核心、最有效的个人卫生措施。"},{"id":262,"disease":"手足口病","type":"单选题","difficulty":"简单","q":"262、手足口病潜伏期一般为？","options":["A、2-10天，平均3-5天","B、1个月以上","C、24小时内","D、半年","E、1年"],"answer":"A","explain":"手足口病潜伏期通常2-10天，平均3-5天。"},{"id":263,"disease":"手足口病","type":"单选题","difficulty":"简单","q":"263、下列哪项不是手足口病的典型表现？","options":["A、视力下降","B、口腔黏膜疱疹、溃疡","C、手、足、臀部斑丘疹、疱疹","D、发热","E、咽痛、流涎"],"answer":"A","explain":"口腔疱疹、手足臀皮疹、发热、咽痛流涎为手足口病典型表现，视力下降罕见。"},{"id":264,"disease":"手足口病","type":"单选题","difficulty":"简单","q":"264、手足口病的高发季节是？","options":["A、夏秋季","B、冬春季","C、全年无差别","D、冬季","E、春季"],"answer":"A","explain":"手足口病多在夏秋季流行，5-7月为发病高峰。"},{"id":265,"disease":"手足口病","type":"单选题","difficulty":"简单","q":"265、下列哪种行为不会增加手足口病的感染风险？","options":["A、饭前便后规范洗手","B、接触患病儿童","C、共用玩具、餐具","D、接触被污染的公共设施","E、食用被污染的食物"],"answer":"A","explain":"规范洗手可有效切断传播途径，不会增加感染风险，其余均为高风险行为。"},{"id":266,"disease":"手足口病","type":"单选题","difficulty":"简单","q":"266、手足口病患者的隔离期限是？","options":["A、自发病之日起至症状完全消失后1周","B、发热消退即可","C、皮疹消退即可","D、发病后2周","E、发病后1个月"],"answer":"A","explain":"手足口病患者需隔离至症状完全消失后1周，避免传染给其他儿童。"},{"id":267,"disease":"手足口病","type":"单选题","difficulty":"简单","q":"267、下列哪项不属于手足口病的高危人群？","options":["A、健康成年人","B、3岁以下婴幼儿","C、未接种手足口病疫苗的儿童","D、与患病儿童密切接触的儿童","E、免疫力低下的儿童"],"answer":"A","explain":"健康成年人感染后多为隐性感染，不属于高危人群，其余均为高危人群。"},{"id":268,"disease":"手足口病","type":"单选题","difficulty":"简单","q":"268、手足口病口腔疱疹最常见的部位是？","options":["A、舌、颊黏膜、硬腭","B、嘴唇外侧","C、牙龈","D、咽喉部","E、扁桃体"],"answer":"A","explain":"手足口病口腔疱疹多发生在舌、颊黏膜、硬腭等部位，可形成溃疡，引发疼痛、流涎。"},{"id":269,"disease":"手足口病","type":"单选题","difficulty":"简单","q":"269、手足口病的临床分型不包括？","options":["A、慢性型","B、普通型","C、重型","D、危重型","E、隐性感染"],"answer":"A","explain":"手足口病临床分为普通型、重型、危重型，无慢性型，多数患者为普通型。"},{"id":270,"disease":"手足口病","type":"单选题","difficulty":"简单","q":"270、接种手足口病疫苗的主要目的是？","options":["A、预防EV71感染所致的手足口病，降低重症及死亡风险","B、彻底杜绝所有手足口病","C、治疗已感染的患者","D、替代所有防护措施","E、预防所有肠道病毒感染"],"answer":"A","explain":"目前手足口病疫苗主要针对EV71型，可有效预防EV71感染所致的手足口病，显著降低重症及死亡风险。"},{"id":271,"disease":"手足口病","type":"单选题","difficulty":"简单","q":"271、手足口病聚集性疫情的高发单位为？","options":["A、幼托机构","B、小学","C、中学","D、大学","E、养老院"],"answer":"A","explain":"幼托机构是手足口病的高发场所"},{"id":272,"disease":"手足口病","type":"单选题","difficulty":"简单","q":"272、下列哪项不是手足口病的传播途径？","options":["A、蚊虫叮咬传播","B、粪-口传播","C、呼吸道飞沫传播","D、密切接触传播","E、接触被污染的物品传播"],"answer":"A","explain":"手足口病无虫媒传播途径，蚊虫叮咬不会传播手足口病病毒。"},{"id":273,"disease":"手足口病","type":"单选题","difficulty":"简单","q":"273、EV71 疫苗全程几剂次，间隔多久？","options":["A.1 剂","B. 2 剂，间隔 28 天","C.2 剂，间隔 14 天","D.3 剂","E、4剂次"],"answer":"B","explain":"EV71 疫苗全程2剂次，间隔28天"},{"id":274,"disease":"手足口病","type":"单选题","difficulty":"简单","q":"274、手足口病属于哪类传染病？","options":["A、丙类传染病","B、甲类传染病","C、乙类传染病","D、丁类传染病","E、非法定传染病"],"answer":"A","explain":"手足口病属于我国法定丙类传染病，需按规定进行报告和管理。"},{"id":275,"disease":"手足口病","type":"单选题","difficulty":"困难","q":"275、2008年-2015年手足口病重症病例最常见的病原体是？","options":["A、肠道病毒71型（EV71）","B、柯萨奇病毒A16型","C、埃可病毒","D、轮状病毒","E、诺如病毒"],"answer":"A","explain":"EV71是手足口病重症、危重症病例的主要病原体，易引发神经系统、呼吸系统严重并发症。"},{"id":276,"disease":"手足口病","type":"单选题","difficulty":"困难","q":"276、手足口病重症病例的核心临床表现是？","options":["A、神经系统受累、呼吸及循环功能障碍","B、仅发热、皮疹","C、仅口腔疱疹","D、仅腹泻、呕吐","E、仅咽痛、流涎"],"answer":"A","explain":"手足口病重症病例核心表现为神经系统受累（如精神差、嗜睡、抽搐、肢体抖动等）、呼吸及循环功能障碍。"},{"id":277,"disease":"手足口病","type":"单选题","difficulty":"困难","q":"277、下列哪项不是手足口病重症的早期预警信号？","options":["A、食欲好转","B、持续高热不退","C、精神差、嗜睡、烦躁","D、肢体抖动、抽搐","E、呼吸、心率增快"],"answer":"A","explain":"食欲好转为病情好转表现，其余均为手足口病重症的早期预警信号。"},{"id":278,"disease":"手足口病","type":"单选题","difficulty":"困难","q":"278、实验室检测手足口病病原的标本类型不包括？","options":["A、血液","B、尿液","粪便","D、咽拭子","E、疱疹液"],"answer":"B","explain":"手足口病的病原学检测的标本类型包括血液、粪便、咽拭子、疱疹液、脑脊液等，没有尿液"},{"id":279,"disease":"手足口病","type":"单选题","difficulty":"困难","q":"279、手足口病重症病例最常见的神经系统并发症是？","options":["A、无菌性脑膜炎、脑炎","B、脑出血","C、脑梗死","D、颅内肿瘤","E、癫痫"],"answer":"A","explain":"无菌性脑膜炎、脑炎是手足口病重症病例最常见的神经系统并发症，可引发严重后果。"},{"id":280,"disease":"手足口病","type":"单选题","difficulty":"困难","q":"280、以下哪种肠道病毒型别，近年来已成为我国手足口病流行的主要优势型别之一，且易引起重症？","options":["A、CV-A16","B、CV-A6","C、CV-A10","D、埃可病毒11型","E、脊髓灰质炎病毒"],"answer":"B","explain":"近年来柯萨奇病毒A6型（CV-A6）已成为我国手足口病流行的主要优势型别之一，部分毒株可引起重症病例，且皮疹表现不典型，易出现全身广
