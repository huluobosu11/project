ype":"多选题","difficulty":"困难","q":"289、手足口病的病原学检测标本包括？","options":["A、病毒核酸检测","B、血清抗体检测","C、血常规","D、脑脊液检查（重症病例）","E、病毒分离培养"],"answer":"ABE","explain":"手足口病的病原学检测项目包括抗体检测、核酸检测和病毒分离"},{"id":290,"disease":"手足口病","type":"多选题","difficulty":"困难","q":"290、关于手足口病疫苗的描述，正确的有？","options":["A、目前主要为EV71型灭活疫苗","B、可有效预防EV71感染所致的手足口病","C、可降低重症及死亡风险","D、接种对象为6月龄-5岁儿童","E、可预防所有肠道病毒感染"],"answer":"ABCD","explain":"目前手足口病疫苗主要为EV71型灭活疫苗，可有效预防EV71感染，降低重症风险，接种对象为6月龄-5岁儿童，无法预防所有肠道病毒。"},{"id":291,"disease":"手足口病","type":"判断题","difficulty":"简单","q":"291、手足口病主要发生在5岁以下婴幼儿，尤其是3岁以下儿童。","options":["A、正确","B、错误"],"answer":"A","explain":"手足口病的高发人群为5岁以下婴幼儿，3岁以下儿童发病率最高。"},{"id":292,"disease":"手足口病","type":"判断题","difficulty":"简单","q":"292、手足口病的主要传播途径是消化道（粪-口）传播。","options":["A、正确","B、错误"],"answer":"A","explain":"手足口病主要通过消化道（粪-口）传播，也可通过呼吸道飞沫、密切接触传播。"},{"id":293,"disease":"手足口病","type":"判断题","difficulty":"简单","q":"293、勤洗手是预防手足口病最核心、最有效的个人卫生措施。","options":["A、正确","B、错误"],"answer":"A","explain":"规范洗手可有效切断手足口病粪-口传播途径，是核心预防措施。"},{"id":294,"disease":"手足口病","type":"判断题","difficulty":"简单","q":"294、手足口病患者的皮疹会结痂、留疤，瘙痒剧烈。","options":["A、正确","B、错误"],"answer":"B","explain":"手足口病皮疹一般不结痂、不留疤，瘙痒不明显，与水痘皮疹不同。"},{"id":295,"disease":"手足口病","type":"判断题","difficulty":"简单","q":"295、手足口病多在夏秋季流行，5-7月为发病高峰。","options":["A、正确","B、错误"],"answer":"A","explain":"手足口病的高发季节为夏秋季，每年5-7月为发病高峰。"},{"id":296,"disease":"手足口病","type":"判断题","difficulty":"简单","q":"296、手足口病患者需隔离至症状完全消失后1周，避免传染给其他儿童。","options":["A、正确","B、错误"],"answer":"A","explain":"手足口病患者的隔离期限为自发病之日起至症状完全消失后1周，可有效阻断传播。"},{"id":297,"disease":"手足口病","type":"判断题","difficulty":"简单","q":"297、手足口病属于我国法定乙类传染病。","options":["A、正确","B、错误"],"answer":"B","explain":"手足口病属于我国法定丙类传染病，需按规定进行报告和管理。"},{"id":298,"disease":"手足口病","type":"判断题","difficulty":"困难","q":"298、手足口病愈后可获得对所有肠道病毒型别的终身免疫，不会再次感染。","options":["A、正确","B、错误"],"answer":"B","explain":"手足口病愈后仅对本次感染的病毒型别产生特异性免疫力，对其他型别的肠道病毒无交叉免疫保护，仍可再次感染其他型别病毒引起的手足口病。"},{"id":299,"disease":"手足口病","type":"判断题","difficulty":"困难","q":"299、手足口病重症的早期预警信号包括持续高热、精神差、嗜睡、肢体抖动、呼吸心率增快等。","options":["A、正确","B、错误"],"answer":"A","explain":"以上均为手足口病重症的早期预警信号，出现后需及时就医。"},{"id":300,"disease":"手足口病","type":"判断题","difficulty":"困难","q":"300、目前的手足口病疫苗可预防所有肠道病毒感染所致的手足口病。","options":["A、正确","B、错误"],"answer":"B","explain":"目前手足口病疫苗主要针对EV71型，无法预防所有肠道病毒感染。"},{"id":301,"disease":"诺如病毒","type":"单选题","difficulty":"简单","q":"301、诺如病毒感染的典型首发症状是？","options":["A、突发呕吐、腹泻","B、发热、咳嗽","C、头痛、头晕","D、呼吸困难","E、皮疹"],"answer":"A","explain":"诺如病毒感染最典型的首发症状为突发呕吐、腹泻，常伴有恶心、腹痛、低热等症状。"},{"id":302,"disease":"诺如病毒","type":"单选题","difficulty":"简单","q":"302、诺如病毒的主要传播途径是？","options":["A、消化道传播（粪-口）、接触传播、气溶胶传播","B、呼吸道飞沫传播","C、血液传播","D、母婴传播","E、性传播"],"answer":"A","explain":"诺如病毒主要通过消化道（粪-口）传播，也可通过接触被污染的物品、呕吐物/粪便产生的气溶胶传播。"},{"id":303,"disease":"诺如病毒","type":"单选题","difficulty":"简单","q":"303、诺如病毒感染的高发人群是？","options":["A、全人群普遍易感，儿童、老年人、免疫力低下者更易感染","B、仅婴幼儿","C、仅青壮年","D、仅老年人","E、仅孕妇"],"answer":"A","explain":"诺如病毒全人群普遍易感，儿童、老年人、免疫力低下者感染后症状更重，更易发生聚集性疫情。"},{"id":304,"disease":"诺如病毒","type":"单选题","difficulty":"简单","q":"304、预防诺如病毒感染最核心的个人卫生措施是？","options":["A、勤洗手，尤其是饭前便后、接触公共物品后","B、长期佩戴口罩","C、大量服用抗病毒药物","D、减少外出","E、频繁消毒衣物"],"answer":"A","explain":"勤洗手是切断诺如病毒粪-口传播途径最核心、最有效的个人卫生措施。"},{"id":305,"disease":"诺如病毒","type":"单选题","difficulty":"简单","q":"305、诺如病毒感染潜伏期一般为？","options":["A、12-48小时，平均24小时","B、1个月以上","C、24小时内","D、半年","E、1年"],"answer":"A","explain":"诺如病毒感染潜伏期通常12-48小时，平均24小时，潜伏期内即可排出病毒，具有传染性。"},{"id":306,"disease":"诺如病毒","type":"单选题","difficulty":"简单","q":"306、下列哪项不是诺如病毒感染的典型症状？","options":["A、视力下降","B、呕吐、腹泻","C、恶心、腹痛","D、低热、头痛","E、肌肉酸痛"],"answer":"A","explain":"呕吐、腹泻、恶心、腹痛、低热、头痛、肌肉酸痛为诺如病毒感染典型症状，视力下降罕见。"},{"id":307,"disease":"诺如病毒","type":"单选题","difficulty":"简单","q":"307、诺如病毒感染的高发季节是？","options":["A、冬春季","B、夏秋季","C、全年无差别","D、夏季","E、秋季"],"answer":"A","explain":"诺如病毒感染多在冬春季流行，每年10月至次年3月为发病高峰，俗称“冬季呕吐病”。"},{"id":308,"disease":"诺如病毒","type":"单选题","difficulty":"简单","q":"308、诺如病毒感染患者的隔离期限是？","options":["A、自发病之日起至症状完全消失后3天","B、呕吐停止即可","C、腹泻停止即可","D、发病后1周","E、发病后1个月"],"answer":"A","explain":"诺如病毒感染患者需隔离至症状完全消失后3天，避免传染给他人，症状消失后仍可排出病毒。"},{"id":309,"disease":"诺如病毒","type":"单选题","difficulty":"简单","q":"309、学校等重点场所发现诺如病毒感染病例后，以下哪项措施不符合防控要求？","options":["A.及时对患者进行隔离","B.对患者呕吐物、排泄物进行规范消毒","C.立即对整个校园进行大面积酒精喷洒消毒","D..对污染的环境物体表面用含氯消毒剂彻底消毒","E、开展健康宣教"],"answer":"C","explain":"酒精对诺如病毒无效"},{"id":310,"disease":"诺如病毒","type":"单选题","difficulty":"简单","q":"310、以下关于诺如病毒感染的说法，错误的是？","options":["A、目前没有特效药物治疗诺如病毒感染","B、诺如病毒感染属于自限性疾病，多数症状较轻","C、感染诺如病毒后可获得终身免疫，不会再次感染","D、婴幼儿、老年人感染后易出现脱水等严重症状","E、诺如病毒感染以对症治疗和支持治疗为主"],"answer":"C","explain":"诺如病毒感染后体内抗体持续时间较短，且病毒易发生变异，无法获得终身免疫，仍可能再次感染。"},{"id":311,"disease":"诺如病毒","type":"单选题","difficulty":"简单","q":"311、诺如病毒感染患者出现呕吐、腹泻时，首要的护理措施是？","options":["A、及时补液，防止脱水和电解质紊乱","B、禁食禁水","C、大量使用止泻药","D、强制进食","E、增加运动"],"answer":"A","explain":"呕吐、腹泻易引发脱水和电解质紊乱，及时补液为首要护理措施，轻症患者可口服补液盐。"},{"id":312,"disease":"诺如病毒","type":"单选题","difficulty":"简单","q":"312、下列哪项不是诺如病毒的传播途径？","options":["A、蚊虫叮咬传播","B、粪-口传播","C、接触传播","D、气溶胶传播","E、食源性传播"],"answer":"A","explain":"诺如病毒无虫媒传播途径，蚊虫叮咬不会传播诺如病毒。"},{"id":313,"disease":"诺如病毒","type":"单选题","difficulty":"简单","q":"313、诺如病毒属于哪类病毒？","options":["A、杯状病毒科诺如病毒属","B、冠状病毒科","C、轮状病毒科","D、腺病毒科","E、疱疹病毒科"],"answer":"A","explain":"诺如病毒属于杯状病毒科诺如病毒属，是引起急性非细菌性胃肠炎的主要病原体之一。"},{"id":314,"disease":"诺如病毒","type":"单选题","difficulty":"简单","q":"314、下列哪种食物最容易被诺如病毒污染，引发食源性感染？","options":["A、生冷海鲜、贝类","B、煮熟的肉类","C、面包","D、热粥或汤","E、粮食"],"answer":"A","explain":"生冷海鲜、贝类是诺如病毒污染的高风险食物，食用未煮熟的此类食物易引发食源性感染。"},{"id":315,"disease":"诺如病毒","type":"单选题","difficulty":"简单","q":"315、诺如病毒感染患者的粪便、呕吐物消毒处理，首选的消毒剂是？","options":["A、含氯消毒剂","B、75%酒精","C、碘伏","D、过氧化氢","E、高锰酸钾"],"answer":"A","explain":"诺如病毒患者的粪便、呕吐物消毒处理首选含氯消毒剂，可有效灭活病毒，防止二次传播。"},{"id":316,"disease":"诺如病毒","type":"单选题","difficulty":"简单","q":"316、诺如病毒感染属于哪类传染病？","options":["A、丙类传染病","B、甲类传染病","C、乙类传染病","D、丁类传染病","E、非法定传染病"],"answer":"A","explain":"诺如病毒感染属于我国法定丙类传染病，需按规定进行报告和管理。"},{"id":317,"disease":"诺如病毒","type":"单选题","difficulty":"简单","q":"317、以下哪种消毒剂对诺如病毒无效？","options":["A、含氯消毒剂","B、酒精消毒剂","C、漂白粉","D、消毒粉","E、过氧化氢"],"answer":"B","explain":"诺如病毒对常用消毒剂抵抗力较强，酒精对其无效，应选用高水平消毒剂或有效的物理消毒方法。"},{"id":318,"disease":"诺如病毒","type":"单选题","difficulty":"困难","q":"318、诺如病毒最突出的流行病学特点是？","options":["A、传染性极强，易引发聚集性疫情","B、仅感染婴幼儿","C、仅在夏季流行","D、仅通过食物传播","E、仅感染老年人"],"answer":"A","explain":"诺如病毒传染性极强，极低剂量即可感染，易在托幼机构、学校、养老院、邮轮等密闭场所引发聚集性疫情。"},{"id":319,"disease":"诺如病毒","type":"单选题","difficulty":"困难","q":"319、诺如病毒胃肠炎密切接触者的医学观察期通常为？","options":["A、24小时","B、48小时","C、72小时","D、5天","E、7天"],"answer":"C","explain":"依据《诺如病毒暴发防控技术指南 2025》，诺如病毒胃肠炎密切接触者的医学观察期通常为72小时，观察期间需每日监测健康状况，一旦出现恶心、呕吐、腹泻等症状，需立即隔离并就诊。"},{"id":320,"disease":"诺如病毒","type":"单选题","difficulty":"困难","q":"320、诺如病毒感染患者出现呕吐症状后，以下处理方式错误的是？","options":["A、立即引导其他人员向相对清洁的方向转移","B、用含吸水成分的消毒粉完全覆盖呕吐物","C、用清水直接冲洗呕吐物后再消毒","D、消毒至作用时间后，小心清除干净","E、处理人员应做好个人防护"],"answer":"C","explain":"患者呕吐物、排泄物等大量污染物应使用含吸水成分的消毒粉或漂白粉完全覆盖，或能达到高水平消毒的消毒干巾完全覆盖，消毒至作用时间后，小心清除干净，不能直接用清水冲洗，避免病毒扩散。"},{"id":321,"disease":"诺如病毒","type":"单选题","difficulty":"困难","q":"321、实验室检测诺如病毒感染急性期首选的特异性指标是？","options":["A、粪便/呕吐物诺如病毒核酸检测阳性","B、血常规白细胞升高","C、肝功能异常","D、肾功能异常","E、心肌酶升高"],"answer":"A","explain":"粪便/呕吐物诺如病毒核酸检测阳性是急性期确诊的首选特异性指标，可明确病毒型别。"},{"id":322,"disease":"诺如病毒","type":"单选题","difficulty":"困难","q":"322、关于诺如病毒的免疫保护，以下说法正确的是？","options":["A、感染后可获得终身免疫，不会再次感染","B、感染后仅能获得同基因型的短期免疫，对其他基因型无交叉保护","C、接种诺如病毒疫苗后可获得100%的保护率","D、儿童感染后获得的免疫保护时间长于成年人","E、既往感染过诺如病毒的人群，再次感染后症状会更严重"],"answer":"B","explain":"依据《诺如病毒胃肠炎诊疗方案（2025 版）》，诺如病毒感染后仅能获得同基因型的短期免疫，对其他基因型无交叉保护，因此可出现多次感染；目前诺如病毒疫苗仍在研发阶段，无上市疫苗；儿童感染后免疫保护时间短于成年人，再次感染风险更高。"},{"id":323,"disease":"诺如病毒","type":"单选题","difficulty":"困难","q":"323、诺如病毒的病原学检测方法不包括？","options":["A、病毒核酸检测","B、病毒抗原检测","C、病毒抗体IgM抗体检测","D、病毒分离","E、血常规检查"],"answer":"E","explain":"血常规检查不是诺如病毒的病原学检测方法"},{"id":324,"disease":"诺如病毒","type":"单选题","difficulty":"困难","q":"324、托幼机构发现诺如病毒感染病例后，正确的处置措施是？","options":["A、立即隔离患病儿童，对呕吐物、粪便及环境进行终末消毒，开展晨午检，加强健康监测","B、立即关闭托幼机构","C、对所有儿童使用抗病毒药物","D、对患病儿童进行居家隔离，无需其他措施","E、对患病儿童进行抗生素治疗"],"answer":"A","explain":"托幼机构发现病例后，需立即隔离患病儿童，对呕吐物、粪便及环境终末消毒，加强晨午检和健康监测，避免疫情扩散。"},{"id":325,"disease":"诺如病毒","type":"单选题","difficulty":"困难","q":"325、诺如病毒感染患者的呕吐物、粪便消毒处理，含氯消毒剂的有效浓度应为？","options":["A、5000mg/L以上","B、500mg/L","C、1000mg/L","D、2000mg/L","E、10000mg/L以上"],"answer":"A","explain":"诺如病毒患者的呕吐物、粪便消毒处理，需使用5000mg/L以上的含氯消毒剂，作用30分钟以上，确保彻底灭活病毒。"},{"id":326,"disease":"诺如病毒","type":"单选题","difficulty":"困难","q":"326、下列哪项不是诺如病毒防控的核心措施？","options":["A、大规模人群使用抗病毒药物预防","B、加强疫情监测","C、做好个人卫生，勤洗手","D、加强托幼机构、学校等重点场所防控","E、开展健康宣教"],"answer":"A","explain":"大规模使用抗病毒药物无法预防诺如病毒感染，反而可能引发耐药性，不是防控核心措施。"},{"id":327,"disease":"诺如病毒","type":"多选题","difficulty":"简单","q":"327、诺如病毒感染的典型临床表现有？","options":["A、突发呕吐、腹泻","B、恶心、腹痛","C、低热、头痛","D、肌肉酸痛","E、咳嗽、咳痰"],"answer":"ABCD","explain":"呕吐、腹泻、恶心、腹痛、低热、头痛、肌肉酸痛为诺如病毒感染典型症状，咳嗽咳痰不是核心症状。"},{"id":328,"disease":"诺如病毒","type":"多选题","difficulty":"简单","q":"328、预防诺如病毒感染的有效措施包括？","options":["A、饭前便后规范洗手","B、避免接触感染患者","C、加强环境消杀","D、开展健康宣教","E、大量服用抗病毒药物"],"answer":"ABCD","explain":"勤洗手、避免接触病例、环境消杀、健康宣教为有效预防措施，大量服用抗病毒药物无效且有风险。"},{"id":329,"disease":"诺如病毒","type":"多选题","difficulty":"简单","q":"329、诺如病毒感染的高危人群包括？","options":["A、婴幼儿","B、老年人","C、免疫力低下者","D、与感染患者密切接触的人员","E、健康青壮年"],"answer":"ABCD","explain":"婴幼儿、老年人、免疫力低下者、密切接触病例的人员为高危人群，健康青壮年多为轻症。"},{"id":330,"disease":"诺如病毒","type":"多选题","difficulty":"简单","q":"330、可有效灭活诺如病毒的方法有？","options":["A、100℃煮沸2分钟以上","B、过氧化氢消毒剂","C、含氯消毒剂消毒","D、紫外线照射","E、常温放置"],"answer":"ABCD","explain":"高温、过氧化氢消毒剂、含氯消毒剂、紫外线均可有效灭活诺如病毒，常温放置无法灭活。"},{"id":331,"disease":"诺如病毒","type":"多选题","difficulty":"简单","q":"331、学校等重点场所发生诺如病毒聚集性疫情后，应采取的防控措施有？","options":["A、及时隔离患病学生，暂停上课","B、对污染的教室、宿舍、厕所等场所进行终末消毒","C、对全校师生开展健康监测","D、加强食堂食品安全管理，规范食品加工流程","E、对患病学生进行对症治疗"],"answer":"ABCDE","explain":"学校等重点场所发生疫情后，应及时隔离患者，暂停相关班级上课；对污染场所进行终末消毒；开展全校师生健康监测；加强食堂食品安全管理，避免疫情扩散。"},{"id":332,"disease":"诺如病毒","type":"多选题","difficulty":"困难","q":"332、以下哪些场景属于诺如病毒感染的高风险场景？","options":["A、托幼机构集体生活","B、学校教室、宿舍","C、人员密集的餐饮场所","D、医院儿科病房","E、养老机构"],"answer":"ABCDE","explain":"学校、托幼机构是人群聚集的场所，也是诺如病毒感染高发的场所；人员密集的餐饮场所、医院儿科病房等也属于高风险场景，易发生聚集性疫情。"},{"id":333,"disease":"诺如病毒","type":"多选题","difficulty":"困难","q":"333、关于诺如病毒的消毒处置，以下说法正确的有？","options":["A、物体表面消毒首选含氯消毒剂，常用浓度500mg/L～1000mg/L","B、呕吐物、腹泻物消毒需使用5000mg/L含氯消毒剂，作用不少于30分钟","C、对污染的衣物、被褥可采用煮沸消毒30分钟，或含氯消毒剂浸泡消毒","D、室内空气消毒可采用紫外线照射，作用不少于30分钟","E、75%酒精对诺如病毒的消毒效果优于含氯消毒剂"],"answer":"ABCD","explain":"依据《诺如病毒暴发防控技术指南 2025》，诺如病毒对含氯消毒剂敏感，物体表面消毒首选含氯消毒剂，常用浓度500mg/L～1000mg/L；呕吐物、腹泻物消毒需使用5000mg/L含氯消毒剂，作用不少于30分钟；污染的衣物、被褥可采用煮沸消毒30分钟，或含氯消毒剂浸泡消毒；室内空气消毒可采用紫外线照射，作用不少于30分钟；75%酒精对诺如病毒的消毒效果有限，不如含氯消毒剂。"},{"id":334,"disease":"诺如病毒","type":"多选题","difficulty":"困难","q":"334、关于诺如病毒的描述，正确的有？","options":["A、属于杯状病毒科诺如病毒属","B、传染性极强，极低剂量即可感染","C、全人群普遍易感","D、冬春季为高发季节","E、有特效抗病毒药物可治疗"],"answer":"ABCD","explain":"诺如病毒属于杯状病毒科诺如病毒属，传染性极强，全人群普遍易感，冬春季高发，目前尚无特效抗病毒药物。"},{"id":335,"disease":"诺如病毒","type":"判断题","difficulty":"简单","q":"335、诺如病毒感染最典型的首发症状为突发呕吐、腹泻。","options":["A、正确","B、错误"],"answer":"A","explain":"诺如病毒感染最典型的首发症状为突发呕吐、腹泻，常伴有恶心、腹痛等症状。"},{"id":336,"disease":"诺如病毒","type":"判断题","difficulty":"简单","q":"336、勤洗手是预防诺如病毒感染最核心、最有效的个人卫生措施。","options":["A、正确","B、错误"],"answer":"A","explain":"规范洗手可有效切断诺如病毒粪-口传播途径，是核心预防措施。"},{"id":337,"disease":"诺如病毒","type":"判断题","difficulty":"简单","q":"337、诺如病毒感染仅感染婴幼儿，成年人不会感染。","options":["A、正确","B、错误"],"answer":"B","explain":"诺如病毒全人群普遍易感，成年人也可感染，多为轻症或隐性感染。"},{"id":338,"disease":"诺如病毒","type":"判断题","difficulty":"简单","q":"338、诺如病毒感染多在冬春季流行，俗称“冬季呕吐病”。","options":["A、正确","B、错误"],"answer":"A","explain":"诺如病毒感染的高发季节为冬春季，每年10月至次年3月为发病高峰。"},{"id":339,"disease":"诺如病毒","type":"判断题","difficulty":"简单","q":"339、诺如病毒感染患者需隔离至症状完全消失后3天。","options":["A、正确","B、错误"],"answer":"A","explain":"诺如病毒感染患者需隔离至症状完全消失后3天，症状消失后仍可排出病毒，具有传染性。"},{"id":340,"disease":"诺如病毒","type":"判断题","difficulty":"简单","q":"340、诺如病毒感染属于我国法定乙类传染病。","options":["A、正确","B、错误"],"answer":"B","explain":"诺如病毒感染属于我国法定丙类传染病，需按规定进行报告和管理。"},{"id":341,"disease":"诺如病毒","type":"判断题","difficulty":"困难","q":"341、诺如病毒传染性极强，极低剂量即可感染，易在密闭场所引发聚集性疫情。","options":["A、正确","B、错误"],"answer":"A","explain":"诺如病毒传染性极强，仅需10-100个病毒颗粒即可感染，易在托幼机构、学校、养老院等密闭场所引发聚集性疫情。"},{"id":342,"disease":"诺如病毒","type":"判断题","difficulty":"困难","q":"342、诺如病毒感染患者在症状消失后仍可排出病毒，最长可达2周以上。","options":["A、正确","B、错误"],"answer":"A","explain":"诺如病毒感染患者在症状消失后仍可排出病毒，最长可达2周以上，是疫情传播的重要隐患。"},{"id":343,"disease":"诺如病毒","type":"判断题","difficulty":"困难","q":"343、目前已有特效抗病毒药物可治疗诺如病毒感染。","options":["A、正确","B、错误"],"answer":"B","explain":"目前尚无特效抗病毒药物可治疗诺如病毒感染，治疗以对症支持、补液纠正脱水和电解质紊乱为主。"},{"id":344,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"344、新冠病毒主要的传播途径是？","options":["A、呼吸道飞沫和密切接触传播","B、蚊虫叮咬传播","C、土壤传播","D、血液传播","E、消化道传播"],"answer":"A","explain":"新冠病毒最主要传播方式为呼吸道飞沫传播与密切接触传播。"},{"id":345,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"345、新冠病毒感染后典型首发症状一般不包括？","options":["A、发热","B、干咳","C、乏力","D、肢体活动障碍","E、咽痛"],"answer":"D","explain":"发热、干咳、乏力、咽痛为新冠常见症状，肢体活动障碍不属于典型表现。"},{"id":346,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"346、针对新冠病毒，以下哪种防护用品对飞沫防护效果最佳？","options":["A、普通纱布口罩","B、医用外科口罩","C、装饰口罩","D、防晒口罩","E、棉布口罩"],"answer":"B","explain":"医用外科口罩可有效阻挡呼吸道飞沫，是日常防疫首选。"},{"id":347,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"347、新冠病毒感染无症状感染者指的是？","options":["A、无相关临床症状，但核酸检测阳性","B、有症状但核酸阴性","C、重症患者恢复期","D、接种疫苗人群","E、密切接触者"],"answer":"A","explain":"无症状感染者定义：核酸检测阳性，无发热、咳嗽等新冠相关临床表现。"},{"id":348,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"348、新冠病毒的主要宿主细胞主要侵犯人体哪个系统？","options":["A、呼吸系统","B、泌尿系统","C、运动系统","D、生殖系统","E、骨骼系统"],"answer":"A","explain":"新冠病毒主要侵袭人体呼吸道，引发肺部及气道病变。"},{"id":349,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"349、日常居家预防新冠，最基础的措施是？","options":["A、勤洗手、常通风","B、大量服用药物","C、长期佩戴护目镜","D、足不出户","E、频繁消毒衣物"],"answer":"A","explain":"勤洗手、定时开窗通风是居家最基础、有效的防疫手段。"},{"id":350,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"350、新冠病毒核酸检测主要采集的标本不包括？","options":["A、鼻咽拭子","B、口咽拭子","C、痰液","D、血液","E、肺泡灌洗液"],"answer":"D","explain":"核酸检测常用鼻咽拭子、口咽拭子、痰液等，血液不作为检测标本。"},{"id":351,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"351、新冠病毒感染轻型患者的特点是？","options":["A、症状轻微，无肺炎影像学表现","B、出现呼吸衰竭","C、需呼吸机支持","D、多器官功能损伤","E、持续高热不退"],"answer":"A","explain":"轻型新冠患者仅表现为轻微上呼吸道症状，肺部影像学无肺炎改变。"},{"id":352,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"352、新冠密切接触者的判定，以下说法正确的是？","options":["A、与病例近距离接触未有效防护人员","B、擦肩而过路人","C、同一小区无接触居民","D、异地人员","E、线上沟通人员"],"answer":"A","explain":"近距离接触新冠病例且未做好防护，判定为密切接触者。"},{"id":353,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"353、接种新冠疫苗的主要目的是？","options":["A、降低感染、重症及死亡风险","B、彻底杜绝病毒传播","C、治疗已感染患者","D、替代所有防护措施","E、消除病毒变异"],"answer":"A","explain":"新冠疫苗可有效降低感染概率，减少重症、危重症及死亡风险。"},{"id":354,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"354、新冠病毒在物体表面存活时间受哪项影响最大？","options":["A、温度和湿度","B、物体颜色","C、物体大小","D、摆放位置","E、材质名称"],"answer":"A","explain":"环境温度、湿度直接影响新冠病毒在物体表面的存活时长。"},{"id":355,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"355、新冠病毒感染普通型患者典型影像学表现为？","options":["A、肺部出现炎性病灶","B、脑部病变","C、肾脏病变","D、肝脏病变","E、心脏钙化"],"answer":"A","explain":"普通型新冠患者胸部CT/胸片可见肺部炎症浸润影。"},{"id":356,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"356、下列哪项不属于新冠病毒感染后的消化道症状？","options":["A、腹泻","B、呕吐","C、恶心","D、腹痛","E、视力下降"],"answer":"E","explain":"腹泻、呕吐、恶心、腹痛为新冠偶发消化道症状，视力下降无关。"},{"id":357,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"357、公共场所预防新冠，以下行为错误的是？","options":["A、扎堆聚集、近距离交谈","B、保持安全社交距离","C、规范佩戴口罩","D、不随地吐痰","E、接触公共物品后洗手"],"answer":"A","explain":"人员扎堆聚集会大幅增加病毒传播风险，属于错误行为。"},{"id":358,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"358、目前国内外流行的新型冠状病毒优势毒株是以下哪一种？","options":["A、德尔塔变异株","B、奥密克戎变异株","C、阿尔法变异株","D、贝塔变异株","E、伽马变异株"],"answer":"B","explain":"依据《新型冠状病毒感染防控方案（第十版）》，目前，奥密克戎变异株已成为国内外流行优势毒株。"},{"id":359,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"359、新型冠状病毒疫苗接种的基本原则是以下哪一项？","options":["A、强制接种","B、知情、同意、自愿","C、免费接种","D、重点人群优先","E、以上都不对"],"answer":"B","explain":"依据《新型冠状病毒感染防控方案（第十版）》，疫苗接种坚持知情、同意、自愿原则，鼓励3岁以上适龄无接种禁忌人群应接尽接。"},{"id":360,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"360、新型冠状病毒肺炎名称调整为以下哪一项？","options":["A、新冠肺炎","B、新型冠状病毒感染","C、新冠病毒肺炎","D、新型冠状病毒呼吸道感染","E、非典型肺炎"],"answer":"B","explain":"依据《新型冠状病毒感染防控方案（第十版）》，将原疾病名称\"新型冠状病毒肺炎\"更名为\"新型冠状病毒感染\"。"},{"id":361,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"361、新冠病毒感染潜伏期一般为？","options":["A、1-14天，多为3-7天","B、1个月以上","C、24小时内","D、半年","E、1年"],"answer":"A","explain":"新冠病毒潜伏期多为3-7天，最长一般不超过14天。"},{"id":362,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"362、儿童感染新冠后，多数临床表现为？","options":["A、症状较轻","B、全部发展为重症","C、持续昏迷","D、严重呼吸窘迫","E、多器官衰竭"],"answer":"A","explain":"儿童群体感染新冠后，整体症状偏轻，重症比例极低。"},{"id":363,"disease":"新冠病毒感染","type":"单选题","difficulty":"简单","q":"363、新冠疫情期间，快递收取正确做法是？","options":["A、拆件后及时洗手","B、拆件前不做任何防护","C、拆件后揉眼睛","D、快递盒长期存放室内","E、徒手接触口鼻"],"answer":"A","explain":"收取快递拆封后及时洗手，可防范接触传播风险。"},{"id":364,"disease":"新冠病毒感染","type":"单选题","difficulty":"困难","q":"364、新冠病毒奥密克戎变异株最突出的特点是？","options":["A、传播力极强、隐匿性高","B、致病力极强","C、仅感染老年人","D、无法被核酸检出","E、只通过消化道传播"],"answer":"A","explain":"奥密克戎变异株传播能力、隐匿传播能力显著增强，致病力有所下降。"},{"id":365,"disease":"新冠病毒感染","type":"单选题","difficulty":"困难","q":"365、新冠常态化监测预警不包括以下哪项内容？","options":["A、病毒变异监测","B、个案报告","C、哨点医院监测","D、全员核酸筛查","E、城市污水监测"],"answer":"D","explain":"依据《新型冠状病毒感染防控方案（第十版）》，常态化情况下，主要开展病毒变异监测、个案报告、哨点医院监测、不明原因肺炎监测、城市污水监测等，不再开展全员核酸筛查。"},{"id":366,"disease":"新冠病毒感染","type":"单选题","difficulty":"困难","q":"366、新冠病毒抗原检测相比核酸检测，主要劣势是？","options":["A、灵敏度偏低，易出现假阴性","B、操作复杂","C、出结果慢","D、必须专业人员操作","E、成本极高"],"answer":"A","explain":"抗原检测操作简便、出结果快，但灵敏度低于核酸检测，存在假阴性可能。"},{"id":367,"disease":"新冠病毒感染","type":"单选题","difficulty":"困难","q":"367、以下关于新型冠状病毒气溶胶传播的说法，错误的是哪一项？","options":["A、可在相对封闭的环境中经气溶胶传播","B、气溶胶传播是指飞沫在空气悬浮过程中失去水分而剩下的蛋白质和病原体组成的核，形成飞沫核，可通过气溶胶形式漂浮至远处造成远距离传播","C、日常社交距离下，气溶胶传播是最主要的传播途径","D、在通风不良的室内，气溶胶传播的风险显著升高","E、佩戴符合标准的口罩可有效降低气溶胶传播的风险"],"answer":"C","explain":"依据《新型冠状病毒感染防控方案（第十版）》，新型冠状病毒主要传播途径为经呼吸道飞沫和密切接触传播，在相对封闭的环境中经气溶胶传播，日常社交距离下，飞沫和密切接触是最主要的传播途径，而非气溶胶传播。"},{"id":368,"disease":"新冠病毒感染","type":"单选题","difficulty":"困难","q":"368、针对新冠病毒的终末消毒，重点消毒区域不包括？","options":["A、室外空旷广场","B、患者居住房间","C、卫生间","D、门把手","E、床上用品"],"answer":"A","explain":"终末消毒针对患者活动的室内环境及物品，室外广场无需重点消毒。"},{"id":369,"disease":"新冠病毒感染","type":"单选题","difficulty":"困难","q":"369、新冠病毒抗体检测中，IgM抗体主要提示？","options":["A、近期急性感染","B、既往感染/接种疫苗后远期免疫","C、终身携带病毒","D、检测误差","E、健康无感染"],"answer":"A","explain":"IgM抗体出现早，提示近期急性感染；IgG提示既往感染或免疫保护。"},{"id":370,"disease":"新冠病毒感染","type":"单选题","difficulty":"困难","q":"370、新冠病毒气溶胶传播最易发生在哪种场景？","options":["A、密闭、无通风的狭小空间","B、露天广场","C、开阔公园","D、户外道路","E、通风良好大厅"],"answer":"A","explain":"密闭、通风差的环境易形成气溶胶，增加传播风险。"},{"id":371,"disease":"新冠病毒感染","type":"单选题","difficulty":"困难","q":"371、新冠实施乙类乙管以后，以下关于新型冠状病毒感染传染源管理的说法，正确的是哪一项？","options":["A、新型冠状病毒感染者必须实施集中隔离","B、新型冠状病毒感染者必须实施居家隔离","C、新型冠状病毒感染者不再实施隔离措施，可根据病情需要进行对症治疗和健康监测","D、无症状感染者必须实施7天居家隔离","E、轻症感染者必须实施5天居家隔离"],"answer":"C","explain":"依据《新型冠状病毒感染防控方案（第十版）》，调整了传染源管理方式，新型冠状病毒感染者不再实施隔离措施，可根据病情需要进行对症治疗和健康监测。"},{"id":372,"disease":"新冠病毒感染","type":"单选题","difficulty":"困难","q":"372、新冠病毒基因测序主要用于？","options":["A、追踪病毒变异、溯源流调","B、常规快速筛查感染人群","C、替代抗原检测","D、治疗新冠患者","E、日常体检"],"answer":"A","explain":"病毒基因测序用于毒株分型、变异监测、流行病学溯源工作。"},{"id":373,"disease":"新冠病毒感染","type":"单选题","difficulty":"困难","q":"373、新冠恢复期复阳患者，多数情况原因为？","options":["A、残留病毒核酸片段，无传染性","B、再次大面积感染","C、病毒变异加重病情","D、出现新并发症","E、检测设备故障"],"answer":"A","explain":"多数复阳仅检出病毒核酸片段，无活病毒，基本不具备传染性。"},{"id":374,"disease":"新冠病毒感染","type":"多选题","difficulty":"简单","q":"374、新冠病毒主要传播途径包括？","options":["A、呼吸道飞沫传播","B、密切接触传播","C、气溶胶传播（特定环境）","D、虫媒传播","E、水源传播"],"answer":"ABC","explain":"新冠主要传播为飞沫、密切接触，密闭环境可发生气溶胶传播，无虫媒、水源传播。"},{"id":375,"disease":"新冠病毒感染","type":"多选题","difficulty":"简单","q":"375、新冠病毒感染常见临床表现有？","options":["A、发热","B、干咳","C、乏力","D、咽痛","E、流涕"],"answer":"ABCDE","explain":"以上均为新冠感染后常见的上呼吸道及全身症状。"},{"id":376,"disease":"新冠病毒感染","type":"多选题","difficulty":"简单","q":"376、日常预防新冠的有效措施包括？","options":["A、规范佩戴口罩","B、勤洗手","C、保持社交距离","D、常开窗通风","E、避免人群聚集"],"answer":"ABCDE","explain":"五项均为日常防控新冠的核心有效措施。"},{"id":377,"disease":"新冠病毒感染","type":"多选题","difficulty":"简单","q":"377、新冠疫苗接种的人群获益包括？","options":["A、降低感染风险","B、减少重症发生","C、降低死亡风险","D、减轻临床症状","E、缩短病程"],"answer":"ABCDE","explain":"接种新冠疫苗可从多方面降低感染危害，改善预后。"},{"id":378,"disease":"新冠病毒感染","type":"多选题","difficulty":"简单","q":"378、可有效灭活新冠病毒的消毒剂有？","options":["A、75%酒精","B、含氯消毒剂","C、过氧乙酸","D、乙醚","E、白醋"],"answer":"ABCD","explain":"75%酒精、含氯消毒剂、过氧乙酸、乙醚均可灭活新冠病毒，纯净水无效。"},{"id":379,"disease":"新冠病毒感染","type":"多选题","difficulty":"简单","q":"379、新冠病毒感染临床分型包含？","options":["A、轻型","B、普通型","C、重型","D、危重型","E、无症状感染者"],"answer":"ABCDE","explain":"新冠分为无症状感染者、轻型、普通型、重型、危重型五类。"},{"id":380,"disease":"新冠病毒感染","type":"多选题","difficulty":"简单","q":"380、《新型冠状病毒感染防控方案（第十版）》中，常态化监测预警的内容包括以下哪些？","options":["A、病毒变异监测","B、个案报告","C、哨点医院监测","D、聚集性疫情监测","E、全员核酸筛查"],"answer":"ABCD","explain":"依据《新型冠状病毒感染防控方案（第十版）》，常态化情况下，主要开展病毒变异监测、个案报告、哨点医院监测、不明原因肺炎监测、城市污水监测等，不再开展全员核酸筛查。"},{"id":381,"disease":"新冠病毒感染","type":"多选题","difficulty":"困难","q":"381、以下关于新型冠状病毒疫苗接种的说法，正确的有哪些？","options":["A、坚持知情、同意、自愿原则","B、鼓励3岁以上适龄无接种禁忌人群应接尽接","C、倡导老年人积极主动全程接种疫苗和加强免疫接种","D、高风险人群完成第一剂次加强免疫满6个月后可进行第二剂次加强免疫","E、接种疫苗后可完全避免感染新型冠状病毒"],"answer":"ABCD","explain":"依据《新型冠状病毒感染防控方案（第十版）》，疫苗接种坚持知情、同意、自愿原则，鼓励3岁以上适龄无接种禁忌人群应接尽接，倡导公众特别是老年人积极主动全程接种疫苗和加强免疫接种；对高风险人群，在完成第一剂次加强免疫接种满6个月后，可进行第二剂次加强免疫接种。接种疫苗可有效降低重症和死亡的风险，但不能完全避免感染。"},{"id":382,"disease":"新冠病毒感染","type":"多选题","difficulty":"困难","q":"382、新冠病毒实验室检测方法包括？","options":["A、实时荧光RT-PCR核酸检测","B、病毒基因测序","C、血清抗体检测","D、抗原快速检测","E、尿常规检测"],"answer":"ABCD","explain":"核酸、测序、抗体、抗原均为新冠专项检测，尿常规不用于新冠诊断。"},{"id":383,"disease":"新冠病毒感染","type":"多选题","difficulty":"困难","q":"383、新冠感染后居家治疗适用人群条件有？","options":["A、轻型、无症状感染者","B、无严重基础疾病","C、具备独立居住条件","D、有健康监护能力","E、危重型患者"],"answer":"ABCD","explain":"居家治疗仅适用于轻型、无症状且基础状况良好人群，危重型必须住院。"},{"id":384,"disease":"新冠病毒感染","type":"判断题","difficulty":"简单","q":"384、《新型冠状病毒感染防控方案（第十版）》明确的防控工作目标是\"保健康、防重症\"。","options":["A、正确","B、错误"],"answer":"A","explain":"依据《新型冠状病毒感染防控方案（第十版）》，防控工作实现\"保健康、防重症\"的工作目标，最大程度保护人民生命安全和身体健康，最大限度减少疫情对经济社会发展的影响。"},{"id":385,"disease":"新冠病毒感染","type":"判断题","difficulty":"简单","q":"385、75%医用酒精可以有效杀灭新冠病毒。","options":["A、正确","B、错误"],"answer":"A","explain":"75%酒精是灭活新冠病毒的常用高效消毒剂。"},{"id":386,"disease":"新冠病毒感染","type":"判断题","difficulty":"简单","q":"386、接种新冠疫苗后就不会被病毒感染。","options":["A、正确","B、错误"],"answer":"B","explain":"疫苗可降低感染风险，但无法做到100%杜绝感染。"},{"id":387,"disease":"新冠病毒感染","type":"判断题","difficulty":"简单","q":"387、新冠无症状感染者同样具有传染性。","options":["A、正确","B、错误"],"answer":"A","explain":"无症状感染者核酸阳性，体内存在活病毒，具备传播能力。"},{"id":388,"disease":"新冠病毒感染","type":"判断题","difficulty":"简单","q":"388、勤开窗通风能够降低室内新冠病毒浓度。","options":["A、正确","B、错误"],"answer":"A","explain":"通风可稀释室内病毒气溶胶，减少传播风险。"},{"id":389,"disease":"新冠病毒感染","type":"判断题","difficulty":"简单","q":"389、新冠病毒感染潜伏期患者无传染性。","options":["A、正确","B、错误"],"answer":"B","explain":"潜伏期内病毒已开始复制，部分患者潜伏期即可传播病毒。"},{"id":390,"disease":"新冠病毒感染","type":"判断题","difficulty":"简单","q":"390、医用外科口罩只要外表没有污渍就可以继续使用。","options":["A、正确","B、错误"],"answer":"B","explain":"医用外科口罩外表没有污渍也不可以长期使用"},{"id":391,"disease":"新冠病毒感染","type":"判断题","difficulty":"困难","q":"391、新冠病毒IgG抗体阳性代表患者处于急性感染期。","options":["A、正确","B、错误"],"answer":"B","explain":"IgG阳性多提示既往感染或疫苗接种后产生保护性抗体，IgM提示急性感染。"},{"id":392,"disease":"新冠病毒感染","type":"判断题","difficulty":"困难","q":"392、密闭空间内新冠气溶胶传播风险远高于露天环境。","options":["A、正确","B、错误"],"answer":"A","explain":"空气不流通的密闭环境易积聚气溶胶，传播风险显著升高。"},{"id":393,"disease":"新冠病毒感染","type":"判断题","difficulty":"困难","q":"393、新冠病毒感染2023年以后按照乙类传染病管理。","options":["A、正确","B、错误"],"answer":"B","explain":"新冠病毒感染2023年以后按照乙类传染病管理。"},{"id":394,"disease":"猩红热","type":"单选题","difficulty":"简单","q":"394、猩红热的病原体是？","options":["A、A组β型溶血性链球菌","B、金黄色葡萄球菌","C、肺炎链球菌","D、流感嗜血杆菌","E、大肠杆菌"],"answer":"A","explain":"猩红热是由A组β型溶血性链球菌感染引起的急性呼吸道传染病。"},{"id":395,"disease":"猩红热","type":"单选题","difficulty":"简单","q":"395、猩红热的高发人群是？","options":["A、5-15岁儿童","B、婴幼儿","C、青壮年","D、老年人","E、孕妇"],"answer":"A","explain":"猩红热主要发生在5-15岁的儿童和青少年，婴幼儿和成年人较少见。"},{"id":396,"disease":"猩红热","type":"单选题","difficulty":"简单","q":"396、猩红热的典型首发症状是？","options":["A、突发高热、咽峡炎，随后出现全身弥漫性鲜红色皮疹","B、咳嗽、咳痰","C、腹泻、呕吐","D、头痛、头晕","E、呼吸困难"],"answer":"A","explain":"猩红热典型表现为突发高热、咽峡炎，发病后1-2天出现全身弥漫性鲜红色皮疹，疹退后伴脱屑。"},{"id":397,"disease":"猩红热","type":"单选题","difficulty":"简单","q":"397、猩红热的主要传播途径是？","options":["A、呼吸道飞沫传播","B、消化道传播","C、血液传播","D、母婴传播","E、性传播"],"answer":"A","explain":"猩红热主要通过呼吸道飞沫传播，也可通过接触被污染的物品传播，偶可经皮肤伤口或产道感染。"},{"id":398,"disease":"猩红热","type":"单选题","difficulty":"简单","q":"398、预防猩红热最核心的措施是？","options":["A、隔离患者，切断呼吸道传播途径","B、服用抗生素","C、接种疫苗","D、减少外出","E、频繁消毒衣物"],"answer":"A","explain":"隔离患者、切断呼吸道传播途径是预防猩红热最核心的措施，目前尚无有效疫苗。"},{"id":399,"disease":"猩红热","type":"单选题","difficulty":"简单","q":"399、猩红热潜伏期一般为？","options":["A、1-7天，平均2-3天","B、1个月以上","C、24小时内","D、半年","E、1年"],"answer":"A","explain":"猩红热潜伏期通常1-7天，平均2-3天。"},{"id":400,"disease":"猩红热","type":"单选题","difficulty":"简单","q":"400、下列哪项不是猩红热的典型体征？","options":["A、视力下降","B、咽峡炎、扁桃体红肿伴脓性分泌物","C、草莓舌","D、全身弥漫性鲜红色皮疹","E、疹退后脱屑"],"answer":"A","explain":"咽峡炎、草莓舌、全身皮疹、疹退后脱屑为猩红热典型体征，视力下降罕见。"},{"id":401,"disease":"猩红热","type":"单选题","difficulty":"简单","q":"401、猩红热的高发季节是？","options":["A、冬春季","B、夏秋季","C、全年无差别","D、夏季","E、秋季"],"answer":"A","explain":"猩红热多在冬春季流行，与低温环境利于呼吸道细菌传播有关。"},{"id":402,"disease":"猩红热","type":"单选题","difficulty":"简单","q":"402、下列哪种行为不会增加猩红热的感染风险？","options":["A、规范佩戴口罩，避免接触患者","B、与患者密切接触","C、共用玩具、餐具","D、接触被污染的公共设施","E、在人员密集场所不戴口罩"],"answer":"A","explain":"规范佩戴口罩、避免接触患者可有效切断传播途径，不会增加感染风险，其余均为高风险行为。"},{"id":403,"disease":"猩红热","type":"单选题","difficulty":"简单","q":"403、猩红热患者的隔离期限是？","options":["A、自发病之日起至症状完全消失，或者治疗之日起不少于 7 天。","B、发热消退即可","C、皮疹消退即可","D、发病后2周","E、发病后1个月"],"answer":"A","explain":"猩红热患者需隔离至症状完全消失，或者治疗之日起不少于 7 天，避免传染给他人。"},{"id":404,"disease":"猩红热","type":"单选题","difficulty":"简单","q":"404、下列哪项不属于猩红热的高危人群？","options":["A、健康成年人","B、5-15岁儿童","C、与患者密切接触的人员","D、免疫力低下的儿童","E、托幼机构、学校的学生"],"answer":"A","explain":"健康成年人感染后多为隐性感染，不属于高危人群，其余均为高危人群。"},{"id":405,"disease":"猩红热","type":"单选题","difficulty":"简单","q":"405、猩红热的草莓舌是指？","options":["A、舌面红肿，乳头突出，形似草莓","B、舌面苍白","C、舌面溃疡","D、舌面萎缩","E、舌面发黑"],"answer":"A","explain":"猩红热患者舌面红肿，乳头突出，形似草莓，称为草莓舌，是典型体征之一。"},{"id":406,"disease":"猩红热","type":"单选题","difficulty":"简单","q":"406、下列哪种抗生素不是治疗猩红热的药物？","options":["A、青霉素","B、阿莫西林","C、头孢类抗生素","D、红霉素","E、四环素"],"answer":"E","explain":"青霉素是治疗猩红热的首选药物，可有效杀灭A组β型溶血性链球菌，缩短病程，减少并发症。对青霉素过敏者，可以头孢菌素或红霉素类"},{"id":407,"disease":"猩红热","type":"单选题","difficulty":"简单","q":"407、猩红热的预防措施中，最关键的是？","options":["A、早期发现并隔离治疗患者，切断传播途径","B、接种疫苗","C、预防性使用抗生素","D、加强体育锻炼","E、以上都不是"],"answer":"A","explain":"依据《猩红热诊疗方案（2023年版）》，猩红热的预防最关键的是早期发现并隔离治疗患者，切断呼吸道传播途径，目前暂无专用疫苗。"},{"id":408,"disease":"猩红热","type":"单选题","difficulty":"简单","q":"408、猩红热患者出现咽峡炎时，护理重点是？","options":["A、保持口腔清洁，给予温凉、软烂、易消化的食物","B、禁食禁水","C、大量使用抗生素","D、强制进食","E、增加运动"],"answer":"A","explain":"咽峡炎时，需保持口腔清洁，给予温凉、软烂、易消化的食物，避免刺激咽喉，减轻疼痛。"},{"id":409,"disease":"猩红热","type":"单选题","difficulty":"简单","q":"409、下列哪项不是猩红热的传播途径？","options":["A、蚊虫叮咬传播","B、呼吸道飞沫传播","C、接触被污染的物品传播","D、经皮肤伤口感染","E、经产道感染"],"answer":"A","explain":"猩红热无虫媒传播途径，蚊虫叮咬不会传播猩红热。"},{"id":410,"disease":"猩红热","type":"单选题","difficulty":"简单","q":"410、猩红热患者的皮疹特点是？","options":["A、全身弥漫性鲜红色针尖大小丘疹，压之褪色，伴瘙痒，疹退后伴脱屑","B、大水疱，疱内液体多","C、仅出现在躯干部位","D、结痂后留疤","E、无瘙痒"],"answer":"A","explain":"猩红热皮疹为全身弥漫性鲜红色针尖大小丘疹，压之褪色，伴瘙痒，疹退后伴脱屑，是典型特征。"},{"id":411,"disease":"猩红热","type":"单选题","difficulty":"简单","q":"411、学校、托幼机构预防猩红热的核心措施不包括？","options":["A、长期关闭学校、托幼机构","B、严格晨午检制度","C、发现患病学生及时隔离","D、加强环境消杀","E、开展健康宣教"],"answer":"A","explain":"学校、托幼机构预防猩红热的核心措施包括晨午检、隔离病例、环境消杀、健康宣教，长期关闭机构不现实。"},{"id":412,"disease":"猩红热","type":"单选题","difficulty":"简单","q":"412、猩红热属于哪类传染病？","options":["A、乙类传染病","B、甲类传染病","C、丙类传染病","D、丁类传染病","E、非法定传染病"],"answer":"A","explain":"猩红热属于我国法定乙类传染病，需按规定进行报告和管理。"},{"id":413,"disease":"猩红热","type":"单选题","difficulty":"困难","q":"413、猩红热最常见的严重并发症是？","options":["A、急性肾小球肾炎、风湿热","B、急性胃肠炎","C、泌尿系统感染","D、皮肤感染","E、中耳炎"],"answer":"A","explain":"急性肾小球肾炎、风湿热是猩红热最常见的严重并发症，多发生在病程2-3周，与链球菌感染后的免疫反应有关。"},{"id":414,"disease":"猩红热","type":"单选题","difficulty":"困难","q":"414、猩红热的发病机制主要是？","options":["A、链球菌产生的致热外毒素、溶血素等引发全身炎症反应","B、病毒直接侵犯细胞","C、真菌感染引发的炎症","D、支原体感染引发的炎症","E、衣原体感染引发的炎症"],"answer":"A","explain":"猩红热的发病机制主要是A组β型溶血性链球菌产生的致热外毒素、溶血素等引发全身炎症反应，导致发热、皮疹等症状。"},{"id":415,"disease":"猩红热","type":"单选题","difficulty":"困难","q":"415、猩红热的预防措施中，目前暂无以下哪种有效预防手段？","options":["A、专用疫苗","B、早期隔离患者","C、切断传播途径","D、密切接触者医学观察","E、以上都不是"],"answer":"A","explain":"依据《猩红热诊疗方案（2023年版）》，目前猩红热暂无专用疫苗，预防的关键是早期发现并隔离治疗患者，切断呼吸道传播途径，对密切接触者进行医学观察。"},{"id":416,"disease":"猩红热","type":"单选题","difficulty":"困难","q":"416、实验室检测猩红热急性期确诊的金标准是？","options":["A、咽拭子培养A组β型溶血性链球菌阳性","B、血常规白细胞升高","C、肝功能异常","D、肾功能异常","E、心肌酶升高"],"answer":"A","explain":"咽拭子培养A组β型溶血性链球菌阳性是猩红热急性期确诊的金标准。"},{"id":417,"disease":"猩红热","type":"单选题","difficulty":"困难","q":"417、猩红热患者的皮疹与麻疹皮疹的核心区别是？","options":["A、猩红热皮疹为全身弥漫性鲜红色针尖丘疹，麻疹皮疹为斑丘疹，有柯氏斑","B、猩红热皮疹仅出现在躯干，麻疹皮疹出现在四肢","C、猩红热皮疹瘙痒不明显，麻疹皮疹瘙痒剧烈","D、猩红热皮疹结痂后留疤，麻疹皮疹不留疤","E、猩红热皮疹在发热后3-4天出现，麻疹皮疹在发热后1-2天出现"],"answer":"A","explain":"猩红热皮疹为全身弥漫性鲜红色针尖丘疹，发热后1-2天出现；麻疹皮疹为斑丘疹，有特征性柯氏斑，发热后3-4天出现，可据此鉴别。"},{"id":418,"disease":"猩红热","type":"单选题","difficulty":"困难","q":"418、猩红热患者的密切接触者，应采取的措施是？","options":["A、医学观察7天，出现症状及时就医","B、立即隔离14天","C、预防性使用抗生素","D、无需任何措施","E、以上都不对"],"answer":"A","explain":"依据《猩红热诊疗方案（2023年版）》，猩红热患者的密切接触者应进行医学观察7天，期间出现发热、咽痛、皮疹等症状时应及时就医，明确诊断后及时隔离治疗。"},{"id":419,"disease":"猩红热","type":"单选题","difficulty":"困难","q":"419、猩红热的潜伏期为？","options":["A、1-7天","B、3-10天","C、1-12天","D、2-21天","E、1月以上"],"answer":"C","explain":"猩红热的潜伏期 1~12 天，多为 2~5 天。"},{"id":420,"disease":"猩红热","type":"单选题","difficulty":"困难","q":"420、学校发现猩红热病例后，正确的处置措施是？","options":["A、立即隔离患病学生，对环境进行终末消毒，开展晨午检，加强健康监测","B、立即关闭学校","C、对所有学生使用抗生素","D、对患病学生进行居家隔离，无需其他措施","E、对患病学生进行抗病毒治疗"],"answer":"A","explain":"学校发现病例后，需立即隔离患病学生，终末消毒环境，加强晨午检和健康监测，避免疫情扩散。"},{"id":421,"disease":"猩红热","type":"单选题","difficulty":"困难","q":"421、猩红热患者使用青霉素治疗的疗程一般为？","options":["A、7-10天","B、3-5天","C、1-2天","D、2周","E、1个月"],"answer":"A","explain":"猩红热患者青霉素治疗疗程一般为7-10天，可彻底清除链球菌，减少并发症发生。"},{"id":422,"disease":"猩红热","type":"单选题","difficulty":"困难","q":"422、下列哪项不是猩红热防控的核心措施？","options":["A、大规模人群使用抗生素预防","B、加强疫情监测","C、隔离患者，切断传播途径","D、加强学校、托幼机构等重点场所防控","E、开展健康宣教"],"answer":"A","explain":"大规模使用抗生素无法预防猩红热，反而可能引发耐药性，不是防控核心措施。"},{"id":423,"disease":"猩红热","type":"多选题","difficulty":"简单","q":"423、猩红热的典型临床表现有？","options":["A、突发高热","B、咽峡炎、扁桃体红肿伴脓性分泌物","C、草莓舌","D、全身弥漫性鲜红色皮疹","E、疹退后脱屑"],"answer":"ABCDE","explain":"以上均为猩红热的典型临床表现和体征。"},{"id":424,"disease":"猩红热","type":"多选题","difficulty":"简单","q":"424、预防猩红热的有效措施包括？","options":["A、隔离患者，切断传播途径","B、避免接触患者","C、加强环境消杀","D、开展健康宣教","E、大量服用抗生素"],"answer":"ABCD","explain":"隔离患者、避免接触病例、环境消杀、健康宣教为有效预防措施，大量服用抗生素无效且有风险。"},{"id":425,"disease":"猩红热","type":"多选题","difficulty":"简单","q":"425、治疗猩红热的有效药物包括？","options":["A、青霉素","B、阿莫西林","C、头孢类抗生素","D、红霉素","E、四环素"],"answer":"ABCD","explain":"青霉素为首选药物，阿莫西林、头孢类、红霉素均为有效治疗药物，四环素一般不用于儿童。"},{"id":426,"disease":"猩红热","type":"多选题","difficulty":"简单","q":"426、猩红热的治疗原则包括以下哪些？","options":["A、消除链球菌感染","B、缓解症状","C、预防并发症","D、大剂量使用糖皮质激素","E、预防性使用抗病毒药物"],"answer":"ABC","explain":"依据《猩红热诊疗方案（2023年版）》，猩红热的治疗原则旨在消除链球菌感染，缓解症状，并预防并发症，治疗措施包括休息、呼吸道隔离、抗生素治疗和对症治疗，无需常规使用糖皮质激素和抗病毒药物。"},{"id":427,"disease":"猩红热","type":"多选题","difficulty":"困难","q":"427、猩红热的预防措施包括以下哪些？","options":["A、早期发现并隔离治疗患者","B、切断呼吸道传播途径","C、对密切接触者进行医学观察","D、接种专用疫苗","E、预防性使用抗生素"],"answer":"ABC","explain":"依据《猩红热诊疗方案（2023年版）》，猩红热的预防措施包括早期发现并隔离治疗患者、切断呼吸道传播途径、对密切接触者进行医学观察，目前暂无专用疫苗，不推荐预防性使用抗生素。"},{"id":428,"disease":"猩红热","type":"多选题","difficulty":"困难","q":"428、猩红热的病原学检测方法包括？","options":["A、细菌培养阳性","B、核酸检测阳性","C、抗原检测阳性","D、抗体阳转或2倍以上增高","E、血常规检查"],"answer":"ABCD","explain":"猩红热病原学检测方法1.扁桃体或伤口等处分泌物或渗出物培养到 GAS；2.咽拭子等标本中 GAS 核酸检测阳性；3.GAS 抗原检测阳性；4. ASO 阳转或恢复期较急性期滴度呈 2 倍及以上升高"},{"id":429,"disease":"猩红热","type":"多选题","difficulty":"困难","q":"429、关于猩红热的描述，正确的有？","options":["A、由A组β型溶血性链球菌感染引起","B、主要通过呼吸道飞沫传播","C、5-15岁儿童为高发人群","D、冬春季为高发季节","E、目前已有有效疫苗可预防"],"answer":"ABCD","explain":"猩红热由A组β型溶血性链球菌感染引起，主要经呼吸道飞沫传播，5-15岁儿童高发，冬春季流行，目前尚无有效疫苗。"},{"id":430,"disease":"猩红热","type":"判断题","difficulty":"简单","q":"430、猩红热是由A组β型溶血性链球菌感染引起的急性呼吸道传染病。","options":["A、正确","B、错误"],"answer":"A","explain":"猩红热的病原体为A组β型溶血性链球菌，属于急性呼吸道传染病。"},{"id":431,"disease":"猩红热","type":"判断题","difficulty":"简单","q":"431、猩红热的主要传播途径是呼吸道飞沫传播。","options":["A、正确","B、错误"],"answer":"A","explain":"猩红热主要通过呼吸道飞沫传播，也可通过接触被污染的物品传播。"},{"id":432,"disease":"猩红热","type":" 、利福平","C、磺胺类药物","D、头孢类抗生素","E、喹诺酮类药物"],"answer":"ABCDE","explain":"多西环素、利福平、磺胺类药物、头孢类抗生素、喹诺酮类药物都可用于治疗布鲁氏菌病。"},{"id":469,"disease":"布鲁氏菌病","type":"多选题","difficulty":"简单","q":"469、布鲁氏菌病的分期包括？","options":["A、急性期","B、亚急性期","C、慢性期","D、恢复期","E、后遗症期"],"answer":"ABC","explain":"布鲁氏菌病临床上分为急性期、亚急性期和慢性期，无恢复期和后遗症期的明确分期。"},{"id":470,"disease":"布鲁氏菌病","type":"多选题","difficulty":"简单","q":"470、下列哪些人群是布鲁氏菌病的高危人群？","options":["A、牧民","B、兽医","C、屠宰工","D、畜产品加工人员","E、医护人员"],"answer":"ABCD","explain":"牧民、兽医、屠宰工、畜产品加工人员都是布鲁氏菌病的高危人群，医护人员不是主要的高危人群。"},{"id":471,"disease":"布鲁氏菌病","type":"多选题","difficulty":"困难","q":"471、关于布鲁氏菌病的发病机制，下列说法正确的有？","options":["A、布鲁氏菌为胞内寄生菌，主要在单核-吞噬细胞内繁殖","B、细菌的内毒素是主要的致病物质，可引起发热、休克等症状","C、机体的细胞免疫在清除细菌中起主导作用","D、体液免疫可通过调理作用增强吞噬细胞的吞噬能力","E、细菌可通过血液循环扩散到全身多个器官，形成多发性病灶"],"answer":"ABCDE","explain":"以上选项均正确描述了布鲁氏菌病的发病机制，包括细菌的寄生特性、致病物质、机体的免疫反应和扩散过程。"},{"id":472,"disease":"布鲁氏菌病","type":"多选题","difficulty":"困难","q":"472、布鲁氏菌病的并发症包括？","options":["A、关节炎","B、睾丸炎、附睾炎","C、脑膜炎、脑炎","D、心内膜炎、心肌炎","E、肝炎、脾肿大"],"answer":"ABCDE","explain":"以上都是布鲁氏菌病的常见并发症，可累及骨关节、生殖系统、神经系统、心血管系统、肝脾等多个器官。"},{"id":473,"disease":"布鲁氏菌病","type":"判断题","difficulty":"简单","q":"473、布鲁氏菌病是由布鲁氏菌引起的人畜共患传染病，又称波状热。","options":["A、正确","B、错误"],"answer":"A","explain":"布鲁氏菌病又称波状热、马耳他热，是由布鲁氏菌感染引起的人畜共患传染病，该描述正确。"},{"id":474,"disease":"布鲁氏菌病","type":"判断题","difficulty":"简单","q":"474、布鲁氏菌病属于我国甲类法定传染病。","options":["A、正确","B、错误"],"answer":"B","explain":"布鲁氏菌病属于我国乙类法定传染病，不是甲类。"},{"id":475,"disease":"布鲁氏菌病","type":"判断题","difficulty":"简单","q":"475、牛、羊等家畜是布鲁氏菌病的主要传染源。","options":["A、正确","B、错误"],"answer":"A","explain":"牛、羊等家畜是布鲁氏菌病的主要传染源，患者一般不作为主要传染源，该描述正确。"},{"id":476,"disease":"布鲁氏菌病","type":"判断题","difficulty":"简单","q":"476、布鲁氏菌病最常见的传播途径是呼吸道传播。","options":["A、正确","B、错误"],"answer":"B","explain":"布鲁氏菌病最常见的传播途径是接触传播，不是呼吸道传播。"},{"id":477,"disease":"布鲁氏菌病","type":"判断题","difficulty":"简单","q":"477、布鲁氏菌病典型的热型是波状热。","options":["A、正确","B、错误"],"answer":"A","explain":"布鲁氏菌病典型的热型为波状热，体温反复升降，该描述正确。"},{"id":478,"disease":"布鲁氏菌病","type":"判断题","difficulty":"简单","q":"478、血培养分离到布鲁氏菌可以确诊诊断布鲁氏菌病。","options":["A、正确","B、错误"],"answer":"A","explain":"血培养或骨髓培养分离到布鲁氏菌是诊断布鲁氏菌病的金标准，该描述正确。"},{"id":479,"disease":"布鲁氏菌病","type":"判断题","difficulty":"简单","q":"479、布鲁氏菌病属于乙类传染病，发现病例后应于24小时内进行网络报告。","options":["A、正确","B、错误"],"answer":"A","explain":"布鲁氏菌病属于《中华人民共和国传染病防治法》规定的乙类传染病，责任报告单位和责任疫情报告人发现布鲁氏菌病病例后，应于24小时内进行网络报告。"},{"id":480,"disease":"布鲁氏菌病","type":"判断题","difficulty":"困难","q":"480、羊种布鲁氏菌对人的致病力最强，是我国布鲁氏菌病的主要流行菌株。","options":["A、正确","B、错误"],"answer":"A","explain":"羊种布鲁氏菌对人的致病力最强，感染后症状最重，最易转为慢性，是我国布鲁氏菌病的主要流行菌株，该描述正确。"},{"id":481,"disease":"布鲁氏菌病","type":"判断题","difficulty":"困难","q":"481、布鲁氏菌病慢性期患者仅需对症治疗，无需再进行抗菌治疗。","options":["A、正确","B、错误"],"answer":"B","explain":"布鲁氏菌病慢性期患者仍需进行规范的抗菌治疗，疗程需延长至6个月以上，仅对症治疗会导致病情反复。"},{"id":482,"disease":"布鲁氏菌病","type":"判断题","difficulty":"困难","q":"482、人用布鲁氏菌疫苗是预防布鲁氏菌病的核心措施，所有人群都应常规接种。","options":["A、正确","B、错误"],"answer":"B","explain":"人用布鲁氏菌疫苗仅用于牧民、兽医、屠宰工等高危职业人群，并非所有人群都应常规接种，给家畜接种疫苗才是最根本的预防措施。"},{"id":483,"disease":"食源性疾病","type":"单选题","difficulty":"简单","q":"483、食源性疾病的核心定义是？","options":["A、通过摄食进入人体的病原体、有毒有害物质引起的，通常具有感染性或中毒性的一类疾病","B、仅由细菌感染引起的疾病","C、仅由病毒感染引起的疾病","D、仅由有毒化学物质引起的疾病","E、仅由寄生虫感染引起的疾病"],"answer":"A","explain":"食源性疾病的核心定义为：通过摄食进入人体的病原体、有毒有害物质引起的，通常具有感染性或中毒性的一类疾病，包括细菌性、病毒性、寄生虫性、化学性等多种类型。"},{"id":484,"disease":"食源性疾病","type":"单选题","difficulty":"简单","q":"484、下列哪项不属于食源性疾病的常见病原体？","options":["A、沙门氏菌","B、诺如病毒","C、布鲁氏菌","D、流感病毒","E、副溶血性弧菌"],"answer":"D","explain":"流感病毒主要通过呼吸道传播，不属于食源性疾病的常见病原体；其余选项均为可通过食物传播的食源性疾病病原体。"},{"id":485,"disease":"食源性疾病","type":"单选题","difficulty":"简单","q":"485、食源性疾病的主要传播途径是？","options":["A、消化道传播（经口摄入被污染的食物、水）","B、呼吸道飞沫传播","C、血液传播","D、母婴传播","E、性传播"],"answer":"A","explain":"食源性疾病的核心传播途径是消化道传播，即经口摄入被病原体、有毒有害物质污染的食物、水而感染发病。"},{"id":486,"disease":"食源性疾病","type":"单选题","difficulty":"简单","q":"486、预防食源性疾病最核心的措施是？","options":["A、注意饮食卫生，不吃生冷、不洁、变质的食物，生熟食品分开处理","B、长期佩戴口罩","C、大量服用抗生素","D、减少外出","E、频繁消毒衣物"],"answer":"A","explain":"注意饮食卫生，不吃生冷、不洁、变质的食物，生熟食品分开处理，是预防食源性疾病最核心、最有效的措施。"},{"id":487,"disease":"食源性疾病","type":"单选题","difficulty":"简单","q":"487、食源性疾病的高发场所不包括？","options":["A、户外空旷广场","B、集体食堂","C、酒店、餐馆","D、食品加工企业","E、家庭厨房"],"answer":"A","explain":"集体食堂、酒店、餐馆、食品加工企业、家庭厨房是食源性疾病的高发场所，户外空旷广场不是。"},{"id":488,"disease":"食源性疾病","type":"单选题","difficulty":"简单","q":"488、发现食源性疾病聚集性疫情后，首要的处置措施是？","options":["A、立即停止食用可疑污染食物，隔离病例，开展流行病学调查，排查可疑食物","B、立即关闭所有餐饮场所","C、对所有人员使用抗生素","D、对环境进行全面消毒","E、开展健康宣教"],"answer":"A","explain":"发现食源性疾病聚集性疫情后，首要处置措施为立即停止食用可疑污染食物，隔离病例，开展流行病学调查，排查可疑食物，查明传染源和污染原因，防止疫情扩散。"},{"id":489,"disease":"食源性疾病","type":"单选题","difficulty":"简单","q":"489、下列哪项不是食源性疾病的典型症状？","options":["A、视力下降","B、呕吐、腹泻","C、恶心、腹痛","D、发热、头痛","E、脱水症状"],"answer":"A","explain":"呕吐、腹泻、恶心、腹痛、发热、头痛、脱水为食源性疾病的典型症状，视力下降罕见。"},{"id":490,"disease":"食源性疾病","type":"单选题","difficulty":"简单","q":"490、食源性疾病的高发季节是？","options":["A、夏秋季","B、冬春季","C、全年无差别","D、冬季","E、春季"],"answer":"A","explain":"食源性疾病多在夏秋季高发，与高温高湿环境利于细菌、病毒等病原体繁殖，食物易腐败变质有关。"},{"id":491,"disease":"食源性疾病","type":"单选题","difficulty":"简单","q":"491、食源性疾病暴发疫情的定义是，在短时间内，同一地点、同一食物来源引起的至少多少例以上的病例？","options":["A、2例","B、5例","C、10例","D、20例","E、50例"],"answer":"A","explain":"依据指南，食源性疾病暴发疫情是指在短时间内，同一地点、同一食物来源引起的2例及以上的食源性疾病病例。"},{"id":492,"disease":"食源性疾病","type":"单选题","difficulty":"简单","q":"492、下列哪项不属于食源性疾病的高危人群？","options":["A、健康青壮年","B、婴幼儿","C、老年人","D、免疫力低下者","E、孕妇"],"answer":"A","explain":"健康青壮年感染后多为轻症，不属于高危人群，其余均为高危人群，感染后症状更重，更易发生严重并发症。"},{"id":493,"disease":"食源性疾病","type":"单选题","difficulty":"简单","q":"493、下列哪种行为不会增加食源性疾病的感染风险？","options":["A、饭前便后规范洗手，生熟食品分开处理","B、食用生冷、不洁的食物","C、共用餐具、水杯","D、接触被污染的食物、水","E、食用变质的食物"],"answer":"A","explain":"规范洗手、生熟食品分开处理可有效切断传播途径，不会增加感染风险，其余均为高风险行为。"},{"id":494,"disease":"食源性疾病","type":"单选题","difficulty":"简单","q":"494、食源性疾病患者出现呕吐、腹泻时，首要的护理措施是？","options":["A、及时补液，防止脱水和电解质紊乱","B、禁食禁水","C、大量使用止泻药","D、强制进食","E、增加运动"],"answer":"A","explain":"呕吐、腹泻易引发脱水和电解质紊乱，及时补液为首要护理措施，轻症患者可口服补液盐，重症患者需静脉补液。"},{"id":495,"disease":"食源性疾病","type":"单选题","difficulty":"简单","q":"495、食源性疾病调查处置的核心原则是？","options":["A、先治疗，后调查","B、边调查，边控制，边救治","C、先控制疫情，再开展调查","D、先完成溯源，再采取控制措施","E、仅需救治患者，无需开展调查"],"answer":"B","explain":"食源性疾病调查处置的核心原则是\"边调查、边控制、边救治\"，三者同步开展，最大限度减少疫情危害。"},{"id":496,"disease":"食源性疾病","type":"单选题","difficulty":"简单","q":"496、实验室检测食源性疾病病例，首选的标本是？","options":["A、粪便、呕吐物、可疑食物","B、血液","C、尿液","D、痰液","E、脑脊液"],"answer":"A","explain":"粪便、呕吐物、可疑食物是实验室检测食源性疾病病例的首选标本，可用于检测细菌、病毒、寄生虫等病原体，明确病因。"},{"id":497,"disease":"食源性疾病","type":"单选题","difficulty":"简单","q":"497、下列哪种病原体引起的食源性疾病，潜伏期最短？","options":["A、沙门氏菌","B、诺如病毒","C、金黄色葡萄球菌肠毒素","D、布鲁氏菌","E、甲型肝炎病毒"],"answer":"C","explain":"金黄色葡萄球菌肠毒素引起的食源性疾病潜伏期最短，一般为1～6小时，多在进食后2～4小时发病；其余选项的潜伏期均长于该病原体。"},{"id":498,"disease":"食源性疾病","type":"单选题","difficulty":"简单","q":"498、食源性疾病暴发时间的报告时限是？","options":["A、2小时内","B、12小时内","C、24小时内","D、48小时内","E、72小时内"],"answer":"A","explain":"食源性疾病暴发疫情发现后需在2小时内进行网络报告。"},{"id":499,"disease":"食源性疾病","type":"单选题","difficulty":"简单","q":"499、食源性疾病疫情调查中，\"病例定义\"的核心作用是？","options":["A、确定患者的治疗方案","B、统一判断标准，准确识别和统计病例","C、确定疫情的严重程度","D、明确疫情的传播途径","E、追溯疫情的传染源"],"answer":"B","explain":"病例定义是疫情调查的核心基础，其作用是统一病例的判断标准，确保调查人员能够准确、一致地识别和统计病例，避免因判断标准不一导致的病例统计偏差。"},{"id":500,"disease":"食源性疾病","type":"单选题","difficulty":"简单","q":"500、食源性疾病疫情处置中，对可疑污染食物的正确处理方式是？","options":["A、立即封存、停止食用，开展实验室检测，查明污染原因","B、立即丢弃","C、继续食用","D、加热后食用","E、分发给他人食用"],"answer":"A","explain":"食源性疾病疫情处置中，对可疑污染食物应立即封存、停止食用，开展实验室检测，查明污染原因，严禁继续食用、加热后食用或分发给他人。"},{"id":501,"disease":"食源性疾病","type":"单选题","difficulty":"困难","q":"501、根据《食源性疾病调查处置指南》，下列哪项不属于食源性疾病暴发疫情的预警指标？","options":["A、同一单位/场所，3天内出现2例及以上有共同食物暴露史的病例","B、同一学校/托幼机构，1天内出现3例及以上呕吐腹泻病例","C、同一医疗机构，1天内接诊5例及以上有共同食物暴露史的急性消化道病例","D、同一地区，1周内出现10例及以上散发性急性肠胃炎病例","E、集体用餐单位，出现2例及以上食用同一餐次后发病的病例"],"answer":"D","explain":"食源性疾病暴发疫情的预警指标核心是\"有共同食物暴露史、同一时间/地点/餐次的聚集性病例\"，散发性急性肠胃炎病例无共同食物暴露史，不属于暴发疫情预警指标。"},{"id":502,"disease":"食源性疾病","type":"单选题","difficulty":"困难","q":"502、食源性疾病的流行病学调查核心目的是？","options":["A、查明可疑污染食物、污染源、污染途径、高危人群，制定针对性防控措施，防止疫情扩散","B、仅统计病例数量","C、仅检测病原体","D、仅治疗病例","E、仅开展健康宣教"],"answer":"A","explain":"食源性疾病流行病学调查的核心目的是查明可疑污染食物、污染源、污染途径、高危人群，制定针对性防控措施，防止疫情进一步扩散。"},{"id":503,"disease":"食源性疾病","type":"单选题","difficulty":"困难","q":"503、食源性疾病疫情调查中，开展病例对照研究的核心目的是？","options":["A、描述疫情的三间分布特征","B、验证可疑食物与发病的因果关联，确定致病食物","C、追溯疫情的传染源","D、评估疫情的严重程度","E、制定疫情的控制措施"],"answer":"B","explain":"病例对照研究是食源性疾病疫情调查中验证病因假设的核心方法，其核心目的是通过对比病例组和对照组的食物暴露情况，验证可疑食物与发病的因果关联，确定致病食物。"},{"id":504,"disease":"食源性疾病","type":"单选题","difficulty":"困难","q":"504、实验室检测食源性疾病病例，可快速明确细菌性病原体的方法是？","options":["A、实时荧光PCR核酸检测","B、细菌培养","C、病毒分离培养","D、血清抗体检测","E、血常规检查"],"answer":"A","explain":"实时荧光PCR核酸检测可快速、灵敏地检测粪便、呕吐物、可疑食物中的细菌核酸，数小时内即可明确病原体，是食源性疾病疫情处置中首选的快速检测方法。"},{"id":505,"disease":"食源性疾病","type":"单选题","difficulty":"困难","q":"505、下列哪项不属于食源性疾病的主动监测内容？","options":["A、医疗机构对急性消化道病例的食源性疾病相关信息采集","B、对食源性疾病病例标本开展病原学监测","C、对病例的可疑饮食史的流行病学调查","D、对重点人群（如餐饮从业人员、儿童）的健康监测","E、对同种病原体开展同源性检测"],"answer":"D","explain":"对重点人群（如餐饮从业人员、儿童）的健康监测不属于主动监测内容"},{"id":506,"disease":"食源性疾病","type":"单选题","difficulty":"困难","q":"506、食源性疾病疫情处置中，对食品加工场所、餐具进行终末消毒，重点消毒区域不包括？","options":["A、室外空旷区域","B、食品加工台面、设备","C、餐具、厨具","D、卫生间、垃圾桶","E、门把手、扶手"],"answer":"A","explain":"终末消毒重点针对食品加工、储存、备餐的室内环境及物品，室外空旷区域无需重点消毒。"},{"id":507,"disease":"食源性疾病","type":"单选题","difficulty":"困难","q":"507、下列哪种食源性疾病，属于化学性食源性疾病？","options":["A、亚硝酸盐中毒、农药残留中毒、重金属中毒","B、沙门氏菌感染","C、诺如病毒感染","D、蛔虫感染","E、河豚鱼中毒"],"answer":"A","explain":"亚硝酸盐中毒、农药残留中毒、重金属中毒属于化学性食源性疾病；沙门氏菌感染属于细菌性，诺如病毒感染属于病毒性，蛔虫感染属于寄生虫性，河豚鱼中毒属于有毒动植物性。"},{"id":508,"disease":"食源性疾病","type":"单选题","difficulty":"困难","q":"508、根据《食源性疾病调查处置指南》，食源性疾病疫情的责任报告人不包括下列哪项？","options":["A、医疗机构的接诊医生","B、疾病预防控制机构的工作人员","C、食品生产经营单位的负责人","D、发生疫情的单位负责人","E、食源性疾病的患者本人"],"answer":"E","explain":"食源性疾病疫情的责任报告人包括医疗机构接诊医生、疾控机构工作人员、食品生产经营单位负责人、疫情发生单位负责人等，患者本人不属于责任报告人，患者可通过就诊等方式向相关部门报告疫情。"},{"id":509,"disease":"食源性疾病","type":"单选题","difficulty":"困难","q":"509、下列哪项不是食源性疾病防控的核心措施？","options":["A、大规模人群使用抗生素预防","B、加强食品安全监管，从源头控制污染","C、加强食品生产、加工、经营环节管理","D、开展食品安全健康宣教","E、加强食源性疾病监测，早发现早报告"],"answer":"A","explain":"大规模使用抗生素无法预防食源性疾病，反而可能引发耐药性，不是防控核心措施。"},{"id":510,"disease":"食源性疾病","type":"单选题","difficulty":"困难","q":"510、关于食源性疾病的描述，错误的是？","options":["A、所有食源性疾病病例都需要使用抗生素治疗","B、最常见的病原体是沙门氏菌","C、主要通过消化道传播","D、夏秋季为高发季节","E、治疗核心为补液纠正脱水和电解质紊乱"],"answer":"A","explain":"病毒性、寄生虫性、化学性、有毒动植物性食源性疾病，无需使用抗生素治疗；仅细菌性食源性疾病，需根据药敏试验结果使用抗生素治疗。"},{"id":511,"disease":"食源性疾病","type":"多选题","difficulty":"简单","q":"511、食源性疾病的典型临床表现有？","options":["A、呕吐、腹泻","B、恶心、腹痛","C、发热、头痛","D、脱水症状","E、咳嗽、咳痰"],"answer":"ABCD","explain":"呕吐、腹泻、恶心、腹痛、发热、头痛、脱水为食源性疾病的典型症状，咳嗽咳痰不是核心症状。"},{"id":512,"disease":"食源性疾病","type":"多选题","difficulty":"简单","q":"512、预防食源性疾病的有效措施包括？","options":["A、注意饮食卫生，不吃生冷、不洁、变质的食物","B、生熟食品分开处理","C、饭前便后规范洗手","D、加强食品采购、储存、加工管理","E、大量服用抗生素"],"answer":"ABCD","explain":"注意饮食卫生、生熟分开、规范洗手、严格食品管理为有效预防措施，大量服用抗生素无效且有风险。"},{"id":513,"disease":"食源性疾病","type":"多选题","difficulty":"简单","q":"513、可有效灭活食源性疾病病原体的方法有？","options":["A、100℃煮沸2分钟以上","B、75%酒精消毒","C、含氯消毒剂消毒","D、紫外线照射","E、常温放置"],"answer":"ABCD","explain":"高温、75%酒精、含氯消毒剂、紫外线均可有效灭活食源性疾病的细菌、病毒等病原体，常温放置无法灭活。"},{"id":514,"disease":"食源性疾病","type":"多选题","difficulty":"简单","q":"514、发现食源性疾病聚集性疫情后，核心处置措施包括？","options":["A、立即停止食用可疑污染食物","B、隔离病例","C、开展流行病学调查，排查可疑食物","D、对环境、餐具进行终末消毒","E、立即关闭所有餐饮场所"],"answer":"ABCD","explain":"停止食用可疑食物、隔离病例、流行病学调查、环境终末消毒为疫情核心处置措施，立即关闭所有餐饮场所不现实。"},{"id":515,"disease":"食源性疾病","type":"多选题","difficulty":"困难","q":"515、食源性疾病疫情调查的核心步骤包括下列哪些？","options":["A、核实疫情，确定病例定义","B、开展流行病学调查，描述三间分布特征","C、采集样本，开展实验室检测","D、溯源调查，确定致病食物和污染环节","E、采取控制措施，防止疫情扩散"],"answer":"ABCDE","explain":"食源性疾病疫情调查的核心步骤包括：核实疫情、确定病例定义；流行病学调查、描述三间分布；样本采集与实验室检测；溯源调查、确定致病食物和污染环节；同步采取控制措施，防止疫情扩散。"},{"id":516,"disease":"食源性疾病","type":"多选题","difficulty":"困难","q":"516、食源性疾病的诊断依据包括下列哪些？","options":["A、流行病学暴露史，有共同食用可疑食物的经历","B、典型的消化道临床表现","C、实验室病原学检测，从患者粪便/呕吐物中检出相关病原体","D、从可疑食物中检出与患者一致的病原体","E、患者的血常规检查结果"],"answer":"ABCD","explain":"食源性疾病的诊断核心依据是流行病学暴露史、典型临床表现、实验室病原学检测结果、可疑食物与患者的病原体一致性；血常规检查结果仅为辅助判断，无法单独作为食源性疾病的诊断依据。"},{"id":517,"disease":"食源性疾病","type":"多选题","difficulty":"困难","q":"517、食源性疾病疫情调查中，病例对照研究的设计要点包括下列哪些？","options":["A、明确病例定义，确保病例组的诊断标准统一","B、对照组的选择，需与病例组在年龄、性别、居住环境等方面匹配，且无发病","C、统一设计调查问卷，全面收集所有研究对象的食物暴露信息","D、计算各食物的暴露率，对比病例组和对照组的差异","E、仅需调查病例组的食物暴露情况，无需调查对照组"],"answer":"ABCD","explain":"病例对照研究的设计要点包括：统一病例定义、选择匹配的对照组、统一设计调查问卷收集食物暴露信息、对比两组的食物暴露率差异；仅调查病例组无法完成病例对照研究，必须同步调查对照组。"},{"id":518,"disease":"食源性疾病","type":"判断题","difficulty":"简单","q":"518、食源性疾病最常见的病原体是沙门氏菌。","options":["A、正确","B、错误"],"answer":"A","explain":"沙门氏菌是全球范围内最常见的食源性疾病病原体，常污染肉类、蛋类、奶类等食物。"},{"id":519,"disease":"食源性疾病","type":"判断题","difficulty":"简单","q":"519、食源性疾病的核心传播途径是消化道传播，即经口摄入被污染的食物、水。","options":["A、正确","B、错误"],"answer":"A","explain":"食源性疾病的核心传播途径是消化道传播，经口摄入被病原体、有毒有害物质污染的食物、水是主要感染方式。"},{"id":520,"disease":"食源性疾病","type":"判断题","difficulty":"简单","q":"520、做好饮食卫生、规范洗手是预防食源性疾病最核心、最有效的措施。","options":["A、正确","B、错误"],"answer":"A","explain":"做好饮食卫生、生熟食品分开处理、规范洗手，是切断消化道传播途径、预防食源性疾病最核心的措施。"},{"id":521,"disease":"食源性疾病","type":"判断题","difficulty":"简单","q":"521、食源性疾病仅感染婴幼儿，成年人不会感染。","options":["A、正确","B、错误"],"answer":"B","explain":"食源性疾病全人群普遍易感，成年人也可感染，多为轻症或隐性感染。"},{"id":522,"disease":"食源性疾病","type":"判断题","difficulty":"简单","q":"522、食源性疾病多在夏秋季高发。","options":["A、正确","B、错误"],"answer":"A","explain":"夏秋季高温高湿，利于细菌、病毒等病原体繁殖，食物易腐败变质，是食源性疾病的高发季节。"},{"id":523,"disease":"食源性疾病","type":"判断题","difficulty":"简单","q":"523、发现食源性疾病聚集性疫情后，首要处置措施是对环境进行全面消毒。","options":["A、正确","B、错误"],"answer":"B","explain":"发现食源性疾病聚集性疫情后，首要处置措施为立即停止食用可疑污染食物，隔离病例，开展流行病学调查，排查密切接触者，查明传染源和传播途径，防止疫情扩散。"},{"id":524,"disease":"食源性疾病","type":"判断题","difficulty":"简单","q":"524、所有食源性疾病病例都需要使用抗生素治疗。","options":["A、正确","B、错误"],"answer":"B","explain":"病毒性、寄生虫性、化学性、有毒动植物性食源性疾病，无需使用抗生素治疗；仅细菌性食源性疾病，需根据药敏试验结果使用抗生素治疗。"},{"id":525,"disease":"食源性疾病","type":"判断题","difficulty":"困难","q":"525、食源性疾病的的原因包括生物性和化学性的。","options":["A、正确","B、错误"],"answer":"A","explain":"食源性疾病的的原因包括生物性和化学性的。"},{"id":526,"disease":"食源性疾病","type":"判断题","difficulty":"困难","q":"526、食源性疾病的流行病学调查核心目的是查明可疑污染食物、污染源、污染途径、高危人群，制定针对性防控措施，防止疫情扩散。","options":["A、正确","B、错误"],"answer":"A","explain":"食源性疾病流行病学调查的核心目的是查明传染源、传播途径、高危人群，制定针对性防控措施，防止疫情进一步扩散。"},{"id":527,"disease":"食源性疾病","type":"判断题","difficulty":"困难","q":"527、散发的食源性疾病病例的报告时限是2个工作日内。","options":["A、正确","B、错误"],"answer":"A","explain":"散发的食源性疾病病例的报告时限是2个工作日内。"}];
let pool=[],idx=0,ans={},sub={},mode='practice',timer=null,endAt=0;
let fav=[],wrong=[],history=[];
function lsGet(key, fallback){
  try{ var raw=localStorage.getItem(key); return raw?JSON.parse(raw):fallback; }catch(e){ return fallback; }
}
function lsSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}
function boot(){
  fav = lsGet('fav', []);
  wrong = lsGet('wrong', []);
  history = lsGet('history', []);
}
boot();
const $=function(id){return document.getElementById(id)};
function setTab(t,el){
  mode=t;
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
  if(el) el.classList.add('active');
  $('filters').classList.toggle('hidden', t!=='practice' && t!=='exam');
  if(t==='wrong') start('wrong');
  else if(t==='fav') start('fav');
  else if(t==='history') showHistory();
  else if(t==='practice') $('content').innerHTML='<div class="card panel"><h2>学习练习</h2><p>选择筛选条件后点“开始练习”。提交后立即显示答案和解析。</p></div>';
  else if(t==='exam') $('content').innerHTML='<div class="card panel"><h2>模拟考试</h2><p>点上方“设置模拟考试”，抽题计时，交卷后统一看分。</p></div>';
}
function filtered(){
  var d=$('disease').value,t=$('type').value,f=$('difficulty').value;
  return Q.filter(function(q){return (!d||q.disease===d)&&(!t||q.type===t)&&(!f||q.difficulty===f)});
}
function start(m){
  mode=m; idx=0; ans={}; sub={};
  var a;
  if(m==='wrong') a=Q.filter(function(q){return wrong.indexOf(q.id)>=0});
  else if(m==='fav') a=Q.filter(function(q){return fav.indexOf(q.id)>=0});
  else a=filtered().slice();
  a=a.slice().sort(function(){return Math.random()-0.5});
  if(m==='practice'){
    var n=+$('count').value;
    if(n) a=a.slice(0,n);
  }
  pool=a;
  render();
}
function openExam(){ $('modal').classList.add('show'); $('backdrop').classList.add('show'); }
function closeModal(){ $('modal').classList.remove('show'); $('backdrop').classList.remove('show'); }
function confirmExam(){
  closeModal(); mode='exam'; idx=0; ans={}; sub={};
  var a=filtered().slice().sort(function(){return Math.random()-0.5});
  var n=+$('examCount').value;
  pool=a.slice(0, Math.min(n,a.length));
  startTimer(+$('examTime').value*60);
  render();
}
function startTimer(sec){
  clearInterval(timer);
  endAt=Date.now()+sec*1000;
  timer=setInterval(function(){
    var s=Math.max(0, Math.ceil((endAt-Date.now())/1000));
    var e=$('timer');
    if(e) e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    if(!s){ clearInterval(timer); finish(); }
  },500);
}
function sel(q){
  var a=ans[q.id];
  return Array.isArray(a)?a:(a?[a]:[]);
}
function correct(q){
  return sel(q).slice().sort().join('')===String(q.answer).split('').sort().join('');
}
function pick(l){
  var q=pool[idx];
  if(sub[q.id]) return;
  if(q.type==='多选题'){
    var a=sel(q);
    ans[q.id]=a.indexOf(l)>=0?a.filter(function(x){return x!==l}):a.concat([l]).sort();
  }else{
    ans[q.id]=l;
  }
  render();
}
function submit(){
  var q=pool[idx];
  if(!sel(q).length){ alert('请先选择答案。'); return; }
  if(q.type==='多选题' && sel(q).length<2){ alert('多选题请至少选两项。'); return; }
  sub[q.id]=1;
  if(correct(q)) wrong=wrong.filter(function(x){return x!==q.id});
  else if(wrong.indexOf(q.id)<0) wrong.push(q.id);
  lsSet('wrong', wrong);
  render();
}
function move(n){
  idx=Math.max(0, Math.min(pool.length-1, idx+n));
  render();
}
function toggleFav(){
  var id=pool[idx].id;
  fav=fav.indexOf(id)>=0?fav.filter(function(x){return x!==id}):fav.concat([id]);
  lsSet('fav', fav);
  render();
}
function finish(){
  if(!pool.length) return;
  clearInterval(timer);
  var done=pool.filter(function(q){return sub[q.id]}).length;
  var right=pool.filter(function(q){return sub[q.id]&&correct(q)}).length;
  history.unshift({date:new Date().toLocaleString(),total:pool.length,done:done,right:right,rate:done?Math.round(right/done*100):0});
  history=history.slice(0,30);
  lsSet('history', history);
  $('content').innerHTML='<div class="card resultbox"><div class="score">'+(done?Math.round(right/done*100):0)+'%</div><p>答对 '+right+' / '+done+' 题，未提交 '+(pool.length-done)+' 题</p><div class="analysis"><div><b>'+pool.length+'</b><br>总题数</div><div><b>'+right+'</b><br>答对</div><div><b>'+(done-right)+'</b><br>答错</div></div><p><button class="btn primary" onclick="reviewExam()">查看逐题解析</button> <button class="btn" onclick="start(mode)">再来一次</button></p></div>';
  update();
}
function reviewExam(){
  for(var i=0;i<pool.length;i++){ if(ans[pool[i].id]) sub[pool[i].id]=1; }
  idx=0; render();
}
function optionText(x){
  return String(x||'').replace(/^[A-E][\.、．]\s*/,'');
}
function render(){
  if(!pool.length){
    var tip='当前没有符合条件的题目。';
    if(mode==='wrong') tip='错题本是空的。练习里答错的题会自动进来。';
    if(mode==='fav') tip='还没有收藏题目。做题时点“收藏”即可。';
    $('content').innerHTML='<div class="card panel">'+tip+'</div>';
    update(); return;
  }
  var q=pool[idx], s=sel(q), letters=['A','B','C','D','E'], out='';
  (q.options||[]).forEach(function(x,i){
    var l=letters[i];
    var c='option'+(s.indexOf(l)>=0?' selected':'');
    if(sub[q.id]) c+=' '+(String(q.answer).indexOf(l)>=0?'correct':(s.indexOf(l)>=0?'wrong':''));
    out+='<label class="'+c+'"><input type="'+(q.type==='多选题'?'checkbox':'radio')+'" name="a" value="'+l+'" '+(s.indexOf(l)>=0?'checked':'')+' '+(sub[q.id]?'disabled':'')+' onchange="pick(\''+l+'\')"><span><b>'+l+'.</b> '+esc(optionText(x))+'</span></label>';
  });
  $('content').innerHTML='<div class="layout"><main class="card question"><div class="meta"><span class="tag">'+esc(q.disease)+'</span><span class="tag">'+esc(q.type)+'</span><span class="tag">'+esc(q.difficulty)+'</span><span class="tag">'+(idx+1)+'/'+pool.length+'</span>'+(mode==='exam'?'<span class="tag" id="timer">--:--</span>':'')+'</div><div class="q">'+esc(q.q)+'</div>'+out+'<div class="actions"><button class="btn" onclick="move(-1)">上一题</button><div><button class="btn" onclick="toggleFav()">'+(fav.indexOf(q.id)>=0?'★ 已收藏':'☆ 收藏')+'</button> '+(mode==='exam'?'<button class="btn primary" onclick="finish()">交卷</button>':'<button class="btn primary" onclick="submit()">'+(sub[q.id]?'已提交':'提交答案')+'</button>')+'</div><button class="btn" onclick="move(1)">下一题</button></div>'+(sub[q.id]?'<div class="explain"><b>'+(correct(q)?'✓ 回答正确':'✗ 回答错误')+'　正确答案：'+esc(q.answer)+'</b><br>'+esc(q.explain||'暂无解析')+'</div>':'')+'</main><aside class="card side"><b>题号导航</b><div class="grid">'+pool.map(function(x,i){return '<button class="num '+(i===idx?'current ':'')+(sub[x.id]?(correct(x)?'right':'wrong'):(ans[x.id]?'done':''))+'" onclick="idx='+i+';render()">'+(i+1)+'</button>'}).join('')+'</div></aside></div>';
  if(mode==='exam'){
    var s2=Math.max(0, Math.ceil((endAt-Date.now())/1000));
    var t=$('timer'); if(t) t.textContent=Math.floor(s2/60)+':'+String(s2%60).padStart(2,'0');
  }
  update();
}
function update(){
  var done=pool.filter(function(q){return sub[q.id]}).length;
  var right=pool.filter(function(q){return sub[q.id]&&correct(q)}).length;
  $('stTotal').textContent=pool.length;
  $('stDone').textContent=done;
  $('stRight').textContent=right;
  $('stRate').textContent=(done?Math.round(right/done*100):0)+'%';
  $('bar').style.width=(pool.length?done/pool.length*100:0)+'%';
}
function showHistory(){
  var h=history.map(function(x){return '<tr><td>'+x.date+'</td><td>'+x.total+'</td><td>'+x.done+'</td><td>'+x.right+'</td><td>'+x.rate+'%</td></tr>'}).join('');
  $('content').innerHTML='<div class="card panel"><h2>成绩记录</h2><table><tr><th>时间</th><th>题数</th><th>作答</th><th>答对</th><th>正确率</th></tr>'+(h||'<tr><td colspan="5">暂无记录</td></tr>')+'</table></div>';
}
function clearData(){
  if(confirm('确定清空错题、收藏和成绩记录吗？')){
    ['wrong','fav','history'].forEach(function(x){ try{localStorage.removeItem(x)}catch(e){} });
    wrong=[]; fav=[]; history=[];
    alert('已清空。');
  }
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(ch){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
  });
}
setTab('practice', document.querySelector('.tab'));
</script>
</body>
</html>
